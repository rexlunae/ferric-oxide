[package]
name = "nvmed"
description = "NVM Express (NVMe) driver"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags.workspace = true
futures = "0.3"
libredox.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
redox_event.workspace = true
redox_syscall = { workspace = true, features = ["std"] }
smallvec.workspace = true

executor = { path = "../../executor" }
common = { path = "../../common" }
daemon = { path = "../../../daemon" }
driver-block = { path = "../driver-block" }
partitionlib = { path = "../partitionlib" }
pcid = { path = "../../pcid" }
# Ferric Oxide: NVMe data pointers for grant DMA (../../crates from userspace/base/).
ferric-blkgrant = { path = "../../../../../crates/blkgrant", optional = true }

[features]
default = []
# Ferric Oxide: DMA straight into applications' registered buffers (driver-block's grant
# slots, mapped with MapGrant), and transfers up to the controller's MDTS with PRP lists
# (features.toml: drivers.storage_grant_dma).
grant-dma = ["driver-block/grant-dma", "dep:ferric-blkgrant"]

[lints]
workspace = true
