[package]
name = "driver-block"
description = "Shared storage driver code"
version = "0.1.0"
edition = "2021"

[dependencies]
daemon = { path = "../../../daemon" }
executor = { path = "../../executor" }
partitionlib = { path = "../partitionlib" }
common = { path = "../../common" }

libredox.workspace = true
log.workspace = true
futures = { version = "0.3.28", features = ["executor"] }

redox_syscall = { workspace = true, features = ["std"] }
redox_event.workspace = true
redox-scheme.workspace = true
scheme-utils = { path = "../../../scheme-utils" }
redox-rings.workspace = true

zerocopy = "0.8.55"

# Ferric Oxide: registered-buffer grants on disk descriptors (shared crates of the repository,
# ../../crates from userspace/base/).
ferric-blkgrant = { path = "../../../../../crates/blkgrant", features = ["alloc"], optional = true }
ferric-regbuf = { path = "../../../../../crates/regbuf", optional = true }

[features]
default = []
# Ferric Oxide: lets applications attach registered-buffer grants to disk descriptors, so the
# device DMAs straight into their buffers (features.toml: drivers.storage_grant_dma).
grant-dma = ["dep:ferric-blkgrant", "dep:ferric-regbuf"]

[lints]
workspace = true
