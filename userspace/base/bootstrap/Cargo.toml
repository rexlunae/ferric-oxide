[package]
name = "bootstrap"
description = "Userspace bootstrapper"
version = "0.0.0"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
edition = "2024"
license = "MIT"

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = [
    "inline-more",
    "default-hasher",
] }
linked_list_allocator = "0.10"
libredox = { version = "0.1.25", default-features = false, features = ["protocol"] }
log = { version = "0.4", default-features = false }
plain = "0.2"
redox-initfs = { path = "../initfs", default-features = false }
redox_syscall = "0.9.4"
redox-scheme = { version = "0.11.2", default-features = false }
redox-path = "0.4.0"
slab = { version = "0.4.9", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
# Ferric Oxide: the kernel iommu scheme's number and name.
ferric-iommu = { path = "../../../crates/iommu" }
# Ferric Oxide: the kernel regbuf scheme's number and name.
ferric-regbuf = { path = "../../../crates/regbuf" }
# Ferric Oxide: the kernel trace scheme's number and name.
ferric-trace = { path = "../../../crates/trace" }
# Ferric Oxide: the kernel ring scheme's number and name.
ferric-ring = { path = "../../../crates/ring" }

[target.'cfg(target_os = "redox")'.dependencies]
redox-rt = { path = "../../../crates/relibc/redox-rt", default-features = false } # Ferric Oxide: in-tree relibc subtree

[lints.clippy]
perf = { level = "deny", priority = -1 }

[profile.release]
panic = "abort"
lto = "fat"
opt-level = "s"

[profile.dev]
panic = "abort"
opt-level = "s"

[patch.crates-io]
# Ferric Oxide: the in-tree kernel subtree supplies redox_syscall.
redox_syscall = { path = "../../../crates/kernel/syscall" }
