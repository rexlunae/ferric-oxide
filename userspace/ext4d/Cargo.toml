[package]
name = "ext4d"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only ext4 file system daemon for Ferric Oxide (features.toml fs.ext4), with optional journal replay (fs.ext4_journal_replay)"
publish = false

# Builds on its own, outside any workspace above it (the cookbook builds it for Redox; CI
# runs its host tests with --manifest-path).
[workspace]

[workspace.dependencies]
# Endian-aware on-disk records (#[derive(Endianize)]). Only what the records need:
# little-endian integers and bytes, the derive, and the std::io reads and writes the derive
# generates.
simple_endian = { version = "0.4.11", default-features = false, features = ["derive", "io-std", "little_endian", "integer_impls", "byte_impls"] }

[lib]
name = "ext4d"
path = "src/lib.rs"

[[bin]]
name = "ext4d"
path = "src/main.rs"

[features]
# Replay a volume's journal onto the disk before serving it (features.toml
# fs.ext4_journal_replay). Off by default: without it ext4d never writes. The journal
# superblock and inode map are read in every build (ferric-jbd2), as the same map finds the
# inodes whose change times `fstat` reports.
journal-replay = []
# Change the volume through its journal (features.toml fs.ext4_write): so far, a file's
# times, mode and owner, its data (allocating blocks), truncation and creating regular files. Off by default; needs the replay, since a
# volume is replayed before it is written.
write = ["journal-replay", "dep:crc", "dep:simple_endian"]

[dependencies]
ext4-view = { version = "1.0.0", features = ["std"] }
# The futimens sentinels (UTIME_NOW, UTIME_OMIT), shared with relibc.
ferric-abi = { path = "../../crates/abi" }
ferric-jbd2 = { path = "../../crates/jbd2" }
# The CRC16 of group descriptors on volumes with gdt_csum (write).
crc = { version = "3.3", default-features = false, optional = true }
# The extent, directory and group descriptor records allocation writes (write).
simple_endian = { workspace = true, optional = true }
log = "0.4.27"
# Errno values and the Stat layout of the scheme ABI; usable on the host too.
redox_syscall = { version = "0.9.5", features = ["std"] }
thiserror = "2.0.17"

[dev-dependencies]
flate2 = "1"

[target.'cfg(target_os = "redox")'.dependencies]
libredox = "0.1.25"
redox-scheme = "0.11.4"

[profile.release]
debug = false
