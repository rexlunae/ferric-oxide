# Ferric Oxide feature catalog
#
# This file describes every option that `make menuconfig` (tools/ferric-config)
# shows and that ferric.toml may set. It is the schema, not your configuration:
# put your choices in ferric.toml (untracked, like .config). Only options you
# set explicitly are written there; everything else follows the defaults below.
#
# Option ids are dotted paths, and ferric.toml uses the same nesting:
#
#     [cpu]
#     x86_64_level = "v4"
#
#     [kernel]
#     numa = true
#
# Expressions (used by `depends`, `defaults[].when`, `effect[].when` and
# `rule[].when`) support option ids, `value` (the option being defined),
# string/number/bool literals, lists, == != < <= > >=, `in`, !, && and ||.
#
# Effects say how a value reaches the build:
#   make_var            assign a make variable (bool -> make_true/make_false)
#   kernel_feature      add a kernel Cargo feature when the bool is on
#   kernel_config       set a key in the kernel's config.toml
#   [[option.effect]]   anything else: make, make_append, packages,
#                       ignore_packages, source_packages (added as
#                       "source", so they build even with REPO_BINARY),
#                       packages_from_value, ignore_from_value, general,
#                       kernel_features
#   rebuild             recipes to mark stale when the value changes
#                       ("*" means every recipe)
# "{value}" in a string is replaced by the option's value.

[[menu]]
id = "target"
title = "Target"
help = "Architecture and board the image is built for."

[[menu]]
id = "cpu"
title = "Processor baseline"
help = """
The oldest CPU the userspace build has to run on. Raising the baseline lets
the compiler use newer instructions (AVX2, BMI2, FMA, AVX-512) everywhere
without runtime dispatch. Ferric Oxide targets modern processors, so the
default for x86-64 is level v3 (Intel Haswell / AMD Excavator and newer).

The kernel and bootloader are excluded by default: the kernel is built
soft-float without SSE/AVX, and its use of CPU features is controlled
under Kernel > CPU feature use instead."""

[[menu]]
id = "cpu.x86_64"
parent = "cpu"
title = "x86-64 CPU support"
help = "Minimum CPU baseline and independently selected x86-64 build variants."

[[menu]]
id = "cpu.aarch64"
parent = "cpu"
title = "ARM64 CPU support"
help = "Minimum CPU baseline and independently selected ARM64 build variants."

[[menu]]
id = "kernel"
title = "Kernel"
help = "Cargo features and build-time policy for the kernel."

[[menu]]
id = "kernel.cpu"
parent = "kernel"
title = "CPU feature use"
depends = "target.arch == 'x86_64'"
help = """
How the kernel uses optional CPU features. "always" assumes the feature
exists, "never" never uses it, and "auto" detects it at boot and patches
the code (needs Kernel > Self-modifying code; without it "auto" acts like
"never"). Defaults follow the processor baseline."""

[[menu]]
id = "kernel.tracing"
parent = "kernel"
title = "Tracing"
depends = "target.arch == 'x86_64'"
help = "Kernel tracepoints (Phase T): which are compiled in, and which are on from boot."

[[menu]]
id = "drivers"
title = "Drivers"
help = "Build-time options of the user-space drivers in the base package."

[[menu]]
id = "fs"
title = "File systems"
help = "File systems besides RedoxFS that the image can mount."

[[menu]]
id = "image"
title = "Image contents"
help = "Which filesystem configuration the image starts from, and changes on top of it."

[[menu]]
id = "packages"
title = "Package management"
help = "Which package manager the image ships and what packages say about themselves."

[[menu]]
id = "build"
title = "Build system"
help = "How the build itself runs."

[[menu]]
id = "qemu"
title = "Emulator (make qemu)"
help = "Settings used by `make qemu` when testing an image."

# ---------------------------------------------------------------- target

[[option]]
id = "target.arch"
menu = "target"
type = "choice"
title = "Architecture"
default = "x86_64"
make_var = "ARCH"
rebuild = ["*"]
help = "CPU architecture to build for. Sets ARCH."
choices = [
  { value = "x86_64", title = "x86-64 (AMD64)" },
  { value = "aarch64", title = "AArch64 (ARM64)" },
  { value = "riscv64gc", title = "RISC-V 64 (RV64GC)" },
]

[[option]]
id = "target.board"
menu = "target"
type = "string"
title = "Board"
default = ""
depends = "target.arch == 'aarch64'"
make_var = "BOARD"
help = "Sub-device for AArch64 images, for example raspi3bp. Empty means generic. Sets BOARD."

# ---------------------------------------------------------------- cpu

[[option]]
id = "cpu.x86_64_level"
menu = "cpu.x86_64"
type = "choice"
title = "Minimum x86-64 baseline"
default = "v3"
rebuild = ["*"]
help = """
psABI microarchitecture level for all userspace code.

  v1  baseline x86-64 (SSE2). Runs anywhere; no gain.
  v2  + SSE4.2, POPCNT, SSSE3, CMPXCHG16B. Nehalem / Bulldozer and newer.
  v3  + AVX, AVX2, BMI1/2, FMA, F16C, LZCNT, MOVBE, XSAVE.
      Haswell / Excavator / Zen and newer.
  v4  + AVX-512 F/BW/CD/DQ/VL. Skylake-SP, Ice Lake, Zen 4 and newer.

An image built for a level will not boot on an older CPU: the kernel
checks at boot and halts with a list of the missing features.
`make qemu` picks a matching emulated CPU when KVM is off.

v4 needs a kernel with AVX-512 state support (kernel.cpu.avx512), which
v4 turns on by default.

With packages.manager = "fox", v3 and v4 also pick the level of the
prebuilt and source-built fox packages synced into the image.
This baseline is independent of the variant checkboxes below. Normal builds use
the baseline; cargo xtask build --all-variants builds the checked variants."""
choices = [
  { value = "v1", title = "v1 (baseline)" },
  { value = "v2", title = "v2" },
  { value = "v3", title = "v3 (AVX2)" },
  { value = "v4", title = "v4 (AVX-512)" },
]

[[option.effect]]
when = "target.arch == 'x86_64' && value == 'v1'"
make = { QEMU_CPU = "core2duo" }

# The kernel checks the CPU against the level at boot and halts with a list of
# missing features, instead of user space dying later with an invalid opcode.
[[option.effect]]
when = "target.arch == 'x86_64' && value != 'v1'"
kernel_config = { "arch.x86_64.level" = "{value}" }

[[option.effect]]
when = "target.arch == 'x86_64' && value == 'v2'"
make = { QEMU_CPU = "Nehalem" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v2", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v2" }

[[option.effect]]
when = "target.arch == 'x86_64' && value == 'v3'"
make = { QEMU_CPU = "max", FERRIC_FOX_LEVEL = "v3" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v3", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v3" }

[[option.effect]]
when = "target.arch == 'x86_64' && value == 'v4'"
make = { QEMU_CPU = "max", FERRIC_FOX_LEVEL = "v4" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v4", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v4" }

[[option]]
id = "cpu.aarch64_level"
menu = "cpu.aarch64"
type = "choice"
title = "Minimum ARM64 baseline"
default = "armv8.0-a"
rebuild = ["*"]
help = """
Minimum Arm architecture version for userspace code.

  armv8.0-a  generic; runs on every 64-bit Arm core.
  armv8.2-a  + LSE atomics, FP16, RAS. Cortex-A55/A75, Neoverse N1, Apple M1.
  armv9-a    + SVE2. Cortex-A510/A710, Neoverse N2/V2."""
choices = [
  { value = "armv8.0-a", title = "ARMv8.0-A (generic)" },
  { value = "armv8.2-a", title = "ARMv8.2-A" },
  { value = "armv9-a", title = "ARMv9-A" },
]

[[option.effect]]
when = "target.arch == 'aarch64' && value == 'armv8.2-a'"
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-feature=+v8.2a", FERRIC_TARGET_CPPFLAGS = "-march=armv8.2-a" }

[[option.effect]]
when = "target.arch == 'aarch64' && value == 'armv9-a'"
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-feature=+v9a", FERRIC_TARGET_CPPFLAGS = "-march=armv9-a" }

[[option]]
id = "cpu.x86_64_v3"
menu = "cpu.x86_64"
type = "bool"
title = "Build x86-64-v3 (AVX2) variant"
default = true
depends = "cpu.x86_64_level != 'v4'"
help = "Include x86-64-v3 in cargo xtask build --all-variants. Independent of the v4 checkbox. Variants below the minimum baseline are inactive."

[[option]]
id = "cpu.x86_64_v4"
menu = "cpu.x86_64"
type = "bool"
title = "Build x86-64-v4 (AVX-512) variant"
default = false
defaults = [{ when = "cpu.x86_64_level == 'v4'", value = true }]
help = "Include x86-64-v4 in cargo xtask build --all-variants. This variant enables the matching kernel CPU-state policy; it does not change the saved minimum baseline."

[[option]]
id = "cpu.aarch64_v8_0"
menu = "cpu.aarch64"
type = "bool"
title = "Build ARMv8.0-A variant"
default = true
depends = "cpu.aarch64_level == 'armv8.0-a'"
help = "Include ARMv8.0-A in cargo xtask build --all-variants. Each ARM variant has an independent checkbox; variants below the minimum baseline are inactive."

[[option]]
id = "cpu.aarch64_v8_2"
menu = "cpu.aarch64"
type = "bool"
title = "Build ARMv8.2-A variant"
default = false
defaults = [{ when = "cpu.aarch64_level == 'armv8.2-a'", value = true }]
depends = "cpu.aarch64_level != 'armv9-a'"
help = "Include ARMv8.2-A in cargo xtask build --all-variants, independently of ARMv8.0-A and ARMv9-A."

[[option]]
id = "cpu.aarch64_v9"
menu = "cpu.aarch64"
type = "bool"
title = "Build ARMv9-A variant"
default = false
defaults = [{ when = "cpu.aarch64_level == 'armv9-a'", value = true }]
help = "Include ARMv9-A in cargo xtask build --all-variants. These builds currently produce separate images; combining architectures in one image is future work."

[[option]]
id = "cpu.extra_rustflags"
menu = "cpu"
type = "string"
title = "Extra target RUSTFLAGS"
default = ""
rebuild = ["*"]
help = "Appended to RUSTFLAGS for every userspace Rust package, e.g. \"-C target-feature=+aes\"."

[[option.effect]]
when = "value != ''"
make_append = { FERRIC_TARGET_RUSTFLAGS = "{value}" }

[[option]]
id = "cpu.extra_cflags"
menu = "cpu"
type = "string"
title = "Extra target C/C++ flags"
default = ""
rebuild = ["*"]
help = "Appended to CPPFLAGS (so C and C++) for every userspace package."

[[option.effect]]
when = "value != ''"
make_append = { FERRIC_TARGET_CPPFLAGS = "{value}" }

[[option]]
id = "cpu.frame_pointers"
menu = "cpu"
type = "bool"
title = "Keep frame pointers in user space"
default = false
rebuild = ["*"]
help = """
Build every userspace package with frame pointers (-fno-omit-frame-pointer for
C and C++, and -C force-frame-pointers=yes for Rust), so the kernel profiler
(kernel.profiling) can walk user stacks and `ferric-trace flamegraph` can show
whole call chains. Costs a register and a few instructions per call in C code.
Rust packages built by the cookbook already keep frame pointers on 64-bit
targets (redoxer adds the flag), so with this off only C and C++ code omits
them. Only packages built locally are covered: prebuilt packages
(build.repo_binary), prebuilt fox packages synced from packages.set, and the
toolchain's prebuilt libraries (the Rust standard library, libgcc) keep the
flags they were built with, so a chain may stop inside them."""

[[option.effect]]
when = "value"
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C force-frame-pointers=yes", FERRIC_TARGET_CPPFLAGS = "-fno-omit-frame-pointer" }

[[option]]
id = "cpu.flags_exclude"
menu = "cpu"
type = "list"
title = "Recipes built without baseline flags"
default = ["kernel", "bootloader"]
make_var = "FERRIC_TARGET_FLAGS_EXCLUDE"
rebuild = ["*"]
help = """
Recipes that never get the CPU baseline or extra flags. The kernel and
bootloader must stay here: they run before the FPU/AVX state is set up."""

# ---------------------------------------------------------------- kernel

[[option]]
id = "kernel.acpi"
menu = "kernel"
type = "bool"
title = "ACPI support"
default = true
kernel_feature = "acpi"
rebuild = ["kernel"]
help = "Parse ACPI tables (MADT, HPET, ...). Required for multi-core."

[[option]]
id = "kernel.multi_core"
menu = "kernel"
type = "bool"
title = "Multi-core (SMP)"
default = true
selects = ["kernel.acpi"]
kernel_feature = "multi_core"
rebuild = ["kernel"]
help = "Bring up application processors. Turning this off gives a single-CPU kernel, useful when bisecting races."

[[option]]
id = "kernel.aslr"
menu = "kernel"
type = "bool"
title = "Randomize user-space addresses (ASLR)"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "aslr"
rebuild = ["kernel", "relibc"]
help = """
Give every new address space a random starting point (32 bits, from RDRAND)
for mappings that do not ask for a fixed address: PIE executables, heaps,
thread stacks, shared libraries and file mappings. relibc's exec also puts
each program's main stack at a random page up to 16 GiB below the top of user
space (22 bits). Fixed mappings, such as non-PIE executables, are not moved.
Without RDRAND, everything is placed as upstream places it."""

# exec runs in the parent process, in relibc, so the stack part is a relibc
# feature.
[[option.effect]]
when = "value"
make_append = { FERRIC_RELIBC_FEATURES = "aslr" }

[[option]]
id = "kernel.prot_none"
menu = "kernel"
type = "bool"
title = "Enforce PROT_NONE mappings (guard pages)"
default = true
kernel_feature = "prot_none"
rebuild = ["kernel"]
help = """
Make PROT_NONE memory inaccessible from user space, so the guard page below
each thread stack catches overflows. Upstream maps PROT_NONE pages readable,
which turns guard pages into ordinary memory. The kernel itself can still read
such pages on behalf of a system call."""

[[option]]
id = "kernel.kaslr"
menu = "kernel"
type = "bool"
title = "Randomize the kernel memory layout (KASLR)"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "kaslr"
rebuild = ["kernel"]
help = """
Place the kernel's map of physical memory at a random 1 GiB-aligned address at
each boot (about 17 bits of randomness, from RDRAND), so a physical address no
longer gives away its kernel virtual address. Without RDRAND the map stays at
its usual place and the boot log says so. The separate kernel.kaslr_image
option randomizes the kernel image itself."""

[[option]]
id = "kernel.kaslr_image"
menu = "kernel"
type = "bool"
title = "Load the kernel at a random address (kernel image KASLR)"
default = true
depends = "target.arch == 'x86_64'"
rebuild = ["kernel", "bootloader"]
help = """
Have the bootloader map the kernel at a random page inside the 1 GiB window
reserved for it (about 18 bits of randomness, from RDRAND) instead of at its
link address. The kernel is linked with --emit-relocs so the bootloader can
fix up its absolute addresses for the new place first. Kernel stack traces
print link addresses, which match kernel.sym. Without RDRAND, or with a
kernel that has no relocations, the kernel loads at its link address."""

[[option.effect]]
when = "value"
make_append = { FERRIC_KERNEL_LINK_ARGS = "--emit-relocs", FERRIC_BOOTLOADER_FEATURES = "kaslr" }

[[option]]
id = "kernel.iommu"
menu = "kernel"
type = "choice"
title = "IOMMU DMA and interrupt remapping (Intel VT-d, AMD-Vi)"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.iommu"
rebuild = ["kernel"]
help = """
Turn on the IOMMUs the firmware lists: the Intel VT-d units of the DMAR table,
or, on machines with an IVRS table instead, the AMD-Vi units. Devices start in
one identity domain, so DMA addresses do not change and drivers work as before,
but translation, invalidation and fault reporting run on the hardware; DMA
faults are logged on the console. Firmware's reserved memory regions (RMRRs, or
IVMDs on AMD-Vi) stay mapped. VT-d units with queued invalidation use it. "auto" enables every unit
that the kernel can drive and logs why it skips the others; "never" leaves
the IOMMU off, as upstream does. "auto" and "enforce" also run a short boot
self-test of DMA domains and provide the kernel.iommu scheme: pcid uses it to
give each PCI driver a DMA domain of its own with the driver's device, its
requester-ID aliases and its reserved memory in it, and every driver started through
pcid_interface binds it before its first DMA allocation (a driver of several
functions keeps one domain). Once bound, memory:translation answers with
addresses in it: each buffer is pinned and mapped on its first translation,
made read-only for the device when the driver takes write access away, and
unmapped when the driver unmaps it or exits, so the device can reach only
memory its driver translated. "enforce" goes further: a process must bind a
domain with a device attached before memory:translation answers at all (EACCES
otherwise; a forked child starts unbound), and devices that no driver attached
to a domain are blocked rather than identity-mapped. Processes that use DMA
memory without a PCI device (lived, nbdd and usbscsid ring buffers) cannot get
DMA addresses under "enforce". On VT-d units with interrupt remapping (and queued
invalidation), "auto" and "enforce" also remap interrupts: each unit gets a
4096-entry table (32-bit x2APIC destinations when the kernel uses x2APIC),
pcid asks the kernel for an entry for every MSI and MSI-X vector a driver
requests, so the entry checks the device's requester ID, and the I/O APIC is
checked through a remappable entry at boot. Under both, the unit blocks
compatibility-format interrupts, so a device cannot send an interrupt pcid did
not set up. AMD-Vi units do not remap interrupts yet: they pass interrupts
through, and pcid gives drivers compatibility-format MSI messages."""
choices = ["auto", "enforce", "never"]

[[option]]
id = "kernel.numa"
menu = "kernel"
type = "bool"
title = "NUMA awareness"
default = false
depends = "kernel.multi_core"
kernel_feature = "numa"
rebuild = ["kernel"]
help = "Parse SRAT and keep per-node memory information. Experimental upstream."

[[option]]
id = "kernel.irq_percpu"
menu = "kernel"
type = "bool"
title = "Per-CPU interrupt delivery"
default = false
depends = "target.arch == 'x86_64' && kernel.multi_core"
kernel_feature = "irq-percpu"
rebuild = ["kernel"]
help = """
Count and deliver interrupts per (CPU, vector) in the irq: scheme (Phase 2.4),
so a vector reserved on one CPU (irq:cpu-XX/N) is a different interrupt from
the same vector number on another, and each CPU counts its interrupts without
a shared lock. Adds the root-only irq:cpus file, which maps each running
logical CPU to its APIC id and NUMA node, and lists CPUs under irq: by logical
id. Root can move a reserved vector to another CPU with the irq: handle's
Move call. The groundwork for per-core NVMe and NIC queues. Off by default; without
it, irq: counts interrupts by vector number alone, as upstream."""

[[option]]
id = "kernel.regbuf"
menu = "kernel"
type = "bool"
title = "Registered buffers and zero-copy grants"
default = false
kernel_feature = "regbuf"
rebuild = ["kernel"]
help = """
Provide the kernel.regbuf scheme (Phase 2.2). An application registers a range
of its memory once into a region, which pins the pages, then hands a scheme a
grant: a read-only or read-write, revocable right to part of the region, as a
file descriptor. The scheme maps the grant and reads or writes the
application's pages directly instead of copying them. Revoking a grant, or
closing the region, unmaps it from every process that mapped it, with a TLB
shootdown, before the call returns. Non-root users may pin 16 MiB each, and
everyone together a quarter of memory. Off by default; without it the kernel
has no such scheme, as upstream."""

[[option]]
id = "kernel.rings"
menu = "kernel"
type = "bool"
title = "Submission/completion rings for every scheme"
default = false
kernel_feature = "rings"
rebuild = ["kernel"]
help = """
Provide the kernel.ring scheme (Phase 2.3). An application maps a ring, a
submission queue and a completion queue in memory it shares with the kernel,
writes requests (read, write, fsync) into it, and submits a whole batch with
one system call; each request gets a completion entry. Requests can be linked
so that the next one runs only if the previous one succeeded, across different
schemes (read a file, write it to a pipe) without returning to the
application in between. The kernel runs each request as the ordinary system
call on the application's descriptor, so every existing scheme works with it
unchanged. Off by default; without it the kernel has no such scheme, as
upstream."""

[[option]]
id = "kernel.page_cache"
menu = "kernel"
type = "bool"
title = "Shared page cache (read path)"
default = false
kernel_feature = "page_cache"
rebuild = ["kernel"]
help = """
Provide the kernel.pcache scheme (Phase 2.6). A file system keeps the contents
of the files it chooses to cache in kernel objects, and the kernel serves read
and pread of those files from them, copying from memory with no round trip to
the file system once the pages are there. A miss becomes a fill request on the
file system's queue, with readahead past it; a failed fill fails its readers
with EIO and the next read tries again. RedoxFS caches the files its clients
open read-only; writes still go to RedoxFS, which drops the pages they change.
Mappings, cached writes and reclaim come later, so an object keeps every page
read until the file system closes it. Off by default; without it the kernel
has no such scheme and every read goes to the file system, as upstream."""

[[option]]
id = "drivers.rtl8125"
menu = "drivers"
type = "bool"
title = "Experimental Realtek RTL8125B Ethernet driver"
default = false
depends = "target.arch == 'x86_64'"
rebuild = ["base"]
help = """
Build and install rtl8125d and its PCI match for the RTL8125B controller.
The controller model is host-tested, but physical hardware validation is
pending. This driver uses BSD-4-Clause vendor firmware tables; their notice
is installed with the driver. Off by default, preserving the upstream driver
set when no ferric.toml is present. Other RTL8125 revisions are refused."""

[[option.effect]]
when = "value"
make_append = { FERRIC_BASE_DRIVERS = "rtl8125d" }

[[option]]
id = "drivers.grant_dma"
menu = "drivers"
type = "bool"
title = "Storage DMA into registered buffers (NVMe)"
default = false
depends = "kernel.regbuf && kernel.iommu != 'never'"
rebuild = ["base"]
help = """
Let applications attach a registered-buffer grant (Kernel > Registered buffers)
to a disk or partition descriptor of nvmed's disk scheme, then read and write
blocks straight between the disk and their own pages: the driver maps the grant
into its IOMMU DMA domain once (MapGrant) and points the controller at it, with
no bounce buffer, no copy and no per-request mapping. The device can reach the
granted pages and nothing else of the application, and revoking the grant
stops it before Revoke returns. Needs an IOMMU (VT-d or AMD-Vi) with
kernel.iommu "auto" or "enforce"; without a DMA domain attaching fails with
ENODEV. Also lets nvmed's zero-copy transfers (RedoxFS's ring included) use
PRP lists up to the controller's maximum transfer size instead of two pages.
Builds nvmed with its grant-dma Cargo feature. Off by default; without it the
disk schemes refuse grants, as upstream."""

[[option.effect]]
when = "value"
make_append = { FERRIC_INITFS_FEATURES = "nvmed/grant-dma" }

[[option]]
id = "drivers.nvme_percore"
menu = "drivers"
type = "bool"
title = "Per-CPU NVMe queue pairs"
default = false
depends = "kernel.irq_percpu"
rebuild = ["base"]
help = """
Give nvmed one I/O queue pair per online CPU (Phase 2.4), as many as the
controller grants (Set Features, Number of Queues) and its MSI-X table has
entries for. Each pair's completion queue interrupts its own CPU through its own
MSI-X entry, spread over the CPUs in irq:cpus, and a worker thread pinned to
that CPU serves it with its own executor and bounce buffer. The admin queue
stays on the BSP. The disk scheme hands reads and writes to the workers in turn;
it cannot see the caller's CPU yet. Needs Kernel > Per-CPU interrupt delivery.
Builds nvmed with its percore Cargo feature. Off by default; without it nvmed
has one I/O queue pair on the BSP, as upstream."""

[[option.effect]]
when = "value"
make_append = { FERRIC_INITFS_FEATURES = "nvmed/percore" }

[[option]]
id = "drivers.nvmed_perf"
menu = "drivers"
type = "bool"
title = "nvmed request-phase timing"
default = false
rebuild = ["base"]
help = """
Build nvmed with its perf Cargo feature. Buffered and DMA requests each record
whole-request service time and summed command time (SQ-slot acceptance through
observed completion). A separate thread logs and resets summaries once a second,
even when I/O is idle. Command time includes doorbell batching and wakeup latency,
but excludes waiting for a free SQ slot; it is not pure controller service time.
Windows are not benchmark-round boundaries. x86 uses CPU counter reads; other
architectures use the monotonic clock. Reporting adds timer/logging system calls
on its own thread. Off by default; without it nvmed's timing path is absent."""

[[option.effect]]
when = "value"
make_append = { FERRIC_INITFS_FEATURES = "nvmed/perf" }

[[option]]
id = "drivers.net_bypass"
menu = "drivers"
type = "bool"
title = "Kernel-bypass network queues (copy mode)"
default = false
depends = "kernel.regbuf"
rebuild = ["base"]
help = """
Let root applications open a queue socket on a network driver
(/scheme/network.<nic>/queue, Phase 2.5) and exchange Ethernet frames with it
through four shared-memory rings over a UMEM of their own, in registered-buffer
grants (ferric-netq). This is copy mode: the driver matches each received frame
against the sockets' steering filters before netstack sees it, copies a match
into the application's frame and publishes it on the RX ring, and sends the
application's TX frames by copying them out of the UMEM. Frames no filter
matches go to netstack as before; a socket without raw TX sends only from the
addresses and ports it owns. Zero-copy mode and unprivileged sockets come
later. Builds e1000d and virtio-netd with their
bypass Cargo features. Needs Kernel > Registered buffers. Off by default;
without it the network schemes have no queue path, as upstream."""

[[option.effect]]
when = "value"
make_append = { FERRIC_BASE_FEATURES = "e1000d/bypass virtio-netd/bypass" }

[[option]]
id = "kernel.self_modifying"
menu = "kernel"
type = "bool"
title = "Self-modifying code (CPU feature patching)"
default = true
kernel_feature = "self_modifying"
rebuild = ["kernel"]
help = "Patch hot paths at boot based on detected CPU features. Required for \"auto\" under CPU feature use."

[[option]]
id = "kernel.x86_kvm_pv"
menu = "kernel"
type = "bool"
title = "KVM paravirtual clock"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "x86_kvm_pv"
rebuild = ["kernel"]
help = "Use the KVM paravirtualized clock when running under KVM."

[[option]]
id = "kernel.pti"
menu = "kernel"
type = "bool"
title = "Page table isolation (KPTI)"
default = false
depends = "target.arch == 'x86_64'"
experimental = true
kernel_feature = "pti"
rebuild = ["kernel"]
help = """
Unmap the kernel from user page tables (Meltdown mitigation). Upstream
marks this broken with threading; enable only to test it."""

[[option]]
id = "kernel.serial_debug"
menu = "kernel"
type = "bool"
title = "Serial console debug output"
default = true
kernel_feature = "serial_debug"
rebuild = ["kernel"]
help = "Send kernel log output to the serial port."

[[option]]
id = "kernel.qemu_debug"
menu = "kernel"
type = "bool"
title = "QEMU debug port output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "qemu_debug"
rebuild = ["kernel"]
help = "Write kernel log output to QEMU's 0xE9 debug port."

[[option]]
id = "kernel.lpss_debug"
menu = "kernel"
type = "bool"
title = "Intel LPSS UART debug output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "lpss_debug"
rebuild = ["kernel"]
help = "Log through the Intel Low Power Subsystem UART found on some laptops."

[[option]]
id = "kernel.system76_ec_debug"
menu = "kernel"
type = "bool"
title = "System76 EC debug output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "system76_ec_debug"
rebuild = ["kernel"]
help = "Log through the System76 embedded controller."

[[option]]
id = "kernel.debugger"
menu = "kernel"
type = "bool"
title = "Built-in kernel debugger"
default = false
selects = ["kernel.syscall_debug"]
kernel_feature = "debugger"
rebuild = ["kernel"]
help = "Include the in-kernel debugger. Selects syscall debugging."

[[option]]
id = "kernel.syscall_debug"
menu = "kernel"
type = "bool"
title = "Syscall tracing"
default = false
kernel_feature = "syscall_debug"
rebuild = ["kernel"]
help = "Log system calls. Very noisy; for debugging only."

[[option]]
id = "kernel.profiling"
menu = "kernel"
type = "bool"
title = "Kernel profiling"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "profiling"
rebuild = ["kernel"]
help = "Sample kernel execution for the profiling tools."

[[option]]
id = "kernel.trace"
menu = "kernel.tracing"
type = "bool"
title = "Kernel tracepoints"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "trace"
rebuild = ["kernel"]
help = """
Compile typed tracepoints into the kernel (Phase T). Each one is a 5-byte NOP
until its event is turned on, when the kernel patches it into a jump to code
that writes a compact binary record (no text) to a 64 KiB ring of the CPU it
runs on. Events are turned on at boot (kernel.trace_boot, or FERRIC_TRACE=
in the boot environment) or at run time through the kernel.trace scheme,
which also hands out the records: `echo "enable syscall" >
/scheme/kernel.trace/events`, then read /scheme/kernel.trace/cpu/<n> and
decode with ferric-trace. The scheme is root-only for now. Off by default;
without it the kernel has no tracepoints and no such scheme, as upstream.
The options below choose which tracepoints are compiled in."""

[[option]]
id = "kernel.trace_syscall"
menu = "kernel.tracing"
type = "bool"
title = "System call tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_syscall"
rebuild = ["kernel"]
help = "Compile in syscall.enter (number and first four arguments) and syscall.exit (number and return value)."

[[option]]
id = "kernel.trace_sched"
menu = "kernel.tracing"
type = "bool"
title = "Scheduler tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_sched"
rebuild = ["kernel"]
help = "Compile in sched.switch (previous and next process and context), sched.futex_wait, sched.futex_resume and sched.futex_wake (queued waits, their results and wake counts), sched.context_create/start/exit (kernel execution contexts), and sched.proc_fork/exec/exit/wait (process lifecycle, reported by procmgr through kernel.trace/emit)."

[[option]]
id = "kernel.trace_scheme"
menu = "kernel.tracing"
type = "bool"
title = "Scheme request tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_scheme"
rebuild = ["kernel"]
help = """Compile in scheme.request, scheme.response and scheme.cancel for requests
to user-space schemes. Each record carries the scheme id and the request's
ring SQE/CQE tag, so a request can be matched with its response, and the
caller's and responder's pids, so a request a daemon makes while serving
another can be followed (an application's read through RedoxFS to the disk
driver)."""

[[option]]
id = "kernel.trace_mm"
menu = "kernel.tracing"
type = "bool"
title = "Memory tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_mm"
rebuild = ["kernel"]
help = """Compile in mm.map, mm.protect and mm.unmap results for address-space
operations (target page-table root, requested range/flags and return value),
and the rest of the mapping journal: mm.replace (a fixed mapping removed what
was in its span), mm.move (mremap and grant moves between address spaces),
mm.clone (a fork's copy of an address space), mm.clone_skip (a grant the
copy left out) and mm.destroy (an address space
torn down). Also compile in mm.page_fault, one record per page fault the kernel handles: the
faulting address, the instruction pointer, the kind of access (read, write or
fetch; user or kernel; page present or not) and the outcome (mapped, a failed
copy to or from user memory, or unhandled). Faults the kernel takes on purpose
to probe memory are not recorded."""

[[option]]
id = "kernel.trace_irq"
menu = "kernel.tracing"
type = "bool"
title = "Interrupt tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_irq"
rebuild = ["kernel"]
help = """Compile in irq.deliver and irq.ack for interrupts handed to user-space
drivers. irq.deliver is recorded when the kernel counts an interrupt for the
irq: handles and wakes them, with the IRQ, the CPU, whether it came on a PIC or
I/O APIC line or on a vector reserved on the CPU (MSI and MSI-X), and the
count. irq.ack is recorded when a driver acknowledges that count, so the two
bound how long a driver took to handle the interrupt."""

[[option]]
id = "kernel.trace_iommu"
menu = "kernel.tracing"
type = "bool"
title = "IOMMU fault and DMA mapping tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_iommu"
rebuild = ["kernel"]
help = """Compile in iommu.fault, recorded for each fault an IOMMU reports (a DMA or
interrupt request it blocked, or an error of its own) along with the kernel's
log line. The record keeps the hardware's report as it is (a VT-d fault record
or an AMD-Vi event log entry), and ferric-trace decodes it. These are
error-level events, so any kernel.trace_max_level compiles them in. Also compile
in the info-level iommu.map, iommu.protect and iommu.unmap events for completed
DMA domain operations, after required IOTLB invalidation. Failed/partial changes
and whole-domain destruction are not a complete mapping journal."""

[[option]]
id = "kernel.trace_max_level"
menu = "kernel.tracing"
type = "choice"
title = "Most verbose tracepoint level compiled in"
default = "info"
depends = "kernel.trace"
rebuild = ["kernel"]
help = """
Tracepoints above this level are left out of the build entirely, as with the
tracing crate's max_level features. System calls, context switches, scheme
requests, page faults and interrupts are "info", and IOMMU faults "error";
finer events of later subsystems use "debug" and "trace"."""
choices = ["error", "warn", "info", "debug", "trace"]

[[option.effect]]
when = "value == 'warn'"
kernel_features = ["trace_level_warn"]

[[option.effect]]
when = "value == 'info'"
kernel_features = ["trace_level_info"]

[[option.effect]]
when = "value == 'debug'"
kernel_features = ["trace_level_debug"]

[[option.effect]]
when = "value == 'trace'"
kernel_features = ["trace_level_trace"]

[[option]]
id = "kernel.trace_boot"
menu = "kernel.tracing"
type = "string"
title = "Events on from boot"
default = ""
depends = "kernel.trace"
kernel_config = "trace.boot"
rebuild = ["kernel"]
help = """
Events to turn on before the other CPUs start: a list of "all", subsystem
names (syscall, sched) or event names (sched.switch), separated by commas.
FERRIC_TRACE= in the boot environment (press e in the bootloader) adds to it."""

[[option]]
id = "kernel.trace_initfs_enable"
menu = "kernel.tracing"
type = "list"
title = "Events bootstrap turns on"
default = []
depends = "kernel.trace"
trace_config = "enable"
rebuild = ["base"]
help = """
Events to turn on from user space's first process, before init starts: a
list of selections such as "syscall", "scheme.request" or "all". They go in
the initfs as /scheme/initfs/lib/trace.toml, which bootstrap reads and writes
to /scheme/kernel.trace/events as enable commands. Unlike kernel.trace_boot,
changing them rebuilds only the initfs, not the kernel; system calls made
before bootstrap applies them are not traced. Names are checked against the
event catalog when the configuration is generated."""

[[option]]
id = "kernel.trace_initfs_disable"
menu = "kernel.tracing"
type = "list"
title = "Events bootstrap turns off"
default = []
depends = "kernel.trace"
trace_config = "disable"
rebuild = ["base"]
help = """
Events bootstrap turns off after the ones above are on, from the same
initfs trace.toml: use it to leave out single events of a subsystem turned on
above, or events kernel.trace_boot or FERRIC_TRACE= turned on."""

[[option]]
id = "kernel.trace_crash"
menu = "kernel.tracing"
type = "bool"
title = "Crash dump across a warm reboot"
default = false
depends = "kernel.trace"
kernel_feature = "trace_crash"
rebuild = ["kernel"]
help = """
Keep 64 KiB of RAM at a fixed address (kernel.trace_crash_base) out of use. A
kernel panic writes its message and the newest records of every CPU's trace
ring there. Firmware leaves RAM alone across a warm reboot, so the next boot
finds the dump, logs the message, and serves the dump as
/scheme/kernel.trace/crash, which `ferric-trace crash` prints or saves as a
capture. A cold boot finds nothing, and a region that is not free RAM in the
boot memory map turns the feature off with a warning.

It also makes every ring a flight recorder: a full ring overwrites its oldest
records instead of dropping new ones, so the dump holds the last records before
the panic even when nobody reads the rings. Readers see the overwritten records
in each ring's lost count."""

[[option]]
id = "kernel.trace_crash_base"
menu = "kernel.tracing"
type = "string"
title = "Crash region address"
default = "0x4000000"
depends = "kernel.trace_crash"
kernel_config = "trace.crash_base"
rebuild = ["kernel"]
help = """
The physical address of the crash region, page aligned. Pick RAM that neither
the firmware nor the bootloader uses; the default, 64 MiB, is free on QEMU
with OVMF and on most PCs, whose firmware and boot loaders allocate from the
top of memory."""

[[option]]
id = "kernel.trace_crash_test"
menu = "kernel.tracing"
type = "bool"
title = "Crash dump test hook"
default = false
depends = "kernel.trace_crash"
kernel_feature = "trace_crash_test"
rebuild = ["kernel"]
help = """
For testing only: writing `panic` to /scheme/kernel.trace/crash (as root)
panics the kernel on purpose, and the panic handler resets the machine once
the dump is written, so the next boot can read it back. CI's crash-dump image
turns it on; never turn it on elsewhere."""

[[option]]
id = "kernel.log_persist"
menu = "kernel"
type = "bool"
title = "Kernel log across a warm reboot"
default = false
kernel_feature = "log_persist"
rebuild = ["kernel"]
help = """
Keep 64 KiB of RAM at a fixed address (kernel.log_persist_base) out of use and
copy everything the kernel logs there too, the newest bytes replacing the
oldest. Firmware leaves RAM alone across a warm reboot, so the next boot finds
the end of the previous boot's log, a panic message included, and serves it as
/scheme/sys/log_previous. A cold boot finds nothing, and a region that is not
free RAM in the boot memory map turns the feature off with a warning. Needs no
tracing (kernel.trace)."""

[[option]]
id = "kernel.log_persist_base"
menu = "kernel"
type = "string"
title = "Persistent log region address"
default = "0x4010000"
depends = "kernel.log_persist"
kernel_config = "log.persist_base"
rebuild = ["kernel"]
help = """
The physical address of the persistent log's region, page aligned. Pick RAM
that neither the firmware nor the bootloader uses; the default, right after
the crash region's default (kernel.trace_crash_base), is free on QEMU with
OVMF and on most PCs. The two regions must not overlap: the second one
reserved is turned off."""

[[option]]
id = "kernel.sys_fdstat"
menu = "kernel"
type = "bool"
title = "File descriptor statistics in sys:"
default = false
kernel_feature = "sys_fdstat"
rebuild = ["kernel"]
help = "Expose per-process file descriptor statistics through the sys: scheme."

[[option]]
id = "kernel.sys_proc"
menu = "kernel"
type = "bool"
title = "Per-process introspection in sys:"
default = false
kernel_feature = "sys_proc"
rebuild = ["kernel"]
help = """
Serve /scheme/sys/proc: for every context, its process and user ids, state,
CPU and CPU time, its memory, each open file descriptor (the scheme it is open
on and the handle) and each grant of its address space (address, size, where
the memory comes from, protection). Only root may read it, since it shows
addresses. The format is the ferric-procinfo crate's."""

[[option]]
id = "kernel.busy_panic"
menu = "kernel"
type = "bool"
title = "Spin on panic"
default = false
kernel_feature = "busy_panic"
rebuild = ["kernel"]
help = "Busy-loop instead of halting after a panic, so a debugger can attach."

[[option]]
id = "kernel.drop_panic"
menu = "kernel"
type = "bool"
title = "Panic on unexpected drops"
default = false
kernel_feature = "drop_panic"
rebuild = ["kernel"]
help = "Panic when certain kernel objects are dropped unexpectedly. Empty wait conditions can be destroyed normally; nonempty lists still require explicit cleanup. For debugging leaks and use-after-free."

[[option]]
id = "kernel.cpu.smap"
menu = "kernel.cpu"
type = "choice"
title = "SMAP (supervisor mode access prevention)"
default = "auto"
defaults = [{ when = "cpu.x86_64_level == 'v4'", value = "always" }]
kernel_config = "arch.x86_64.features.smap"
rebuild = ["kernel"]
help = "Stops the kernel touching user memory by accident. Every v4 CPU has it; Haswell (v3) does not."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.fsgsbase"
menu = "kernel.cpu"
type = "choice"
title = "FSGSBASE instructions"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.fsgsbase"
rebuild = ["kernel"]
help = "Fast FS/GS base switching on context switch. Present on every v3 and v4 CPU."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.xsave"
menu = "kernel.cpu"
type = "choice"
title = "XSAVE"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.xsave"
rebuild = ["kernel"]
help = "Save extended (AVX/AVX-512) register state with XSAVE. Required by level v3 and up."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.xsaveopt"
menu = "kernel.cpu"
type = "choice"
title = "XSAVEOPT"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.xsaveopt"
rebuild = ["kernel"]
help = "Skip saving unmodified register state. Present on every v3 and v4 CPU."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.avx512"
menu = "kernel.cpu"
type = "choice"
title = "AVX-512 register state"
default = "auto"
defaults = [
  { when = "kernel.cpu.xsave == 'never'", value = "never" },
  { when = "cpu.x86_64_level == 'v4'", value = "always" },
]
kernel_config = "arch.x86_64.features.avx512"
rebuild = ["kernel"]
help = """
Enable the AVX-512 opmask and ZMM state components in XCR0 so user space
can run AVX-512 code, and save them on context switch. "auto" enables them
when the CPU has AVX512F; level v4 requires them. Costs about 1.7 KB more
XSAVE area per thread on AVX-512 CPUs, and nothing elsewhere."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.kpti"
menu = "kernel.cpu"
type = "choice"
title = "Kernel page-table isolation (Meltdown)"
default = "auto"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.kpti"
rebuild = ["kernel"]
help = """
Give each process a second page table that maps almost none of the kernel and
is loaded while user code runs, so Meltdown (CVE-2017-5754) cannot read kernel
memory. "auto" turns it on for Intel CPUs that do not report RDCL_NO; AMD CPUs
and recent Intel ones are not affected and pay nothing. It costs two page-table
switches and TLB flushes per system call and interrupt on affected CPUs; see
kernel.cpu.pcid for avoiding the flushes."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.pcid"
menu = "kernel.cpu"
type = "choice"
title = "PCIDs for KPTI (no-flush page-table switches)"
default = "auto"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.pcid"
rebuild = ["kernel"]
help = """
When KPTI is on, tag the kernel and user page tables with two process-context
identifiers (PCIDs), so the page-table switches on every system call and
interrupt keep the TLB instead of flushing it. Unmap, mprotect and TLB
shootdowns also invalidate the user PCID with INVPCID; switching between
processes still flushes. "auto" uses it when the CPU reports PCID and INVPCID
(Intel Haswell, AMD Zen 3 and newer); "always" panics at boot when KPTI is on
and the CPU lacks them. Has no effect while KPTI is off."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.ibt"
menu = "kernel.cpu"
type = "choice"
title = "Indirect branch tracking (CET IBT) in the kernel"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.ibt"
rebuild = ["kernel"]
help = """
Build the kernel (and its core and alloc) with endbr64 at every function entry
and turn on Intel CET indirect branch tracking in supervisor mode, so an
indirect call or jump that lands anywhere other than an endbr64 stops the
kernel with a control-protection fault (#CP) instead of running a gadget.
"auto" turns it on when the CPU reports CET_IBT (Intel Tiger Lake, Sapphire
Rapids and newer); "always" panics at boot on CPUs without it. User-mode CET
and kernel shadow stacks stay off. Costs four bytes per function and no jump
tables. Off by default because CI cannot test it: KVM on the runners does not
expose CET and QEMU's emulator does not implement it."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.shstk"
menu = "kernel.cpu"
type = "choice"
title = "Shadow stacks (CET SS) in the kernel"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.shstk"
rebuild = ["kernel"]
help = """
Intel CET supervisor shadow stacks keep a second, write-protected copy of every
return address and stop the kernel with a control-protection fault (#CP) when a
`ret` does not match it, which defeats return-oriented gadget chains. "auto"
turns them on when the CPU reports CET_SS (Intel Tiger Lake, AMD Zen 3 and
newer) and logs a boot self-test; "always" additionally panics at boot on CPUs
without it. On a CPU without CET_SS, or with more than 1 TiB of RAM, "auto"
stays off and logs that it is skipping. Enabling alongside kernel.cpu.kpti is
not yet supported: with KPTI on, shadow stacks are allocated but left off
("always" then panics, so use "auto"). Independent of kernel.cpu.ibt. Compiled
shadow-stack support reserves a private 32 MiB frame pool (4096 stacks), excluded
from the writable physical map. Pool exhaustion fails allocation without a
writable fallback. Like the
other "auto" CPU options it acts as "never" without kernel.self_modifying. Off
by default because CI cannot test it: KVM on the runners does not expose CET and
QEMU's emulator does not implement it."""
choices = ["always", "auto", "never"]

# ---------------------------------------------------------------- image

[[option]]
id = "image.config"
menu = "image"
type = "choice"
title = "Base filesystem configuration"
default = "desktop"
make_var = "CONFIG_NAME"
help = """
Which config/*.toml (or config/<arch>/*.toml) the image starts from.
Sets CONFIG_NAME; the build directory is build/<arch>/<config>.
ferric-smoke and ferric-fuzz select the existing CI test images on x86_64.
They retain your configured CPU and kernel options; CI's forced test settings
are separate from these image-content choices."""
choices = [
  { value = "native", title = "native: local OS components and prebuilt applications" },
  { value = "minimal", title = "minimal: console only" },
  { value = "server", title = "server: console and network services" },
  { value = "desktop-minimal", title = "desktop-minimal: Orbital and a terminal" },
  { value = "desktop", title = "desktop: the default desktop" },
  { value = "dev", title = "dev: desktop plus compilers" },
  { value = "demo", title = "demo: desktop plus apps and games" },
  { value = "full", title = "full: everything that builds (x86-64)" },
  { value = "wayland", title = "wayland: Wayland session" },
  { value = "x11", title = "x11: X11 session" },
  { value = "tests", title = "tests: test suites" },
  { value = "ferric-smoke", title = "ferric-smoke: Ferric CI smoke tests (x86-64)" },
  { value = "ferric-fuzz", title = "ferric-fuzz: extended syscall fuzzing (x86-64)" },
  { value = "ferric-hardware", title = "ferric-hardware: hardware bring-up inventory (x86-64)" },
]

[[option]]
id = "image.filesystem_size"
menu = "image"
type = "int"
title = "Filesystem size in MiB (0 = from config)"
default = 0
min = 0
max = 1048576
help = "Overrides filesystem_size from the base configuration."

[[option.effect]]
when = "value > 0"
general = { filesystem_size = "{value}" }

[[option]]
id = "image.packages_add"
menu = "image"
type = "list"
title = "Extra packages"
default = []
help = "Recipe names to add to the image, e.g. [\"vim\", \"htop\"]."

[[option.effect]]
packages_from_value = true

[[option]]
id = "image.packages_remove"
menu = "image"
type = "list"
title = "Packages to leave out"
default = []
help = "Recipe names to drop from the base configuration (written as \"ignore\")."

[[option.effect]]
ignore_from_value = true

[[option]]
id = "image.encrypt"
menu = "image"
type = "bool"
title = "Encrypt the root filesystem"
default = false
help = "Pass --encrypt to redoxfs-mkfs. The image build asks for a password."

[[option.effect]]
make = { REDOXFS_MKFS_FLAGS = "--encrypt" }

# ---------------------------------------------------------------- file systems

[[option]]
id = "fs.ext4"
menu = "fs"
type = "bool"
title = "Read-only ext4 (ext4d)"
default = false
help = """
Add ext4d to the image: a daemon that serves an ext4 volume read-only as a
scheme, the way RedoxFS serves its own. Run it as
`ext4d [--offset BYTES] [--length BYTES] DEVICE SCHEME`, with a disk, a
partition or an image file as DEVICE; the volume appears at /scheme/SCHEME.
Every change (writing, creating, removing, renaming) fails with EROFS,
unless fs.ext4_write is on: it adds a journaled writer, which so far sets a
file's times, mode and owner (futimens, fchmod, fchown). Reading is done by the ext4-view crate, and handles
extents, hashed directories, checksums and the journal; fstat's change time
is read from the inode by ext4d. Source: userspace/ext4d."""

[[option.effect]]
when = "value"
source_packages = ["ext4d"]

[[option]]
id = "fs.luks"
menu = "fs"
type = "bool"
title = "LUKS encrypted volumes, read-only (ferric-blockd)"
default = false
rebuild = ["ferric-blockd"]
help = """
Add ferric-blockd with its LUKS layer: a daemon that opens a LUKS1 or LUKS2
volume (AES-XTS, plain64 IVs, 512- to 4096-byte sectors) with a passphrase
from a key file and serves the decrypted volume read-only as a scheme, for a
file system daemon such as ext4d or RedoxFS to mount. Run it as
`ferric-blockd SCHEME dev:DEVICE luks:KEYFILE`; the steps stack with LVM
(fs.lvm) and byte windows (`slice:OFFSET:LENGTH`) in any order. Only root may
open the volume, and every change fails with EROFS. Headers and keyslots are
read by crates/luks, written from the LUKS1 and LUKS2 on-disk format
specifications; the layers are crates/blocklayer. Source: userspace/blockd."""

[[option.effect]]
when = "value"
source_packages = ["ferric-blockd"]
make_append = { FERRIC_BLOCKD_FEATURES = "luks" }

[[option]]
id = "fs.lvm"
menu = "fs"
type = "bool"
title = "LVM2 logical volumes, read-only (ferric-blockd)"
default = false
rebuild = ["ferric-blockd"]
help = """
Add ferric-blockd with its LVM layer: a daemon that reads the LVM2 metadata of
a volume group's physical volumes and serves one linear or striped logical
volume read-only as a scheme. Run it as
`ferric-blockd SCHEME dev:PV... lvm:NAME`, with every PV of the group; the
steps stack with LUKS (fs.luks), so LVM on LUKS and LUKS on LVM both work.
Mirrors, RAID, thin pools, caches and snapshots are refused. Metadata is read
by crates/lvm, written from published format documentation; the layers are
crates/blocklayer. Source: userspace/blockd."""

[[option.effect]]
when = "value"
source_packages = ["ferric-blockd"]
make_append = { FERRIC_BLOCKD_FEATURES = "lvm" }

[[option]]
id = "fs.unlock_at_boot"
menu = "fs"
type = "bool"
title = "Unlock LUKS and LVM volumes at boot (ferric-unlock)"
default = false
depends = "fs.luks || fs.lvm"
rebuild = ["ferric-blockd"]
help = """
Add ferric-unlock to ferric-blockd's package, and the init unit
05_ferric-unlock.service that runs it once at boot, before the services
numbered 10 and up. It reads /etc/ferric/crypttab, one volume per line:
`NAME STEP... [ext4:SCHEME]`, with the steps ferric-blockd takes (dev:,
slice:, luks:KEYFILE, lvm:NAME). For each line it starts ferric-blockd to
serve /scheme/NAME, waits for it, and with `ext4:SCHEME` has ext4d (fs.ext4)
mount the volume at /scheme/SCHEME. LUKS passphrases come from key files; there
is no prompt. RedoxFS cannot be mounted this way, because ferric-blockd serves
volumes read-only. With no crypttab it does nothing. Source:
userspace/blockd (crypttab.rs, unlock.rs)."""

[[option.effect]]
when = "value"
make_append = { FERRIC_BLOCKD_FEATURES = "unlock" }

[[option]]
id = "fs.ext4_journal_replay"
menu = "fs"
type = "bool"
title = "Replay ext4 journals onto the disk"
default = false
depends = "fs.ext4"
rebuild = ["ext4d"]
help = """
When a volume was not cleanly unmounted, have ext4d replay its journal onto
the disk before serving it, as `e2fsck -E journal_only` does: every committed
transaction is written home, then the journal is emptied and the volume's
needs_recovery flag cleared. Only then is the device opened for writing, and
only for the replay; the volume is still served read-only. Every journal
checksum, including that of every logged block, is checked before the first
write; a damaged block that would be written stops the replay (with async
commits it ends the log at its transaction instead). The journal's location is
checked against the volume and its metadata, and an interrupted replay can be
run again.

Off, ext4d never writes, and reads such a volume through ext4-view's view of
the journal in memory, which refuses journals with escaped blocks and does
not follow a log that wraps round. This is the first step towards writable
ext4. Source: crates/jbd2 and userspace/ext4d/src/journal."""

[[option.effect]]
when = "value"
make_append = { FERRIC_EXT4D_FEATURES = "journal-replay" }

[[option]]
id = "fs.ext4_write"
menu = "fs"
type = "bool"
title = "Write to ext4 through the journal (times, mode and owner, so far)"
default = false
depends = "fs.ext4_journal_replay"
rebuild = ["ext4d"]
help = """
Build ext4d with its journaled writer: each change to a volume is one JBD2
transaction, logged with descriptor and commit blocks and their checksums,
committed, then written home and the journal emptied (the checkpoint), so a
crash at any point leaves the change made in full by a replay, or not at all.
The changes so far rewrite one existing inode: its access and modification
times (futimens), its permission bits (fchmod) or its owner and group (fchown),
each with a new change time, following POSIX's owner, write-permission and
restricted-chown rules, and finding the inode from the path itself; every other
change still fails with EROFS. A new owner or group is refused on volumes with
quota, and IDs above 65535 on volumes not made for Linux or Hurd. Volumes that need recovery are replayed first;
volumes with a feature the writer does not know (mmp, meta_bg, readonly and
others), or with no journal, are served read-only, and ext4d says why, as are
volumes whose device cannot be opened for writing.

The writer is checked against e2fsprogs: e2fsck replays and checks what it
leaves, including volumes crashed part-way through a change. Off, ext4d writes
only to replay a journal. Source: crates/jbd2 (writer) and
userspace/ext4d/src/{write,lookup}.rs."""

[[option.effect]]
when = "value"
make_append = { FERRIC_EXT4D_FEATURES = "write" }

[[option]]
id = "fs.fat"
menu = "fs"
type = "bool"
title = "Read-only FAT12/FAT16/FAT32 (fatd)"
default = false
help = """
Add fatd to the image: a daemon that serves a FAT12, FAT16 or FAT32 volume,
such as the EFI system partition or a USB stick, read-only as a scheme. Run it
as `fatd [--offset BYTES] [--length BYTES] DEVICE SCHEME`, with a disk, a
partition or an image file as DEVICE; the volume appears at /scheme/SCHEME.
Long file names are listed, and names are looked up without regard to case
and by their 8.3 short names too, as FAT specifies. FAT has no owners: every
file is shown as root's and readable by everyone. Every change fails with
EROFS, and the device is only ever opened for reading. Reading is done by the
fatfs crate; for exFAT, turn on fs.exfat too. Source: userspace/fatd."""

[[option.effect]]
when = "value"
source_packages = ["fatd"]

[[option]]
id = "fs.exfat"
menu = "fs"
type = "bool"
title = "Read-only exFAT in fatd"
default = false
depends = "fs.fat"
rebuild = ["fatd"]
help = """
Build fatd with its exFAT reader, so it also serves exFAT volumes (SD cards
and USB sticks over 32 GiB), read-only, the same way: fatd tells the formats
apart by the boot sector. The boot region's checksum, the up-case table's
checksum and every directory entry set's checksum are checked; names are
compared through the volume's up-case table; cluster chains are followed
through the FAT, or not at all for files stored contiguously; and bytes past
a file's valid data length read as zeros. Times keep exFAT's 10 ms and the
time of day of the last access, converted to UTC by the zone offset it records.
Every change fails with EROFS. Off, fatd refuses exFAT volumes with
EOPNOTSUPP. The reader is written from Microsoft's published exFAT
specification. Source: crates/exfat."""

[[option.effect]]
when = "value"
make_append = { FERRIC_FATD_FEATURES = "exfat" }


# ---------------------------------------------------------------- packages

[[option]]
id = "packages.manager"
menu = "packages"
type = "choice"
title = "Package manager"
default = "fox"
help = """
The package manager on the target.

  fox       Ferric Oxide's fox (tools/fox), built from this repository.
            It verifies every archive against the keys in /etc/fox/keys
            (the installer puts the key that signed the image's packages
            there), and on first boot adopts the packages the installer
            put in the image (fox adopt-pkg), so fox list, fox verify
            --installed and fox remove cover the whole system.
            fox installs local .pkgar files; it does not fetch from
            package servers.
            The image build finishes the root with the host fox: it
            adopts the installed packages at build time, syncs
            packages.set if one is given, and writes the image SBOM to
            build/<arch>/<config>/image.cdx.json. Sets FERRIC_FOX_IMAGE=1.
  pkgutils  upstream Redox's pkg, which can fetch from package servers."""
choices = [
  { value = "fox", title = "fox: verify, install and remove signed local packages" },
  { value = "pkgutils", title = "pkgutils: upstream pkg" },
]

[[option.effect]]
when = "value == 'fox'"
source_packages = ["fox"]
ignore_packages = ["pkgutils"]
make = { FERRIC_FOX_IMAGE = "1" }

[[option]]
id = "packages.set"
menu = "packages"
type = "string"
title = "Package set synced into the image"
default = ""
depends = "packages.manager == 'fox'"
make_var = "FERRIC_FOX_PACKAGES"
help = """
A fox package set (fox-packages/1: registries, packages and policy; see
the package tooling chapter of the book) that the image build installs
with `fox sync --target <image target>` after the installer has placed
the configuration's packages. The lock, fox.lock, is written beside the
set; commit it to make image builds reproducible. Packages need prebuilt
artifacts for the image target, or a source build that can cross-compile
to it. Empty means no set. Sets FERRIC_FOX_PACKAGES."""

[[option]]
id = "packages.locked"
menu = "packages"
type = "bool"
title = "Require every package to be locked"
default = false
depends = "packages.manager == 'fox' && packages.set != ''"
make_var = "FERRIC_FOX_LOCKED"
help = """
Fail the image build unless fox.lock beside packages.set already pins
every package (fox sync --locked), so a release image is built from
exactly the archives and commits recorded there. Sets
FERRIC_FOX_LOCKED."""

[[option]]
id = "packages.signed_manifests"
menu = "packages"
type = "bool"
title = "Signed package manifests"
default = true
make_var = "FERRIC_FOX_MANIFEST"
rebuild = ["*"]
help = """
Put a fox manifest (usr/share/fox/manifest/<name>.toml: name, version,
target, dependencies, source) into every package the cookbook packs, so
the archive signature covers the package's identity. Without it fox only
has the unsigned metadata file beside each archive and needs
--allow-unsigned-metadata. Sets FERRIC_FOX_MANIFEST; changing it repacks
every package."""

# ---------------------------------------------------------------- build

[[option]]
id = "build.podman"
menu = "build"
type = "bool"
title = "Build inside Podman"
default = false
make_var = "PODMAN_BUILD"
help = "Opt into the Linux container for recipes that need it. Native builds are the default for configured Ferric builds. Sets PODMAN_BUILD."

[[option]]
id = "build.toolchain"
menu = "build"
type = "choice"
title = "Cross toolchain"
default = "llvm"
defaults = [{ when = "build.podman || target.arch == 'riscv64gc'", value = "recipe" }]
choices = ["llvm", "recipe"]
make_var = "PREFIX_TOOLCHAIN"
rebuild = ["*"]
help = """
llvm uses host Clang, rustup's pinned Rust compiler and bundled LLVM tools.
It downloads target runtime data without installing or building GCC/LLVM.
Supports x86_64-unknown-redox and aarch64-unknown-redox. ARM64 builds std from
rust-src with Cargo. Existing Rust/C++ packages still
need GCC ABI runtime libraries; these are target libraries, not compilers.
recipe uses the inherited prebuilt or source-built cross toolchain."""

[[option]]
id = "build.fuse"
menu = "build"
type = "bool"
title = "Mount images through FUSE"
default = false
make_var = "FSTOOLS_NO_MOUNT"
make_true = "0"
make_false = "1"
help = "Use host filesystem mounts for image creation. Off uses the Rust RedoxFS writer and records guest ownership without sudo or macFUSE."

[[option]]
id = "build.prefix_binary"
menu = "build"
type = "bool"
title = "Download the prebuilt toolchain"
default = true
make_var = "PREFIX_BINARY"
help = "Use the prebuilt cross toolchain instead of building GCC/LLVM/Rust. Sets PREFIX_BINARY."

[[option]]
id = "build.repo_binary"
menu = "build"
type = "bool"
title = "Download prebuilt packages"
default = false
make_var = "REPO_BINARY"
make_false = ""
help = """
Fetch packages from the upstream package server instead of building them.
Much faster, but those packages ignore every compile-time option here
(processor baseline, kernel features). Sets REPO_BINARY."""

[[option]]
id = "build.debug"
menu = "build"
type = "bool"
title = "Debug info"
default = false
make_var = "REPO_DEBUG"
rebuild = ["*"]
help = "Keep debug info and skip stripping in locally built packages. Sets REPO_DEBUG."

[[option]]
id = "build.offline"
menu = "build"
type = "bool"
title = "Offline (do not update sources)"
default = false
make_var = "REPO_OFFLINE"
help = "Build from the sources already fetched. Sets REPO_OFFLINE."

[[option]]
id = "build.nonstop"
menu = "build"
type = "bool"
title = "Keep going after package failures"
default = false
make_var = "REPO_NONSTOP"
help = "Try to build every package even when some fail. Sets REPO_NONSTOP."

# ---------------------------------------------------------------- qemu

[[option]]
id = "qemu.live"
menu = "qemu"
type = "choice"
title = "Boot a RAM-backed live image"
default = "no"
defaults = [{ when = "target.arch == 'aarch64'", value = "yes" }]
choices = ["yes", "no"]
make_var = "FERRIC_QEMU_LIVE"
help = "ARM64 defaults to a live image while persistent storage bring-up is incomplete. Guest changes to a live image are lost on exit. Sets the default for live; command-line live=yes/no overrides it."

[[option]]
id = "qemu.kvm"
menu = "qemu"
type = "choice"
title = "Hardware virtualization"
default = "auto"
defaults = [{ when = "target.arch == 'aarch64'", value = "no" }]
help = "auto uses hardware acceleration for matching host/guest architectures where supported. ARM64 defaults to software emulation; HVF currently traps during early user-space startup. yes explicitly requests KVM on Linux or HVF on macOS."
choices = ["auto", "yes", "no"]

[[option.effect]]
when = "value != 'auto'"
make = { kvm = "{value}" }

[[option]]
id = "qemu.memory"
menu = "qemu"
type = "int"
title = "Memory in MiB (0 = default)"
default = 0
min = 0
max = 1048576
help = "Sets QEMU_MEM."

[[option.effect]]
when = "value > 0"
make = { QEMU_MEM = "{value}" }

[[option]]
id = "qemu.cpus"
menu = "qemu"
type = "int"
title = "CPU count (0 = default)"
default = 0
min = 0
max = 1024
help = "Sets QEMU_SMP."

[[option.effect]]
when = "value > 0"
make = { QEMU_SMP = "{value}" }

[[option]]
id = "qemu.cpu_model"
menu = "qemu"
type = "string"
title = "Emulated CPU model override"
default = ""
help = "QEMU -cpu model when KVM is off. Empty picks one that matches the processor baseline."

[[option.effect]]
when = "value != ''"
override = true
make = { QEMU_CPU = "{value}" }

# ---------------------------------------------------------------- rules

[[rule]]
level = "warn"
when = "build.repo_binary && target.arch == 'x86_64' && cpu.x86_64_level != 'v1'"
message = "Prebuilt packages are compiled for baseline x86-64; only packages you build locally use the selected level."

[[rule]]
level = "warn"
when = "!kernel.self_modifying && (kernel.cpu.smap == 'auto' || kernel.cpu.fsgsbase == 'auto' || kernel.cpu.xsave == 'auto' || kernel.cpu.xsaveopt == 'auto' || kernel.cpu.avx512 == 'auto' || kernel.cpu.kpti == 'auto' || kernel.cpu.pcid == 'auto' || kernel.cpu.ibt == 'auto' || kernel.cpu.shstk == 'auto')"
message = "Kernel CPU features set to \"auto\" act as \"never\" without self-modifying code."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && kernel.cpu.pcid == 'always' && kernel.cpu.kpti == 'never'"
message = "kernel.cpu.pcid only affects KPTI; with kernel.cpu.kpti = \"never\" it does nothing."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && kernel.cpu.shstk == 'always' && kernel.cpu.kpti != 'never'"
message = "kernel.cpu.shstk = \"always\" cannot be met with KPTI on (enabling shadow stacks alongside KPTI is not yet supported); use \"auto\", or set kernel.cpu.kpti = \"never\"."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && kernel.cpu.shstk != 'never' && kernel.cpu.kpti == 'auto'"
message = "With kernel.cpu.kpti = \"auto\" (on for Meltdown-affected Intel CPUs), shadow stacks are allocated but left off on those CPUs; enabling shadow stacks alongside KPTI is not yet supported."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && cpu.x86_64_level == 'v4' && (kernel.cpu.avx512 == 'never' || (kernel.cpu.avx512 == 'auto' && !kernel.self_modifying))"
message = "Level v4 userspace uses AVX-512, which faults unless the kernel enables its state; kernel.cpu.avx512 cannot be \"never\", or \"auto\" without kernel.self_modifying."

[[rule]]
level = "error"
when = "kernel.trace && kernel.profiling"
message = "kernel.trace cannot be combined with kernel.profiling yet: the profiler's CPU would not answer the interrupt live tracepoint patching waits for."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && kernel.cpu.avx512 != 'never' && kernel.cpu.xsave == 'never'"
message = "AVX-512 state is saved with XSAVE; kernel.cpu.avx512 needs kernel.cpu.xsave."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && cpu.x86_64_level == 'v4' && qemu.kvm != 'yes' && qemu.cpu_model == ''"
message = "QEMU cannot emulate AVX-512 without KVM; run `make qemu` with KVM on an AVX-512 host (qemu.kvm = \"yes\")."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && cpu.x86_64_level in ['v3', 'v4'] && kernel.cpu.xsave == 'never'"
message = "Level v3 and up use AVX state, which the kernel can only save with XSAVE; kernel.cpu.xsave cannot be \"never\"."

[[rule]]
level = "error"
when = "image.config == 'full' && target.arch != 'x86_64'"
message = "The full configuration only exists for x86_64."

[[rule]]
level = "error"
when = "image.config in ['ferric-smoke', 'ferric-fuzz'] && target.arch != 'x86_64'"
message = "Ferric smoke and fuzz configurations require x86_64; their test packages include x86-64 register-state checks."

[[rule]]
level = "error"
when = "image.config == 'ferric-hardware' && target.arch != 'x86_64'"
message = "The Ferric hardware bring-up configuration requires x86_64."

[[rule]]
level = "error"
when = "build.toolchain == 'llvm' && target.arch == 'riscv64gc'"
message = "The native LLVM toolchain supports x86_64 and aarch64; select build.toolchain = 'recipe' for RISC-V."
