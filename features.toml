# Ferric Oxide feature catalog
#
# This file describes every option that `make menuconfig` (tools/ferric-config)
# shows and that ferric.toml may set. It is the schema, not your configuration:
# put your choices in ferric.toml (untracked, like .config). Only options you
# set explicitly are written there; everything else follows the defaults below.
#
# Option ids are dotted paths, and ferric.toml uses the same nesting:
#
#     [cpu]
#     x86_64_level = "v4"
#
#     [kernel]
#     numa = true
#
# Expressions (used by `depends`, `defaults[].when`, `effect[].when` and
# `rule[].when`) support option ids, `value` (the option being defined),
# string/number/bool literals, lists, == != < <= > >=, `in`, !, && and ||.
#
# Effects say how a value reaches the build:
#   make_var            assign a make variable (bool -> make_true/make_false)
#   kernel_feature      add a kernel Cargo feature when the bool is on
#   kernel_config       set a key in the kernel's config.toml
#   [[option.effect]]   anything else: make, make_append, packages,
#                       ignore_packages, source_packages (added as
#                       "source", so they build even with REPO_BINARY),
#                       packages_from_value, ignore_from_value, general,
#                       kernel_features
#   rebuild             recipes to mark stale when the value changes
#                       ("*" means every recipe)
# "{value}" in a string is replaced by the option's value.

[[menu]]
id = "target"
title = "Target"
help = "Architecture and board the image is built for."

[[menu]]
id = "cpu"
title = "Processor baseline"
help = """
The oldest CPU the userspace build has to run on. Raising the baseline lets
the compiler use newer instructions (AVX2, BMI2, FMA, AVX-512) everywhere
without runtime dispatch. Ferric Oxide targets modern processors, so the
default for x86-64 is level v3 (Intel Haswell / AMD Excavator and newer).

The kernel and bootloader are excluded by default: the kernel is built
soft-float without SSE/AVX, and its use of CPU features is controlled
under Kernel > CPU feature use instead."""

[[menu]]
id = "kernel"
title = "Kernel"
help = "Cargo features and build-time policy for the kernel."

[[menu]]
id = "kernel.cpu"
parent = "kernel"
title = "CPU feature use"
depends = "target.arch == 'x86_64'"
help = """
How the kernel uses optional CPU features. "always" assumes the feature
exists, "never" never uses it, and "auto" detects it at boot and patches
the code (needs Kernel > Self-modifying code; without it "auto" acts like
"never"). Defaults follow the processor baseline."""

[[menu]]
id = "kernel.tracing"
parent = "kernel"
title = "Tracing"
depends = "target.arch == 'x86_64'"
help = "Kernel tracepoints (Phase T): which are compiled in, and which are on from boot."

[[menu]]
id = "drivers"
title = "Drivers"
help = "Build-time options of the user-space drivers in the base package."

[[menu]]
id = "image"
title = "Image contents"
help = "Which filesystem configuration the image starts from, and changes on top of it."

[[menu]]
id = "packages"
title = "Package management"
help = "Which package manager the image ships and what packages say about themselves."

[[menu]]
id = "build"
title = "Build system"
help = "How the build itself runs."

[[menu]]
id = "qemu"
title = "Emulator (make qemu)"
help = "Settings used by `make qemu` when testing an image."

# ---------------------------------------------------------------- target

[[option]]
id = "target.arch"
menu = "target"
type = "choice"
title = "Architecture"
default = "x86_64"
make_var = "ARCH"
rebuild = ["*"]
help = "CPU architecture to build for. Sets ARCH."
choices = [
  { value = "x86_64", title = "x86-64 (AMD64)" },
  { value = "aarch64", title = "AArch64 (ARM64)" },
  { value = "riscv64gc", title = "RISC-V 64 (RV64GC)" },
]

[[option]]
id = "target.board"
menu = "target"
type = "string"
title = "Board"
default = ""
depends = "target.arch == 'aarch64'"
make_var = "BOARD"
help = "Sub-device for AArch64 images, for example raspi3bp. Empty means generic. Sets BOARD."

# ---------------------------------------------------------------- cpu

[[option]]
id = "cpu.x86_64_level"
menu = "cpu"
type = "choice"
title = "x86-64 microarchitecture level"
default = "v3"
depends = "target.arch == 'x86_64'"
rebuild = ["*"]
help = """
psABI microarchitecture level for all userspace code.

  v1  baseline x86-64 (SSE2). Runs anywhere; no gain.
  v2  + SSE4.2, POPCNT, SSSE3, CMPXCHG16B. Nehalem / Bulldozer and newer.
  v3  + AVX, AVX2, BMI1/2, FMA, F16C, LZCNT, MOVBE, XSAVE.
      Haswell / Excavator / Zen and newer.
  v4  + AVX-512 F/BW/CD/DQ/VL. Skylake-SP, Ice Lake, Zen 4 and newer.

An image built for a level will not boot on an older CPU: the kernel
checks at boot and halts with a list of the missing features.
`make qemu` picks a matching emulated CPU when KVM is off.

v4 needs a kernel with AVX-512 state support (kernel.cpu.avx512), which
v4 turns on by default.

With packages.manager = "fox", v3 and v4 also pick the level of the
prebuilt and source-built fox packages synced into the image."""
choices = [
  { value = "v1", title = "v1 (baseline)" },
  { value = "v2", title = "v2" },
  { value = "v3", title = "v3 (AVX2)" },
  { value = "v4", title = "v4 (AVX-512)" },
]

[[option.effect]]
when = "value == 'v1'"
make = { QEMU_CPU = "core2duo" }

# The kernel checks the CPU against the level at boot and halts with a list of
# missing features, instead of user space dying later with an invalid opcode.
[[option.effect]]
when = "value != 'v1'"
kernel_config = { "arch.x86_64.level" = "{value}" }

[[option.effect]]
when = "value == 'v2'"
make = { QEMU_CPU = "Nehalem" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v2", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v2" }

[[option.effect]]
when = "value == 'v3'"
make = { QEMU_CPU = "max", FERRIC_FOX_LEVEL = "v3" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v3", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v3" }

[[option.effect]]
when = "value == 'v4'"
make = { QEMU_CPU = "max", FERRIC_FOX_LEVEL = "v4" }
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-cpu=x86-64-v4", FERRIC_TARGET_CPPFLAGS = "-march=x86-64-v4" }

[[option]]
id = "cpu.aarch64_level"
menu = "cpu"
type = "choice"
title = "AArch64 architecture version"
default = "armv8.0-a"
depends = "target.arch == 'aarch64'"
rebuild = ["*"]
help = """
Minimum Arm architecture version for userspace code.

  armv8.0-a  generic; runs on every 64-bit Arm core.
  armv8.2-a  + LSE atomics, FP16, RAS. Cortex-A55/A75, Neoverse N1, Apple M1.
  armv9-a    + SVE2. Cortex-A510/A710, Neoverse N2/V2."""
choices = [
  { value = "armv8.0-a", title = "ARMv8.0-A (generic)" },
  { value = "armv8.2-a", title = "ARMv8.2-A" },
  { value = "armv9-a", title = "ARMv9-A" },
]

[[option.effect]]
when = "value == 'armv8.2-a'"
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-feature=+v8.2a", FERRIC_TARGET_CPPFLAGS = "-march=armv8.2-a" }

[[option.effect]]
when = "value == 'armv9-a'"
make_append = { FERRIC_TARGET_RUSTFLAGS = "-C target-feature=+v9a", FERRIC_TARGET_CPPFLAGS = "-march=armv9-a" }

[[option]]
id = "cpu.extra_rustflags"
menu = "cpu"
type = "string"
title = "Extra target RUSTFLAGS"
default = ""
rebuild = ["*"]
help = "Appended to RUSTFLAGS for every userspace Rust package, e.g. \"-C target-feature=+aes\"."

[[option.effect]]
when = "value != ''"
make_append = { FERRIC_TARGET_RUSTFLAGS = "{value}" }

[[option]]
id = "cpu.extra_cflags"
menu = "cpu"
type = "string"
title = "Extra target C/C++ flags"
default = ""
rebuild = ["*"]
help = "Appended to CPPFLAGS (so C and C++) for every userspace package."

[[option.effect]]
when = "value != ''"
make_append = { FERRIC_TARGET_CPPFLAGS = "{value}" }

[[option]]
id = "cpu.flags_exclude"
menu = "cpu"
type = "list"
title = "Recipes built without baseline flags"
default = ["kernel", "bootloader"]
make_var = "FERRIC_TARGET_FLAGS_EXCLUDE"
rebuild = ["*"]
help = """
Recipes that never get the CPU baseline or extra flags. The kernel and
bootloader must stay here: they run before the FPU/AVX state is set up."""

# ---------------------------------------------------------------- kernel

[[option]]
id = "kernel.acpi"
menu = "kernel"
type = "bool"
title = "ACPI support"
default = true
kernel_feature = "acpi"
rebuild = ["kernel"]
help = "Parse ACPI tables (MADT, HPET, ...). Required for multi-core."

[[option]]
id = "kernel.multi_core"
menu = "kernel"
type = "bool"
title = "Multi-core (SMP)"
default = true
selects = ["kernel.acpi"]
kernel_feature = "multi_core"
rebuild = ["kernel"]
help = "Bring up application processors. Turning this off gives a single-CPU kernel, useful when bisecting races."

[[option]]
id = "kernel.aslr"
menu = "kernel"
type = "bool"
title = "Randomize user-space addresses (ASLR)"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "aslr"
rebuild = ["kernel", "relibc"]
help = """
Give every new address space a random starting point (32 bits, from RDRAND)
for mappings that do not ask for a fixed address: PIE executables, heaps,
thread stacks, shared libraries and file mappings. relibc's exec also puts
each program's main stack at a random page up to 16 GiB below the top of user
space (22 bits). Fixed mappings, such as non-PIE executables, are not moved.
Without RDRAND, everything is placed as upstream places it."""

# exec runs in the parent process, in relibc, so the stack part is a relibc
# feature.
[[option.effect]]
when = "value"
make_append = { FERRIC_RELIBC_FEATURES = "aslr" }

[[option]]
id = "kernel.prot_none"
menu = "kernel"
type = "bool"
title = "Enforce PROT_NONE mappings (guard pages)"
default = true
kernel_feature = "prot_none"
rebuild = ["kernel"]
help = """
Make PROT_NONE memory inaccessible from user space, so the guard page below
each thread stack catches overflows. Upstream maps PROT_NONE pages readable,
which turns guard pages into ordinary memory. The kernel itself can still read
such pages on behalf of a system call."""

[[option]]
id = "kernel.kaslr"
menu = "kernel"
type = "bool"
title = "Randomize the kernel memory layout (KASLR)"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "kaslr"
rebuild = ["kernel"]
help = """
Place the kernel's map of physical memory at a random 1 GiB-aligned address at
each boot (about 17 bits of randomness, from RDRAND), so a physical address no
longer gives away its kernel virtual address. Without RDRAND the map stays at
its usual place and the boot log says so. The separate kernel.kaslr_image
option randomizes the kernel image itself."""

[[option]]
id = "kernel.kaslr_image"
menu = "kernel"
type = "bool"
title = "Load the kernel at a random address (kernel image KASLR)"
default = true
depends = "target.arch == 'x86_64'"
rebuild = ["kernel", "bootloader"]
help = """
Have the bootloader map the kernel at a random page inside the 1 GiB window
reserved for it (about 18 bits of randomness, from RDRAND) instead of at its
link address. The kernel is linked with --emit-relocs so the bootloader can
fix up its absolute addresses for the new place first. Kernel stack traces
print link addresses, which match kernel.sym. Without RDRAND, or with a
kernel that has no relocations, the kernel loads at its link address."""

[[option.effect]]
when = "value"
make_append = { FERRIC_KERNEL_LINK_ARGS = "--emit-relocs", FERRIC_BOOTLOADER_FEATURES = "kaslr" }

[[option]]
id = "kernel.iommu"
menu = "kernel"
type = "choice"
title = "IOMMU DMA and interrupt remapping (Intel VT-d, AMD-Vi)"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.iommu"
rebuild = ["kernel"]
help = """
Turn on the IOMMUs the firmware lists: the Intel VT-d units of the DMAR table,
or, on machines with an IVRS table instead, the AMD-Vi units. Devices start in
one identity domain, so DMA addresses do not change and drivers work as before,
but translation, invalidation and fault reporting run on the hardware; DMA
faults are logged on the console. Firmware's reserved memory regions (RMRRs, or
IVMDs on AMD-Vi) stay mapped. VT-d units with queued invalidation use it. "auto" enables every unit
that the kernel can drive and logs why it skips the others; "never" leaves
the IOMMU off, as upstream does. "auto" and "enforce" also run a short boot
self-test of DMA domains and provide the kernel.iommu scheme: pcid uses it to
give each PCI driver a DMA domain of its own with the driver's device, its
requester-ID aliases and its reserved memory in it, and every driver started through
pcid_interface binds it before its first DMA allocation (a driver of several
functions keeps one domain). Once bound, memory:translation answers with
addresses in it: each buffer is pinned and mapped on its first translation,
made read-only for the device when the driver takes write access away, and
unmapped when the driver unmaps it or exits, so the device can reach only
memory its driver translated. "enforce" goes further: a process must bind a
domain with a device attached before memory:translation answers at all (EACCES
otherwise; a forked child starts unbound), and devices that no driver attached
to a domain are blocked rather than identity-mapped. Processes that use DMA
memory without a PCI device (lived, nbdd and usbscsid ring buffers) cannot get
DMA addresses under "enforce". On VT-d units with interrupt remapping (and queued
invalidation), "auto" and "enforce" also remap interrupts: each unit gets a
4096-entry table (32-bit x2APIC destinations when the kernel uses x2APIC),
pcid asks the kernel for an entry for every MSI and MSI-X vector a driver
requests, so the entry checks the device's requester ID, and the I/O APIC is
checked through a remappable entry at boot. Under both, the unit blocks
compatibility-format interrupts, so a device cannot send an interrupt pcid did
not set up. AMD-Vi units do not remap interrupts yet: they pass interrupts
through, and pcid gives drivers compatibility-format MSI messages."""
choices = ["auto", "enforce", "never"]

[[option]]
id = "kernel.numa"
menu = "kernel"
type = "bool"
title = "NUMA awareness"
default = false
depends = "kernel.multi_core"
kernel_feature = "numa"
rebuild = ["kernel"]
help = "Parse SRAT and keep per-node memory information. Experimental upstream."

[[option]]
id = "kernel.irq_percpu"
menu = "kernel"
type = "bool"
title = "Per-CPU interrupt delivery"
default = false
depends = "target.arch == 'x86_64' && kernel.multi_core"
kernel_feature = "irq-percpu"
rebuild = ["kernel"]
help = """
Count and deliver interrupts per (CPU, vector) in the irq: scheme (Phase 2.4),
so a vector reserved on one CPU (irq:cpu-XX/N) is a different interrupt from
the same vector number on another, and each CPU counts its interrupts without
a shared lock. Adds the root-only irq:cpus file, which maps each running
logical CPU to its APIC id and NUMA node, and lists CPUs under irq: by logical
id. The groundwork for per-core NVMe and NIC queues. Off by default; without
it, irq: counts interrupts by vector number alone, as upstream."""

[[option]]
id = "kernel.regbuf"
menu = "kernel"
type = "bool"
title = "Registered buffers and zero-copy grants"
default = false
kernel_feature = "regbuf"
rebuild = ["kernel"]
help = """
Provide the kernel.regbuf scheme (Phase 2.2). An application registers a range
of its memory once into a region, which pins the pages, then hands a scheme a
grant: a read-only or read-write, revocable right to part of the region, as a
file descriptor. The scheme maps the grant and reads or writes the
application's pages directly instead of copying them. Revoking a grant, or
closing the region, unmaps it from every process that mapped it, with a TLB
shootdown, before the call returns. Non-root users may pin 16 MiB each, and
everyone together a quarter of memory. Off by default; without it the kernel
has no such scheme, as upstream."""

[[option]]
id = "kernel.rings"
menu = "kernel"
type = "bool"
title = "Submission/completion rings for every scheme"
default = false
kernel_feature = "rings"
rebuild = ["kernel"]
help = """
Provide the kernel.ring scheme (Phase 2.3). An application maps a ring, a
submission queue and a completion queue in memory it shares with the kernel,
writes requests (read, write, fsync) into it, and submits a whole batch with
one system call; each request gets a completion entry. Requests can be linked
so that the next one runs only if the previous one succeeded, across different
schemes (read a file, write it to a pipe) without returning to the
application in between. The kernel runs each request as the ordinary system
call on the application's descriptor, so every existing scheme works with it
unchanged. Off by default; without it the kernel has no such scheme, as
upstream."""

[[option]]
id = "drivers.grant_dma"
menu = "drivers"
type = "bool"
title = "Storage DMA into registered buffers (NVMe)"
default = false
depends = "kernel.regbuf && kernel.iommu != 'never'"
rebuild = ["base"]
help = """
Let applications attach a registered-buffer grant (Kernel > Registered buffers)
to a disk or partition descriptor of nvmed's disk scheme, then read and write
blocks straight between the disk and their own pages: the driver maps the grant
into its IOMMU DMA domain once (MapGrant) and points the controller at it, with
no bounce buffer, no copy and no per-request mapping. The device can reach the
granted pages and nothing else of the application, and revoking the grant
stops it before Revoke returns. Needs an IOMMU (VT-d or AMD-Vi) with
kernel.iommu "auto" or "enforce"; without a DMA domain attaching fails with
ENODEV. Also lets nvmed's zero-copy transfers (RedoxFS's ring included) use
PRP lists up to the controller's maximum transfer size instead of two pages.
Builds nvmed with its grant-dma Cargo feature. Off by default; without it the
disk schemes refuse grants, as upstream."""

[[option.effect]]
when = "value"
make_append = { FERRIC_INITFS_FEATURES = "nvmed/grant-dma" }

[[option]]
id = "kernel.self_modifying"
menu = "kernel"
type = "bool"
title = "Self-modifying code (CPU feature patching)"
default = true
kernel_feature = "self_modifying"
rebuild = ["kernel"]
help = "Patch hot paths at boot based on detected CPU features. Required for \"auto\" under CPU feature use."

[[option]]
id = "kernel.x86_kvm_pv"
menu = "kernel"
type = "bool"
title = "KVM paravirtual clock"
default = true
depends = "target.arch == 'x86_64'"
kernel_feature = "x86_kvm_pv"
rebuild = ["kernel"]
help = "Use the KVM paravirtualized clock when running under KVM."

[[option]]
id = "kernel.pti"
menu = "kernel"
type = "bool"
title = "Page table isolation (KPTI)"
default = false
experimental = true
kernel_feature = "pti"
rebuild = ["kernel"]
help = """
Unmap the kernel from user page tables (Meltdown mitigation). Upstream
marks this broken with threading; enable only to test it."""

[[option]]
id = "kernel.serial_debug"
menu = "kernel"
type = "bool"
title = "Serial console debug output"
default = true
kernel_feature = "serial_debug"
rebuild = ["kernel"]
help = "Send kernel log output to the serial port."

[[option]]
id = "kernel.qemu_debug"
menu = "kernel"
type = "bool"
title = "QEMU debug port output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "qemu_debug"
rebuild = ["kernel"]
help = "Write kernel log output to QEMU's 0xE9 debug port."

[[option]]
id = "kernel.lpss_debug"
menu = "kernel"
type = "bool"
title = "Intel LPSS UART debug output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "lpss_debug"
rebuild = ["kernel"]
help = "Log through the Intel Low Power Subsystem UART found on some laptops."

[[option]]
id = "kernel.system76_ec_debug"
menu = "kernel"
type = "bool"
title = "System76 EC debug output"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "system76_ec_debug"
rebuild = ["kernel"]
help = "Log through the System76 embedded controller."

[[option]]
id = "kernel.debugger"
menu = "kernel"
type = "bool"
title = "Built-in kernel debugger"
default = false
selects = ["kernel.syscall_debug"]
kernel_feature = "debugger"
rebuild = ["kernel"]
help = "Include the in-kernel debugger. Selects syscall debugging."

[[option]]
id = "kernel.syscall_debug"
menu = "kernel"
type = "bool"
title = "Syscall tracing"
default = false
kernel_feature = "syscall_debug"
rebuild = ["kernel"]
help = "Log system calls. Very noisy; for debugging only."

[[option]]
id = "kernel.profiling"
menu = "kernel"
type = "bool"
title = "Kernel profiling"
default = false
kernel_feature = "profiling"
rebuild = ["kernel"]
help = "Sample kernel execution for the profiling tools."

[[option]]
id = "kernel.trace"
menu = "kernel.tracing"
type = "bool"
title = "Kernel tracepoints"
default = false
depends = "target.arch == 'x86_64'"
kernel_feature = "trace"
rebuild = ["kernel"]
help = """
Compile typed tracepoints into the kernel (Phase T). Each one is a 5-byte NOP
until its event is turned on, when the kernel patches it into a jump to code
that writes a compact binary record (no text) to a 64 KiB ring of the CPU it
runs on. Events are turned on at boot (kernel.trace_boot, or FERRIC_TRACE=
in the boot environment) or at run time through the kernel.trace scheme,
which also hands out the records: `echo "enable syscall" >
/scheme/kernel.trace/events`, then read /scheme/kernel.trace/cpu/<n> and
decode with ferric-trace. The scheme is root-only for now. Off by default;
without it the kernel has no tracepoints and no such scheme, as upstream.
The options below choose which tracepoints are compiled in."""

[[option]]
id = "kernel.trace_syscall"
menu = "kernel.tracing"
type = "bool"
title = "System call tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_syscall"
rebuild = ["kernel"]
help = "Compile in syscall.enter (number and first four arguments) and syscall.exit (number and return value)."

[[option]]
id = "kernel.trace_sched"
menu = "kernel.tracing"
type = "bool"
title = "Scheduler tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_sched"
rebuild = ["kernel"]
help = "Compile in sched.switch (previous and next process and context) at every context switch."

[[option]]
id = "kernel.trace_scheme"
menu = "kernel.tracing"
type = "bool"
title = "Scheme request tracepoints"
default = true
depends = "kernel.trace"
kernel_feature = "trace_scheme"
rebuild = ["kernel"]
help = """Compile in scheme.request, scheme.response and scheme.cancel for requests
to user-space schemes. Each record carries the scheme id and the request's
ring SQE/CQE tag, so a request can be matched with its response, and the
caller's and responder's pids, so a request a daemon makes while serving
another can be followed (an application's read through RedoxFS to the disk
driver)."""

[[option]]
id = "kernel.trace_max_level"
menu = "kernel.tracing"
type = "choice"
title = "Most verbose tracepoint level compiled in"
default = "info"
depends = "kernel.trace"
rebuild = ["kernel"]
help = """
Tracepoints above this level are left out of the build entirely, as with the
tracing crate's max_level features. System calls and context switches are
"info"; finer events of later subsystems use "debug" and "trace"."""
choices = ["error", "warn", "info", "debug", "trace"]

[[option.effect]]
when = "value == 'warn'"
kernel_features = ["trace_level_warn"]

[[option.effect]]
when = "value == 'info'"
kernel_features = ["trace_level_info"]

[[option.effect]]
when = "value == 'debug'"
kernel_features = ["trace_level_debug"]

[[option.effect]]
when = "value == 'trace'"
kernel_features = ["trace_level_trace"]

[[option]]
id = "kernel.trace_boot"
menu = "kernel.tracing"
type = "string"
title = "Events on from boot"
default = ""
depends = "kernel.trace"
kernel_config = "trace.boot"
rebuild = ["kernel"]
help = """
Events to turn on before the other CPUs start: a list of "all", subsystem
names (syscall, sched) or event names (sched.switch), separated by commas.
FERRIC_TRACE= in the boot environment (press e in the bootloader) adds to it."""

[[option]]
id = "kernel.sys_fdstat"
menu = "kernel"
type = "bool"
title = "File descriptor statistics in sys:"
default = false
kernel_feature = "sys_fdstat"
rebuild = ["kernel"]
help = "Expose per-process file descriptor statistics through the sys: scheme."

[[option]]
id = "kernel.busy_panic"
menu = "kernel"
type = "bool"
title = "Spin on panic"
default = false
kernel_feature = "busy_panic"
rebuild = ["kernel"]
help = "Busy-loop instead of halting after a panic, so a debugger can attach."

[[option]]
id = "kernel.drop_panic"
menu = "kernel"
type = "bool"
title = "Panic on unexpected drops"
default = false
kernel_feature = "drop_panic"
rebuild = ["kernel"]
help = "Panic when certain kernel objects are dropped unexpectedly. For debugging leaks and use-after-free."

[[option]]
id = "kernel.cpu.smap"
menu = "kernel.cpu"
type = "choice"
title = "SMAP (supervisor mode access prevention)"
default = "auto"
defaults = [{ when = "cpu.x86_64_level == 'v4'", value = "always" }]
kernel_config = "arch.x86_64.features.smap"
rebuild = ["kernel"]
help = "Stops the kernel touching user memory by accident. Every v4 CPU has it; Haswell (v3) does not."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.fsgsbase"
menu = "kernel.cpu"
type = "choice"
title = "FSGSBASE instructions"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.fsgsbase"
rebuild = ["kernel"]
help = "Fast FS/GS base switching on context switch. Present on every v3 and v4 CPU."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.xsave"
menu = "kernel.cpu"
type = "choice"
title = "XSAVE"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.xsave"
rebuild = ["kernel"]
help = "Save extended (AVX/AVX-512) register state with XSAVE. Required by level v3 and up."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.xsaveopt"
menu = "kernel.cpu"
type = "choice"
title = "XSAVEOPT"
default = "auto"
defaults = [{ when = "cpu.x86_64_level in ['v3', 'v4']", value = "always" }]
kernel_config = "arch.x86_64.features.xsaveopt"
rebuild = ["kernel"]
help = "Skip saving unmodified register state. Present on every v3 and v4 CPU."
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.avx512"
menu = "kernel.cpu"
type = "choice"
title = "AVX-512 register state"
default = "auto"
defaults = [
  { when = "kernel.cpu.xsave == 'never'", value = "never" },
  { when = "cpu.x86_64_level == 'v4'", value = "always" },
]
kernel_config = "arch.x86_64.features.avx512"
rebuild = ["kernel"]
help = """
Enable the AVX-512 opmask and ZMM state components in XCR0 so user space
can run AVX-512 code, and save them on context switch. "auto" enables them
when the CPU has AVX512F; level v4 requires them. Costs about 1.7 KB more
XSAVE area per thread on AVX-512 CPUs, and nothing elsewhere."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.kpti"
menu = "kernel.cpu"
type = "choice"
title = "Kernel page-table isolation (Meltdown)"
default = "auto"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.kpti"
rebuild = ["kernel"]
help = """
Give each process a second page table that maps almost none of the kernel and
is loaded while user code runs, so Meltdown (CVE-2017-5754) cannot read kernel
memory. "auto" turns it on for Intel CPUs that do not report RDCL_NO; AMD CPUs
and recent Intel ones are not affected and pay nothing. It costs two page-table
switches and TLB flushes per system call and interrupt on affected CPUs; see
kernel.cpu.pcid for avoiding the flushes."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.pcid"
menu = "kernel.cpu"
type = "choice"
title = "PCIDs for KPTI (no-flush page-table switches)"
default = "auto"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.pcid"
rebuild = ["kernel"]
help = """
When KPTI is on, tag the kernel and user page tables with two process-context
identifiers (PCIDs), so the page-table switches on every system call and
interrupt keep the TLB instead of flushing it. Unmap, mprotect and TLB
shootdowns also invalidate the user PCID with INVPCID; switching between
processes still flushes. "auto" uses it when the CPU reports PCID and INVPCID
(Intel Haswell, AMD Zen 3 and newer); "always" panics at boot when KPTI is on
and the CPU lacks them. Has no effect while KPTI is off."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.ibt"
menu = "kernel.cpu"
type = "choice"
title = "Indirect branch tracking (CET IBT) in the kernel"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.ibt"
rebuild = ["kernel"]
help = """
Build the kernel (and its core and alloc) with endbr64 at every function entry
and turn on Intel CET indirect branch tracking in supervisor mode, so an
indirect call or jump that lands anywhere other than an endbr64 stops the
kernel with a control-protection fault (#CP) instead of running a gadget.
"auto" turns it on when the CPU reports CET_IBT (Intel Tiger Lake, Sapphire
Rapids and newer); "always" panics at boot on CPUs without it. User-mode CET
and kernel shadow stacks stay off. Costs four bytes per function and no jump
tables. Off by default because CI cannot test it: KVM on the runners does not
expose CET and QEMU's emulator does not implement it."""
choices = ["always", "auto", "never"]

[[option]]
id = "kernel.cpu.shstk"
menu = "kernel.cpu"
type = "choice"
title = "Shadow stacks (CET SS) in the kernel"
default = "never"
depends = "target.arch == 'x86_64'"
kernel_config = "arch.x86_64.features.shstk"
rebuild = ["kernel"]
help = """
Intel CET supervisor shadow stacks keep a second, write-protected copy of every
return address and stop the kernel with a control-protection fault (#CP) when a
`ret` does not match it, which defeats return-oriented gadget chains. "auto"
turns them on when the CPU reports CET_SS (Intel Tiger Lake, AMD Zen 3 and
newer) and logs a boot self-test; "always" additionally panics at boot on CPUs
without it. On a CPU without CET_SS, or with more than 1 TiB of RAM, "auto"
stays off and logs that it is skipping. Enabling alongside kernel.cpu.kpti is
not yet supported: with KPTI on, shadow stacks are allocated but left off
("always" then panics, so use "auto"). Independent of kernel.cpu.ibt. Compiled
shadow-stack support reserves a private 32 MiB frame pool (4096 stacks), excluded
from the writable physical map. Pool exhaustion fails allocation without a
writable fallback. Like the
other "auto" CPU options it acts as "never" without kernel.self_modifying. Off
by default because CI cannot test it: KVM on the runners does not expose CET and
QEMU's emulator does not implement it."""
choices = ["always", "auto", "never"]

# ---------------------------------------------------------------- image

[[option]]
id = "image.config"
menu = "image"
type = "choice"
title = "Base filesystem configuration"
default = "desktop"
make_var = "CONFIG_NAME"
help = """
Which config/*.toml (or config/<arch>/*.toml) the image starts from.
Sets CONFIG_NAME; the build directory is build/<arch>/<config>.
ferric-smoke and ferric-fuzz select the existing CI test images on x86_64.
They retain your configured CPU and kernel options; CI's forced test settings
are separate from these image-content choices."""
choices = [
  { value = "minimal", title = "minimal: console only" },
  { value = "server", title = "server: console and network services" },
  { value = "desktop-minimal", title = "desktop-minimal: Orbital and a terminal" },
  { value = "desktop", title = "desktop: the default desktop" },
  { value = "dev", title = "dev: desktop plus compilers" },
  { value = "demo", title = "demo: desktop plus apps and games" },
  { value = "full", title = "full: everything that builds (x86-64)" },
  { value = "wayland", title = "wayland: Wayland session" },
  { value = "x11", title = "x11: X11 session" },
  { value = "tests", title = "tests: test suites" },
  { value = "ferric-smoke", title = "ferric-smoke: Ferric CI smoke tests (x86-64)" },
  { value = "ferric-fuzz", title = "ferric-fuzz: extended syscall fuzzing (x86-64)" },
]

[[option]]
id = "image.filesystem_size"
menu = "image"
type = "int"
title = "Filesystem size in MiB (0 = from config)"
default = 0
min = 0
max = 1048576
help = "Overrides filesystem_size from the base configuration."

[[option.effect]]
when = "value > 0"
general = { filesystem_size = "{value}" }

[[option]]
id = "image.packages_add"
menu = "image"
type = "list"
title = "Extra packages"
default = []
help = "Recipe names to add to the image, e.g. [\"vim\", \"htop\"]."

[[option.effect]]
packages_from_value = true

[[option]]
id = "image.packages_remove"
menu = "image"
type = "list"
title = "Packages to leave out"
default = []
help = "Recipe names to drop from the base configuration (written as \"ignore\")."

[[option.effect]]
ignore_from_value = true

[[option]]
id = "image.encrypt"
menu = "image"
type = "bool"
title = "Encrypt the root filesystem"
default = false
help = "Pass --encrypt to redoxfs-mkfs. The image build asks for a password."

[[option.effect]]
make = { REDOXFS_MKFS_FLAGS = "--encrypt" }

# ---------------------------------------------------------------- packages

[[option]]
id = "packages.manager"
menu = "packages"
type = "choice"
title = "Package manager"
default = "fox"
help = """
The package manager on the target.

  fox       Ferric Oxide's fox (tools/fox), built from this repository.
            It verifies every archive against the keys in /etc/fox/keys
            (the installer puts the key that signed the image's packages
            there), and on first boot adopts the packages the installer
            put in the image (fox adopt-pkg), so fox list, fox verify
            --installed and fox remove cover the whole system.
            fox installs local .pkgar files; it does not fetch from
            package servers.
            The image build finishes the root with the host fox: it
            adopts the installed packages at build time, syncs
            packages.set if one is given, and writes the image SBOM to
            build/<arch>/<config>/image.cdx.json. Sets FERRIC_FOX_IMAGE=1.
  pkgutils  upstream Redox's pkg, which can fetch from package servers."""
choices = [
  { value = "fox", title = "fox: verify, install and remove signed local packages" },
  { value = "pkgutils", title = "pkgutils: upstream pkg" },
]

[[option.effect]]
when = "value == 'fox'"
source_packages = ["fox"]
ignore_packages = ["pkgutils"]
make = { FERRIC_FOX_IMAGE = "1" }

[[option]]
id = "packages.set"
menu = "packages"
type = "string"
title = "Package set synced into the image"
default = ""
depends = "packages.manager == 'fox'"
make_var = "FERRIC_FOX_PACKAGES"
help = """
A fox package set (fox-packages/1: registries, packages and policy; see
the package tooling chapter of the book) that the image build installs
with `fox sync --target <image target>` after the installer has placed
the configuration's packages. The lock, fox.lock, is written beside the
set; commit it to make image builds reproducible. Packages need prebuilt
artifacts for the image target, or a source build that can cross-compile
to it. Empty means no set. Sets FERRIC_FOX_PACKAGES."""

[[option]]
id = "packages.locked"
menu = "packages"
type = "bool"
title = "Require every package to be locked"
default = false
depends = "packages.manager == 'fox' && packages.set != ''"
make_var = "FERRIC_FOX_LOCKED"
help = """
Fail the image build unless fox.lock beside packages.set already pins
every package (fox sync --locked), so a release image is built from
exactly the archives and commits recorded there. Sets
FERRIC_FOX_LOCKED."""

[[option]]
id = "packages.signed_manifests"
menu = "packages"
type = "bool"
title = "Signed package manifests"
default = true
make_var = "FERRIC_FOX_MANIFEST"
rebuild = ["*"]
help = """
Put a fox manifest (usr/share/fox/manifest/<name>.toml: name, version,
target, dependencies, source) into every package the cookbook packs, so
the archive signature covers the package's identity. Without it fox only
has the unsigned metadata file beside each archive and needs
--allow-unsigned-metadata. Sets FERRIC_FOX_MANIFEST; changing it repacks
every package."""

# ---------------------------------------------------------------- build

[[option]]
id = "build.podman"
menu = "build"
type = "bool"
title = "Build inside Podman"
default = true
make_var = "PODMAN_BUILD"
help = "Run the build in the Podman container (recommended). Sets PODMAN_BUILD."

[[option]]
id = "build.prefix_binary"
menu = "build"
type = "bool"
title = "Download the prebuilt toolchain"
default = true
make_var = "PREFIX_BINARY"
help = "Use the prebuilt cross toolchain instead of building GCC/LLVM/Rust. Sets PREFIX_BINARY."

[[option]]
id = "build.repo_binary"
menu = "build"
type = "bool"
title = "Download prebuilt packages"
default = false
make_var = "REPO_BINARY"
make_false = ""
help = """
Fetch packages from the upstream package server instead of building them.
Much faster, but those packages ignore every compile-time option here
(processor baseline, kernel features). Sets REPO_BINARY."""

[[option]]
id = "build.debug"
menu = "build"
type = "bool"
title = "Debug info"
default = false
make_var = "REPO_DEBUG"
rebuild = ["*"]
help = "Keep debug info and skip stripping in locally built packages. Sets REPO_DEBUG."

[[option]]
id = "build.offline"
menu = "build"
type = "bool"
title = "Offline (do not update sources)"
default = false
make_var = "REPO_OFFLINE"
help = "Build from the sources already fetched. Sets REPO_OFFLINE."

[[option]]
id = "build.nonstop"
menu = "build"
type = "bool"
title = "Keep going after package failures"
default = false
make_var = "REPO_NONSTOP"
help = "Try to build every package even when some fail. Sets REPO_NONSTOP."

# ---------------------------------------------------------------- qemu

[[option]]
id = "qemu.kvm"
menu = "qemu"
type = "choice"
title = "Hardware virtualization"
default = "auto"
help = "auto uses KVM when host and target architectures match."
choices = ["auto", "yes", "no"]

[[option.effect]]
when = "value != 'auto'"
make = { kvm = "{value}" }

[[option]]
id = "qemu.memory"
menu = "qemu"
type = "int"
title = "Memory in MiB (0 = default)"
default = 0
min = 0
max = 1048576
help = "Sets QEMU_MEM."

[[option.effect]]
when = "value > 0"
make = { QEMU_MEM = "{value}" }

[[option]]
id = "qemu.cpus"
menu = "qemu"
type = "int"
title = "CPU count (0 = default)"
default = 0
min = 0
max = 1024
help = "Sets QEMU_SMP."

[[option.effect]]
when = "value > 0"
make = { QEMU_SMP = "{value}" }

[[option]]
id = "qemu.cpu_model"
menu = "qemu"
type = "string"
title = "Emulated CPU model override"
default = ""
help = "QEMU -cpu model when KVM is off. Empty picks one that matches the processor baseline."

[[option.effect]]
when = "value != ''"
override = true
make = { QEMU_CPU = "{value}" }

# ---------------------------------------------------------------- rules

[[rule]]
level = "warn"
when = "build.repo_binary && target.arch == 'x86_64' && cpu.x86_64_level != 'v1'"
message = "Prebuilt packages are compiled for baseline x86-64; only packages you build locally use the selected level."

[[rule]]
level = "warn"
when = "!kernel.self_modifying && (kernel.cpu.smap == 'auto' || kernel.cpu.fsgsbase == 'auto' || kernel.cpu.xsave == 'auto' || kernel.cpu.xsaveopt == 'auto' || kernel.cpu.avx512 == 'auto' || kernel.cpu.kpti == 'auto' || kernel.cpu.pcid == 'auto' || kernel.cpu.ibt == 'auto' || kernel.cpu.shstk == 'auto')"
message = "Kernel CPU features set to \"auto\" act as \"never\" without self-modifying code."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && kernel.cpu.pcid == 'always' && kernel.cpu.kpti == 'never'"
message = "kernel.cpu.pcid only affects KPTI; with kernel.cpu.kpti = \"never\" it does nothing."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && kernel.cpu.shstk == 'always' && kernel.cpu.kpti != 'never'"
message = "kernel.cpu.shstk = \"always\" cannot be met with KPTI on (enabling shadow stacks alongside KPTI is not yet supported); use \"auto\", or set kernel.cpu.kpti = \"never\"."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && kernel.cpu.shstk != 'never' && kernel.cpu.kpti == 'auto'"
message = "With kernel.cpu.kpti = \"auto\" (on for Meltdown-affected Intel CPUs), shadow stacks are allocated but left off on those CPUs; enabling shadow stacks alongside KPTI is not yet supported."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && cpu.x86_64_level == 'v4' && (kernel.cpu.avx512 == 'never' || (kernel.cpu.avx512 == 'auto' && !kernel.self_modifying))"
message = "Level v4 userspace uses AVX-512, which faults unless the kernel enables its state; kernel.cpu.avx512 cannot be \"never\", or \"auto\" without kernel.self_modifying."

[[rule]]
level = "error"
when = "kernel.trace && kernel.profiling"
message = "kernel.trace cannot be combined with kernel.profiling yet: the profiler's CPU would not answer the interrupt live tracepoint patching waits for."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && kernel.cpu.avx512 != 'never' && kernel.cpu.xsave == 'never'"
message = "AVX-512 state is saved with XSAVE; kernel.cpu.avx512 needs kernel.cpu.xsave."

[[rule]]
level = "warn"
when = "target.arch == 'x86_64' && cpu.x86_64_level == 'v4' && qemu.kvm != 'yes' && qemu.cpu_model == ''"
message = "QEMU cannot emulate AVX-512 without KVM; run `make qemu` with KVM on an AVX-512 host (qemu.kvm = \"yes\")."

[[rule]]
level = "error"
when = "target.arch == 'x86_64' && cpu.x86_64_level in ['v3', 'v4'] && kernel.cpu.xsave == 'never'"
message = "Level v3 and up use AVX state, which the kernel can only save with XSAVE; kernel.cpu.xsave cannot be \"never\"."

[[rule]]
level = "error"
when = "image.config == 'full' && target.arch != 'x86_64'"
message = "The full configuration only exists for x86_64."

[[rule]]
level = "error"
when = "image.config in ['ferric-smoke', 'ferric-fuzz'] && target.arch != 'x86_64'"
message = "Ferric smoke and fuzz configurations require x86_64; their test packages include x86-64 register-state checks."
