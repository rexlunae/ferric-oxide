[package]
name = "fox-build"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hermetic Cargo builds of git sources into signed, attested fox packages"
publish = false

[dependencies]
blake3 = { workspace = true, features = ["std"] }
cargo_metadata = "0.23.1"
fox-core = { path = "../fox-core", features = ["std"] }
fox-git = { path = "../fox-git" }
fox-sbom = { path = "../fox-sbom" }
pkgar = { workspace = true }
pkgar-core = { workspace = true }
pkgar-keys = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["formatting"] }
toml = { workspace = true, features = ["parse", "display", "serde", "std"] }

[dev-dependencies]
fox-core = { path = "../fox-core", features = ["test-fixtures"] }
tempfile.workspace = true
