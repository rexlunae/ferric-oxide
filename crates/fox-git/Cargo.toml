[package]
name = "fox-git"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Git sources for fox: commits, the fox-tree/1 BLAKE3 tree hash and tree export"
publish = false

[dependencies]
blake3 = { workspace = true, features = ["std"] }
fox-core = { path = "../fox-core" }
# Local repository access only: revision parsing and object reading. No
# network transport is compiled in.
gix = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
