[package]
name = "fox-git"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Git sources for fox: commits, the fox-tree/1 BLAKE3 tree hash, tree export, fetching and SSH-signed release tags"
publish = false

[dependencies]
blake3 = { workspace = true, features = ["std"] }
fox-core = { path = "../fox-core", features = ["std"] }
# Revision parsing, object reading and writing, and fetching over the
# file://, ssh:// and git:// transports. https:// and http:// go through
# gix's HTTP transport with fox's own backend (src/http.rs), whose trait
# gix-transport's http-client feature provides.
gix = { workspace = true, features = ["blocking-network-client"] }
gix-error = "0.5"
gix-transport = { version = "0.61", default-features = false, features = ["http-client"] }
semver.workspace = true
ssh-key.workspace = true
thiserror = { workspace = true, features = ["std"] }
# HTTP and HTTPS on every target, Redox included. rustls uses ring:
# aws-lc-rs does not build for Redox and is not under a license on the
# project's list. Roots come from the system store.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true
