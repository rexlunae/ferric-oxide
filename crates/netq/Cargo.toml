[package]
name = "ferric-netq"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The kernel-bypass network queue ABI: UMEM frames, ring descriptors, steering filters and the queue socket's calls"

# Shared crates are also consumed through recipe symlinks outside the host workspace, so the
# versions are written here rather than taken from [workspace.dependencies].
[dependencies]
etherparse = { version = "0.21", default-features = false }
thiserror = { version = "2", default-features = false }
