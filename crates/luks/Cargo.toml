[package]
name = "ferric-luks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only LUKS1 and LUKS2 header parsing and volume-key recovery, no_std, written from the published on-disk format specifications"
publish = false

[dependencies]
# The RustCrypto releases RedoxFS and relibc already build with (digest 0.10 / cipher 0.4).
# `zeroize` clears expanded round keys when a cipher is dropped.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror.workspace = true
xts-mode = { version = "0.5", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
sha2 = "0.10"

[features]
# Portable SHA-1/SHA-2 code for soft-float targets such as x86_64-unknown-uefi, where the
# SIMD backends do not compile. Build those targets with RUSTFLAGS="--cfg aes_force_soft" too,
# as the bootloader already does for RedoxFS.
force-soft = ["sha1/force-soft", "sha2/force-soft"]
