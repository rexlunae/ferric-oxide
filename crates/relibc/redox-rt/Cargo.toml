[package]
# Ferric Oxide: explicit workspace root for cross-workspace path dependencies.
workspace = ".."
name = "redox-rt"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Libc-independent runtime for Redox"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags.workspace = true
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
plain.workspace = true
ioslice.workspace = true
redox_syscall.workspace = true
redox-path.workspace = true
redox_protocols.workspace = true

generic-rt = { path = "../generic-rt" }
# Ferric Oxide: shared crate beside relibc in the monorepo's crates/ (see recipes/core/relibc).
ferric-hwrand = { path = "../../hwrand", optional = true }
# Ferric Oxide: the image records exec and ld.so give the kernel for /scheme/sys/proc.
ferric-procinfo = { path = "../../procinfo" }

[features]
proc = []
default = ["proc"]
# Ferric Oxide: start each new program's stack at a random address.
aslr = ["dep:ferric-hwrand"]

[lints]
workspace = true
