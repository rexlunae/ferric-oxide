[package]
name = "ferric-boot-time"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Validated firmware wall-clock handoff from the bootloader to the kernel"

[dependencies]
# The workspace's no_std baseline, so this crate and the host tools that need
# the clock share one version. The kernel and bootloader workspaces build it as
# a path dependency, and it stays a member of the host workspace, so the
# inherited entry resolves where the version is declared.
time = { workspace = true }
