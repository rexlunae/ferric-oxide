[package]
name = "ferric-boot-time"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Validated firmware wall-clock handoff from the bootloader to the kernel"

[dependencies]
# The same no_std baseline as the host workspace's `time` entry, declared with
# its version rather than inherited from it. The bootloader recipe builds this
# crate as a sibling symlink of a copied bootloader source tree, where Cargo has
# no workspace root to inherit from, so `workspace = true` fails there. Keep the
# version in step with `workspace.dependencies.time`.
time = { version = "0.3.44", default-features = false }
