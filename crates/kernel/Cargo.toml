[workspace]
resolver = "3"
members = ["tests"]

[package]
name = "kernel"
version = "0.5.12"
build = "build.rs"
edition = "2024"

[build-dependencies]
cc = "1.0"
toml = "0.8"

[dependencies]
arrayvec = { version = "0.7.4", default-features = false }
bitfield = "0.13.2"
bitflags = "2"
ferric-abi = { path = "../abi" }
ferric-aligned-buffer = { path = "../aligned-buffer" }
ferric-devicetree = { path = "../devicetree" }
ferric-amdvi = { path = "../amdvi" }
ferric-cet = { path = "../cet" }
ferric-hwrand = { path = "../hwrand", optional = true }
ferric-iommu = { path = "../iommu", features = ["alloc"] }
ferric-irq = { path = "../irq", optional = true }
ferric-nospec = { path = "../nospec" }
ferric-pcache = { path = "../pcache", features = ["alloc"], optional = true }
ferric-procinfo = { path = "../procinfo", features = ["alloc"], optional = true }
ferric-regbuf = { path = "../regbuf", features = ["alloc"], optional = true }
ferric-ring = { path = "../ring", optional = true, features = ["alloc"] }
ferric-trace = { path = "../trace", features = ["alloc"], optional = true }
ferric-vtd = { path = "../vtd" }
hashbrown = { version = "0.14.3", default-features = false, features = ["ahash", "inline-more"] }
linked_list_allocator = "0.9.0"
redox_syscall = { path = "syscall" }
rmm = { path = "rmm", default-features = false }
slab = { version = "0.4", default-features = false }
smallvec = { version = "1.15.1", default-features = false }
spin = { version = "0.9.8" }

[dependencies.object]
version = "0.37.1"
default-features = false
features = ["read_core", "elf"]

[dependencies.rustc-demangle]
version = "0.1.16"
default-features = false

[lints.clippy]
# Overflows are very, very bad in kernel code as it may provide an attack vector for
# userspace applications, and it is only checked in debug builds
# TODO: address occurrences and then deny
arithmetic_side_effects = "warn"
cast_ptr_alignment = "deny"
identity_op = "allow" # Used to allow stuff like 1 << 0 and 1 * 1024 * 1024
if_same_then_else = "allow" # Useful for adding comments about different branches
# Indexing a slice can cause panics and that is something we always want to avoid
# in kernel code. Use .get and return an error instead
# TODO: address occurrences and then deny
indexing_slicing = "warn"
many_single_char_names = "allow" # Useful in the syscall function
module_inception = "allow" # Used for context::context
# Not implementing default is sometimes useful in the case something has significant cost
# to allocate. If you implement default, it can be allocated without evidence using the
# ..Default::default() syntax. Not fun in kernel space
new_without_default = "allow"
not_unsafe_ptr_arg_deref = "deny"
or_fun_call = "allow" # Used to make it nicer to return errors, for example, .ok_or(Error::new(ESRCH))
precedence = "deny"
ptr_cast_constness = "deny"
too_many_arguments = "allow" # This is needed in some cases, like for syscall
# Avoid panicking in the kernel without information about the panic. Use expect
# TODO: address occurrences and then deny
unwrap_used = "warn"

[lints.rust]
static_mut_refs = "warn" # FIXME deny once all occurrences are fixed
# This is usually a serious issue - a missing import of a define where it is interpreted
# as a catch-all variable in a match, for example
unreachable_patterns = "deny"
unused_must_use = "deny" # Ensure that all must_use results are used

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "10.2.0"
x86 = { version = "0.47.0", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
ferric-boot-time = { path = "../boot-time" }

[target.'cfg(any(target_arch = "riscv64", target_arch = "riscv32"))'.dependencies]
sbi-rt = "0.0.3"

[features]
default = [
  "acpi",
  #"debugger",
  "multi_core",
  "numa",
  "serial_debug",
  "self_modifying",
  "x86_kvm_pv",
  #"busy_panic",
  #"drop_panic",
  #"syscall_debug",
]

# Activates some limited code-overwriting optimizations, based on CPU features.
self_modifying = []

acpi = []
# Ferric Oxide: randomize the base of the physical memory map at boot (x86_64).
kaslr = ["dep:ferric-hwrand"]
# Ferric Oxide: make PROT_NONE mappings inaccessible from user mode (guard pages).
prot_none = []
# Ferric Oxide: start each address space's mmap search at a random address (x86_64).
aslr = ["dep:ferric-hwrand"]
# Ferric Oxide: the kernel.regbuf scheme, registered buffers and zero-copy grants.
regbuf = ["dep:ferric-regbuf"]
# Ferric Oxide: the kernel.ring scheme, submission/completion rings brokered to any scheme.
rings = ["dep:ferric-ring"]
# Ferric Oxide: the kernel.pcache scheme, the shared page cache (read path).
page_cache = ["dep:ferric-pcache"]
# Ferric Oxide: cached writes into the page cache, written back by the file system.
page_cache_writeback = ["page_cache"]
# Ferric Oxide: tracepoints, per-CPU trace rings and the kernel.trace scheme (x86_64).
trace = ["dep:ferric-trace"]
# Ferric Oxide: count and deliver irq: interrupts per (CPU, vector), and the root-only
# irq:cpus map of logical CPUs to APIC ids (x86_64).
irq-percpu = ["dep:ferric-irq"]
# Ferric Oxide: the subsystems whose tracepoints are compiled in.
trace_syscall = ["trace"]
trace_sched = ["trace"]
trace_scheme = ["trace"]
trace_mm = ["trace"]
trace_irq = ["trace"]
trace_iommu = ["trace"]
# Ferric Oxide: a panic leaves its message and the newest trace records in reserved memory that
# survives a warm reboot, served by kernel.trace/crash on the next boot.
trace_crash = ["trace"]
# Ferric Oxide: writing `panic` to kernel.trace/crash panics the kernel and resets the machine
# after the dump, for testing it in CI.
trace_crash_test = ["trace_crash"]
# Ferric Oxide: everything the kernel logs is also kept in reserved memory that survives a warm
# reboot, served by sys:log_previous on the next boot.
log_persist = ["dep:ferric-trace"]
# Ferric Oxide: the most verbose tracepoint level compiled in; with none, only errors.
trace_level_warn = ["trace"]
trace_level_info = ["trace_level_warn"]
trace_level_debug = ["trace_level_info"]
trace_level_trace = ["trace_level_debug"]
lpss_debug = []
multi_core = ["acpi"]
numa = ["multi_core"]
# Ferric Oxide: the ctl-profiling read of the kernel text address uses ferric-trace's
# profile::ControlLine.
profiling = ["dep:ferric-trace"]
drop_panic = []
busy_panic = []
qemu_debug = []
serial_debug = []
system76_ec_debug = []
x86_kvm_pv = []

debugger = ["syscall_debug"]
syscall_debug = []

sys_fdstat = []
# Ferric Oxide: /scheme/sys/proc, per-process introspection (kernel.sys_proc).
sys_proc = ["dep:ferric-procinfo"]

[profile.dev]
# Avoids having to define the eh_personality lang item and reduces kernel size
panic = "abort"

[profile.release]
# Avoids having to define the eh_personality lang item and reduces kernel size
panic = "abort"
#lto = true
debug = "full"
# Ferric Oxide: one codegen unit. With several, which functions are inlined into the system call
# path depends on how rustc happens to split the crate, so any change elsewhere in the kernel (an
# optional feature such as kernel.trace, say) can move hot-path inlining and cost a few percent.
codegen-units = 1
