# Host tests of actual kernel modules, sharing the kernel's dependency lockfile.
[package]
name = "ferric-kernel-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "lib.rs"

[dependencies]
redox_syscall = { path = "../syscall", default-features = false }
ferric-abi = { path = "../../abi" }
ferric-irq = { path = "../../irq", optional = true }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex", "rwlock"] }

[features]
irq-percpu = ["dep:ferric-irq"]
# Exercise wait-list destruction with the kernel's diagnostic enabled.
drop_panic = []
# Compile the inherited bounded-spin path when checking all features.
busy_panic = []
