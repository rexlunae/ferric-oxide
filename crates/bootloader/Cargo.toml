[package]
name = "redox_bootloader"
version = "1.0.0"
edition = "2024"

# UEFI uses bin target
[[bin]]
name = "bootloader"
path = "src/main.rs"

# BIOS uses lib target
[lib]
name = "bootloader"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
bitflags = "1.3.2"
linked_list_allocator = "0.10.5"
log = "0.4.17"
redox_syscall = "0.5"
spin = "0.9.5"

# Ferric Oxide: kernel image KASLR (the `kaslr` feature).
ferric-elfreloc = { path = "../elfreloc", optional = true }
ferric-hwrand = { path = "../hwrand", optional = true }

[dependencies.redoxfs]
version = "0.8"
default-features = false
features = ["log"]

[target.'cfg(target_os = "uefi")'.dependencies]
redox_uefi = { git = "https://github.com/rexlunae/uefi.git" } # Ferric mirror of redox-os/uefi
redox_uefi_std = { git = "https://github.com/rexlunae/uefi.git" }

#TODO: riscv cannot use target_os = "uefi" at this time
[target.'cfg(target_arch = "riscv64")'.dependencies]
redox_uefi = { git = "https://github.com/rexlunae/uefi.git" }
redox_uefi_std = { git = "https://github.com/rexlunae/uefi.git" }

[target."aarch64-unknown-uefi".dependencies]
dmidecode = "0.8.0"
ferric-boot-time = { path = "../boot-time" }

[target."x86_64-unknown-uefi".dependencies]
x86 = "0.52.0"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
byteorder = { version = "1", default-features = false }
fdt = { git = "https://github.com/repnop/fdt.git", rev = "2fb1409edd1877c714a0aa36b6a7c5351004be54" }

[features]
default = []
live = []
# Ferric Oxide: load the kernel at a random address (kernel image KASLR).
kaslr = ["dep:ferric-elfreloc", "dep:ferric-hwrand"]
serial_debug = []

