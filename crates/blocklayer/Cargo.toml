[package]
name = "ferric-blocklayer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Stackable read-only block layers (slices, LUKS decryption, LVM logical volumes), no_std"
publish = false

[dependencies]
ferric-luks = { path = "../luks", optional = true }
ferric-lvm = { path = "../lvm", optional = true }
# Not inherited from the host workspace: recipes (ferric-blockd) build this crate through a
# symlink outside that workspace, where `workspace = true` cannot be resolved. Keep the
# version in step with the root Cargo.toml's [workspace.dependencies].
thiserror = { version = "2", default-features = false }

[features]
# Everything, for the host tests; the kernel, bootloader and daemon pick what they need with
# default-features = false.
default = ["luks", "lvm"]
## Heap-backed layers: the runtime [`Stack`] and the `Box`/`Arc` device impls.
alloc = []
## The LUKS1/LUKS2 decryption layer (features.toml `fs.luks`).
luks = ["alloc", "dep:ferric-luks"]
## The LVM2 logical-volume layer (features.toml `fs.lvm`).
lvm = ["alloc", "dep:ferric-lvm"]
