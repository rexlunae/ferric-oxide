[package]
name = "ferric-iommu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The kernel iommu scheme's interface, PCI requester-ID alias rules and the I/O page-table and IOVA code shared by the VT-d and AMD-Vi backends"

[dependencies]

[dev-dependencies]
ferric-regbuf = { workspace = true, features = ["alloc"] }

[features]
default = []
## Requester-ID alias computation (`alias`), the DMA mapping bookkeeping (`dma`) and the
## IOVA and domain-ID allocators (`iova`), which need a heap.
alloc = []
