[package]
name = "ferric-lvm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only LVM2 physical-volume labels, metadata and logical-volume mapping, no_std, written from published format documentation"
publish = false

[dependencies]
# Not inherited from the host workspace: recipes (ferric-blockd) build this crate through a
# symlink outside that workspace, where `workspace = true` cannot be resolved. Keep the
# version in step with the root Cargo.toml's [workspace.dependencies].
thiserror = { version = "2", default-features = false }
