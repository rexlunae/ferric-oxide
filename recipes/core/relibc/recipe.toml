[source]
# relibc lives in this repository at crates/relibc/, a git subtree of
# gitlab.redox-os.org/redox-os/relibc (imported with its history; not synced).
# Its openlibm and dlmalloc-rs submodules are listed in the root .gitmodules.
path = "crates/relibc"

[build]
template = "custom"
compiler = "no-lto"
script = """
# rustup workaround https://github.com/rust-lang/rustup/issues/988
if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
if command -v rustup >/dev/null 2>&1; then
    pushd ${COOKBOOK_SOURCE}
    ${RUSTUP:-rustup} install
    popd
fi
fi

# relibc uses the shared crates beside it in crates/ as path dependencies
# (redox-rt uses ../../hwrand). The cookbook builds a copy of crates/relibc/
# in this recipe's source/, so give that copy the same neighbours.
for dep in "${COOKBOOK_ROOT}"/crates/*/
do
    name="$(basename "${dep}")"
    [ "${name}" = relibc ] || ln -sfn "${dep%/}" "${COOKBOOK_SOURCE}/../${name}"
done

# Ferric Oxide: Cargo features from ferric.toml (make menuconfig), such as
# aslr. Unset without ferric.toml, which keeps upstream's build. The relibc
# Makefile passes FEATURE_MATH to cargo when it builds the library; it holds
# math_libm only with USE_RUST_LIBM (otherwise openlibm provides libm), so
# keep that choice when overriding it.
RELIBC_MAKE_ARGS=()
if [ "${FERRIC_LLVM_TOOLCHAIN}" = 1 ]
then
    # Command-line Make assignments override the inherited GCC defaults.
    RELIBC_MAKE_ARGS+=("CC=${GNU_TARGET}-clang" "LD=ld.lld" "AR=llvm-ar"
        "NM=llvm-nm" "OBJCOPY=llvm-objcopy")
fi
if [ -n "${FERRIC_RELIBC_FEATURES}" ]
then
    relibc_features="${FERRIC_RELIBC_FEATURES// /,}"
    if [ -n "${USE_RUST_LIBM}" ]
    then
        relibc_features="math_libm,${relibc_features}"
    fi
    RELIBC_MAKE_ARGS+=("FEATURE_MATH=--features ${relibc_features}")
fi
# The Makefile only tracks sources, so rebuild when the features change.
ferric_stamp="${FERRIC_RELIBC_FEATURES-upstream}"
if [ "$(cat "${COOKBOOK_BUILD}/ferric.stamp" 2>/dev/null)" != "${ferric_stamp}" ]
then
    touch "${COOKBOOK_SOURCE}/Cargo.toml"
fi

export CARGO=${CARGO:-env -u CARGO cargo}
"${COOKBOOK_MAKE}" \
    -C "${COOKBOOK_SOURCE}" \
    -j"${COOKBOOK_MAKE_JOBS}" \
    DESTDIR="${COOKBOOK_STAGE}/usr" \
    "${RELIBC_MAKE_ARGS[@]}" \
    install
printf '%s' "${ferric_stamp}" > "${COOKBOOK_BUILD}/ferric.stamp"
"""
