[source]
# base lives in this repository at userspace/base/, a git subtree of
# gitlab.redox-os.org/redox-os/base (imported with its history; not synced).
path = "userspace/base"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
# Ferric Oxide: shared crates are path dependencies at ../../crates from
# userspace/base/ (pcid and bootstrap use crates/iommu). The cookbook builds a
# copy of userspace/base/ in this recipe's source/, so give that copy the same
# relative path to them.
ln -sfn "${COOKBOOK_ROOT}/crates" "${COOKBOOK_SOURCE}/../../crates"
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" STRIP="${GNU_TARGET}-strip" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
