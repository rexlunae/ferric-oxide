# Ferric Oxide: ext4d, the read-only ext4 file system daemon (features.toml fs.ext4, off by
# default). It lives in this repository at userspace/ext4d/; as a path source (relative to
# the repository root), edits there rebuild it.
[source]
path = "userspace/ext4d"

[build]
template = "custom"
script = """
# The journal replay (features.toml fs.ext4_journal_replay) is crates/jbd2, and the futimens
# sentinels are crates/abi: path dependencies at ../../crates from userspace/ext4d/. The cookbook builds a copy of
# userspace/ext4d/ in this recipe's source/, so give that copy the same relative path to it.
ln -sfn "${COOKBOOK_ROOT}/crates" "${COOKBOOK_SOURCE}/../../crates"
# fs.ext4_journal_replay adds journal-replay to FERRIC_EXT4D_FEATURES (and fs.ext4_write adds
# write); without them (and without a ferric.toml) ext4d is the read-only daemon that never
# writes.
cookbook_cargo ${FERRIC_EXT4D_FEATURES:+--features "${FERRIC_EXT4D_FEATURES}"}
"""
