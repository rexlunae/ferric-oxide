[source]
# The kernel lives in this repository at crates/kernel/, a git subtree of
# gitlab.redox-os.org/redox-os/kernel (imported with its history; not synced).
# The path is relative to the repository root, where the cookbook runs.
path = "crates/kernel"

[build]
template = "custom"
script = """
# Ferric Oxide: the build is shared with recipes/core/kernel-trace.
source "${COOKBOOK_ROOT}/recipes/core/kernel/build-kernel.sh"
# Kernel features from ferric.toml (make menuconfig). Unset without ferric.toml,
# which keeps the upstream defaults.
if [ -n "${FERRIC_KERNEL_FEATURES+set}" ]
then
    ferric_kernel_build kernel "${FERRIC_KERNEL_FEATURES}"
else
    ferric_kernel_build kernel
fi
"""
