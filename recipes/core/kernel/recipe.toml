[source]
# The kernel lives in this repository at crates/kernel/, a git subtree of
# gitlab.redox-os.org/redox-os/kernel (see .github/workflows/subtree-sync.yml).
# The path is relative to the repository root, where the cookbook runs.
path = "crates/kernel"

[build]
template = "custom"
script = """
# The kernel uses the shared crates beside it in crates/ as ../<name> path
# dependencies. The cookbook builds a copy of crates/kernel/ in this recipe's
# source/, so give that copy the same neighbours.
for dep in "${COOKBOOK_ROOT}"/crates/*/
do
    name="$(basename "${dep}")"
    [ "${name}" = kernel ] || ln -sfn "${dep%/}" "${COOKBOOK_SOURCE}/../${name}"
done
cd "${COOKBOOK_SOURCE}"
KERNEL_MAKE_ARGS=()
# Ferric Oxide: kernel features and CPU feature policy from ferric.toml
# (make menuconfig). Unset without ferric.toml, which keeps upstream defaults.
if [ -n "${FERRIC_KERNEL_FEATURES+set}" ]
then
    # The kernel Makefile splices this into --features=..., so the flag rides along.
    KERNEL_MAKE_ARGS+=("KERNEL_CARGO_FEATURES=${FERRIC_KERNEL_FEATURES} --no-default-features")
fi
if [ -n "${FERRIC_KERNEL_CONFIG}" ] && ! cmp -s "${FERRIC_KERNEL_CONFIG}" config.toml
then
    cp -v "${FERRIC_KERNEL_CONFIG}" config.toml
fi
# The kernel Makefile only tracks *.rs, so relink when features or config change.
ferric_stamp="$(printf '%s\\n' "${FERRIC_KERNEL_FEATURES-upstream}"; cat config.toml 2>/dev/null || true)"
if [ "$(cat "${COOKBOOK_BUILD}/ferric.stamp" 2>/dev/null)" != "${ferric_stamp}" ]
then
    rm -f "${COOKBOOK_BUILD}/kernel.all"
fi
make install BUILD="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}" "${KERNEL_MAKE_ARGS[@]}"
printf '%s' "${ferric_stamp}" > "${COOKBOOK_BUILD}/ferric.stamp"
"""
