[source]
# RedoxFS lives in this repository at userspace/redoxfs/, a git subtree of
# gitlab.redox-os.org/redox-os/redoxfs (see .github/workflows/subtree-sync.yml).
path = "userspace/redoxfs"

[build]
template = "custom"
script = """
# Ferric Oxide: ferric-pcache is a path dependency at ../../crates from
# userspace/redoxfs/. The cookbook builds a copy of userspace/redoxfs/ in this
# recipe's source/, so give that copy the same relative path to it (as base does).
ln -sfn "${COOKBOOK_ROOT}/crates" "${COOKBOOK_SOURCE}/../../crates"
# Must be statically linked
cookbook_cargo
"""
