[source]
# The bootloader lives in this repository at bootloader/, a git subtree of
# gitlab.redox-os.org/redox-os/bootloader (see .github/workflows/subtree-sync.yml).
path = "bootloader"

[build]
template = "custom"
script = """
OUTDIR="${COOKBOOK_BUILD}"
mkdir -pv "${COOKBOOK_STAGE}/usr/lib/boot"

# Ferric Oxide: shared crates are path dependencies at ../crates from
# bootloader/; give the cookbook's copy in source/ the same neighbour.
ln -sfn "${COOKBOOK_ROOT}/crates" "${COOKBOOK_SOURCE}/../crates"
# Cargo features from ferric.toml (kaslr for kernel image KASLR). The
# Makefile only tracks sources, so rebuild when they change.
if [ "$(cat "${OUTDIR}/ferric.stamp" 2>/dev/null)" != "${FERRIC_BOOTLOADER_FEATURES}" ]
then
    rm -f "${OUTDIR}"/*.efi "${OUTDIR}"/*.bin
fi
printf '%s' "${FERRIC_BOOTLOADER_FEATURES}" > "${OUTDIR}/ferric.stamp"

# Features apply to UEFI builds only: Ferric Oxide adds no BIOS boot paths, so
# the BIOS bootloader keeps its upstream feature set.
function bootloader {
    export TARGET="$1"
    src="$2"
    dst="$3"
    features=""
    case "${TARGET}" in
        *-unknown-uefi) features="${FERRIC_BOOTLOADER_FEATURES}" ;;
    esac
    "${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f "${COOKBOOK_SOURCE}/Makefile" -C "${OUTDIR}" \\
        BOOTLOADER_FEATURES="${features}" "${OUTDIR}/${src}"
    cp -v "${OUTDIR}/${src}" "${COOKBOOK_STAGE}/usr/lib/boot/${dst}"
}

ARCH="$(echo "${TARGET}" | cut -d - -f1)"

# Build BIOS bootloader for supported architectures
if [ "${ARCH}" == "i586" -o "${ARCH}" == "i686" -o "${ARCH}" == "x86_64" ]
then
    bootloader "x86-unknown-none" bootloader.bin bootloader.bios
    bootloader "x86-unknown-none" bootloader-live.bin bootloader-live.bios
fi

# Build UEFI bootloader for supported architectures
if [ "${ARCH}" == "aarch64" -o "${ARCH}" == "x86_64" -o "${ARCH}" == "riscv64gc" ]
then
    bootloader "${ARCH}-unknown-uefi" bootloader.efi bootloader.efi
    bootloader "${ARCH}-unknown-uefi" bootloader-live.efi bootloader-live.efi
fi
"""
