[source]
# The host workspace imports only the installer CLI/library. Keep the GUI
# on the complete upstream tree, including its parent library dependency.
git = "https://gitlab.redox-os.org/redox-os/installer.git"
rev = "b5a11310e1ac915494efea6d18e242966da74f3f"

[build]
template = "custom"
script = """
DYNAMIC_INIT
COOKBOOK_CARGO_PATH="gui" cookbook_cargo

mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui/apps"
cp -v "${COOKBOOK_RECIPE}/manifest" "${COOKBOOK_STAGE}/usr/share/ui/apps/redox-installer-gui"
"""
