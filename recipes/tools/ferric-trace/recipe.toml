# Ferric Oxide: the ferric-trace tool (tools/ferric-trace/) for the target, where
# `ferric-trace capture <dir>` saves a kernel trace capture (kernel.trace). The
# same tool converts captures on the host.
#
# The cookbook decides whether to rebuild from this one path source, so an edit
# to crates/trace alone (the event catalog and ABI the tool links) does not
# rebuild it. After one, run `make cr.ferric-trace`. CI images always build it
# fresh. The test recipes that use crates/trace have the same limit.
[source]
path = "tools/ferric-trace"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
# The crate is a member of the repository's host workspace, whose shared
# dependency versions and lockfile it uses, so it is built in place rather than
# from the cookbook's copy in source/ (which is outside the workspace). The
# path source above still makes edits to tools/ferric-trace/ rebuild it.
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
COOKBOOK_SOURCE="${COOKBOOK_ROOT}/tools/ferric-trace" cookbook_cargo \
    --bin ferric-trace --target-dir "${COOKBOOK_BUILD}/target"
"""
