# Ferric Oxide: checks that two runs of the same program get different stack,
# heap and mmap addresses (ASLR). Source lives in files/; as a path source
# (relative to the repository root) edits there rebuild it.
[source]
path = "recipes/tests/ferric-aslr-test/files"

[build]
template = "custom"
# Exercise the interpreter exec path, which installs mmap-min-addr. A static
# executable bypasses that path and cannot detect the #300 floor regression.
# The image and this link sysroot use the in-tree relibc.
dev-dependencies = ["relibc"]
script = """
DYNAMIC_INIT
cookbook_cargo
"""
