# Ferric Oxide: a test driver for DMA domains (kernel.iommu = "auto" or
# "enforce"). pcid-spawner starts it for the host bridge (PCI class 06h,
# subclass 00h, which never initiates DMA); it asks pcid for a DMA domain over
# its channel, receives the domain's descriptor and binds it. The kernel logs
# the attach and the bind, which the vtd boot CI job checks. Only for test
# images: it claims the host bridge. Source lives in files/; as a path source
# (relative to the repository root) edits there rebuild it.
[source]
path = "recipes/tests/ferric-iommu-test/files"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
cookbook_cargo
mkdir -p "${COOKBOOK_STAGE}/usr/lib/pcid.d"
cp -v "${COOKBOOK_SOURCE}/pcid.toml" "${COOKBOOK_STAGE}/usr/lib/pcid.d/ferric-iommu-test.toml"
"""
