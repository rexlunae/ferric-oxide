[package]
name = "ferric-scheme-self-test"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Regression test: a process opens a scheme it created on the same thread"

# Builds on its own, outside any workspace above it.
[workspace]

[dependencies]
ferric-irq = { path = "../../../../crates/irq" }

[target.'cfg(target_os = "redox")'.dependencies]
libredox = "0.1.25"
redox-scheme = "0.11.4"
redox_syscall = "0.9.4"

[profile.release]
debug = false
