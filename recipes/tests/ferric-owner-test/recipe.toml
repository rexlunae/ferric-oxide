# Ferric Oxide: checks that a ramfs file's owner, group and mode (#246), and its times and
# size (#375), change only under the POSIX rules. Uses the logging ramfs, which every image
# runs. Only for test images.
[source]
path = "recipes/tests/ferric-owner-test/files"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
cookbook_cargo
"""
