[package]
name = "ferric-regbuf-test"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Registered buffer and zero-copy grant test for Ferric Oxide"

# Builds on its own, outside any workspace above it.
[workspace]

[dependencies]
ferric-regbuf = { path = "../../../../crates/regbuf" }

[target.'cfg(target_os = "redox")'.dependencies]
libc = "0.2"
libredox = "0.1.25"
redox-scheme = "0.11.4"
redox_syscall = "0.9.4"

[profile.release]
debug = false
