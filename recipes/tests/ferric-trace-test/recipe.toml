# Ferric Oxide: the on-target test for kernel tracing (kernel.trace). It checks
# sched.switch was turned on at boot, turns the syscall tracepoints on through
# the kernel.trace scheme, makes known system calls, turns them off, drains
# every CPU's ring, decodes the records with the shared ferric-trace catalog and
# checks the events, then checks page fault and interrupt records of faults and
# disk interrupts it causes. It prints FERRIC_TEST_SKIP when the kernel has no
# kernel.trace scheme. Only for test images. Source lives in files/; as a path
# source (relative to the repository root) edits there rebuild it.
[source]
path = "recipes/tests/ferric-trace-test/files"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
# The trace crate is a path dependency at ../../../../crates/trace from files/.
# The cookbook builds a copy of files/ in this recipe's source/, at the same
# depth, so the relative path holds there too.
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
cookbook_cargo
"""
