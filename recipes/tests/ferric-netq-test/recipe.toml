# Ferric Oxide: the on-target test of kernel-bypass queue sockets in copy mode
# (drivers.net_bypass, with kernel.regbuf). It registers a UMEM and a ring region, attaches
# grants of them to a queue socket on the network driver, binds it, steers ARP and then ICMP
# from the gateway to it, answers both through its own TX ring, checks the refusals and the
# counters, closes the socket with traffic in flight, and checks netstack works before, during
# and after. It prints FERRIC_TEST_SKIP when there is no network driver, no kernel.regbuf
# scheme or no queue sockets in the driver. Only for test images. Source lives in files/; as a
# path source (relative to the repository root) edits there rebuild it.
[source]
path = "recipes/tests/ferric-netq-test/files"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
# The ABI crates are path dependencies at ../../../../crates/ from files/. The cookbook
# builds a copy of files/ in this recipe's source/, at the same depth, so the relative
# paths hold there too.
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
cookbook_cargo
"""
