[package]
name = "ferric-ring-test"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Submission/completion ring test for Ferric Oxide"

# Builds on its own, outside any workspace above it.
[workspace]

[dependencies]
ferric-ring = { path = "../../../../crates/ring" }
# The fio-style latency histogram the `--scale` waiting-ring baseline reports its wake
# latencies with, as the disk benchmark jobs do.
ferric-iobench = { path = "../../../../crates/iobench" }

[target.'cfg(target_os = "redox")'.dependencies]
libc = "0.2"
libredox = "0.1.25"
redox_syscall = "0.9.5"

[profile.release]
debug = false
