# Ferric Oxide: the on-target test for submission/completion rings (kernel.rings).
# It sets up rings on the kernel.ring scheme, runs requests through them on
# RedoxFS, the kernel's pipe scheme and the null scheme (zerod), chains them
# across those schemes in one Enter, checks the refusals and the back-pressure
# rules, and times ring submission against plain system calls. It prints
# FERRIC_TEST_SKIP when the kernel has no kernel.ring scheme. Only for test
# images. Source lives in files/; as a path source (relative to the repository
# root) edits there rebuild it.
[source]
path = "recipes/tests/ferric-ring-test/files"

[build]
template = "custom"
dev-dependencies = ["relibc"]
script = """
# The ring crate is a path dependency at ../../../../crates/ring from files/.
# The cookbook builds a copy of files/ in this recipe's source/, at the same
# depth, so the relative path holds there too.
export RUSTFLAGS="${RUSTFLAGS:+${RUSTFLAGS} }-L ${COOKBOOK_SYSROOT}/lib"
cookbook_cargo
"""
