# Ferric Oxide CI smoke test
#
# Boots the minimal system, prints a few facts about the machine on the serial
# console between two markers, and shuts down. CI builds this image with
# REPO_BINARY=1, so every package comes prebuilt from the Redox package server
# except the ones marked "source" below, which are built from this repository.

include = ["minimal.toml"]

[general]
filesystem_size = 256

[packages]
kernel = "source"
relibc = "source"
bootloader = "source"
ferric-xstate-test = "source"

[[files]]
path = "/usr/lib/init.d/30_console"
data = """
requires_weak 10_net.target
ion /usr/lib/ferric-smoke.ion
"""

[[files]]
path = "/usr/lib/ferric-smoke.ion"
data = """
#!/usr/bin/env ion
echo FERRIC_SMOKE_BEGIN
uname -a
cat /scheme/sys/uname
cat /scheme/sys/cpu
ls /scheme
ferric-xstate-test || echo FERRIC_TEST_FAIL xstate exited with an error
echo FERRIC_SMOKE_OK
shutdown
"""
