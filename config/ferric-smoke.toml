# Ferric Oxide CI smoke test
#
# Boots the minimal system, prints a few facts about the machine on the serial
# console between two markers, and shuts down. CI builds this image with
# REPO_BINARY=1, so every package comes prebuilt from the Redox package server
# except the ones marked "source" below, which are built from this repository.

include = ["minimal.toml"]

[general]
filesystem_size = 256

[packages]
kernel = "source"
relibc = "source"
bootloader = "source"
redoxfs = "source"
base = "source"
ferric-xstate-test = "source"
ferric-aslr-test = "source"
ferric-guard-test = "source"
ferric-tlb-test = "source"
ferric-borrow-test = "source"
ferric-futex-test = "source"
# Process exit with a thread still busy (#200).
ferric-exit-test = "source"
# Reads /scheme/sys/proc (kernel.sys_proc, which CI turns on); skips otherwise.
ferric-proc-test = "source"
ferric-syscall-fuzz = "source"
# pcid-spawner starts it for QEMU's edu device (boot-smoke.sh adds one): it gets a
# DMA domain from pcid and has the device DMA through it.
ferric-iommu-test = "source"
# Registers a buffer and grants it to a test scheme (kernel.regbuf, which CI turns on).
ferric-regbuf-test = "source"
# Needs a kernel built with kernel.trace (CI turns it on); skips otherwise.
ferric-trace-test = "source"
# The trace tool: the smoke script saves a capture with it and reads it back.
ferric-trace = "source"
# Times file I/O and system calls with tracing off and on, for the trace-overhead CI job.
ferric-trace-bench = "source"
# Needs a kernel built with kernel.rings (CI turns it on); skips otherwise.
ferric-ring-test = "source"
# Needs a kernel built with kernel.page_cache (CI turns it on); skips otherwise.
ferric-pcache-test = "source"
# Mounts an ext4 image with ext4d (fs.ext4, which CI turns on); skips without it.
ferric-ext4-test = "source"
# ext4d, as features.toml fs.ext4 = true adds it. CI's ferric.toml turns fs.ext4 on, but this
# image is built by name (CONFIG_NAME=ferric-smoke), so ferric-config's generated package
# list does not apply to it and the package has to be named here, as fox is below.
ext4d = "source"
# Mounts a FAT32 image with fatd (fs.fat, which CI turns on); skips without it.
ferric-fat-test = "source"
# fatd, as features.toml fs.fat = true adds it; named here for the same reason as ext4d above.
fatd = "source"
# Serves the LUKS and LVM images of crates/blocklayer with ferric-blockd (fs.luks and fs.lvm,
# which CI turns on) and reads them back; skips without it.
ferric-blocklayer-test = "source"
# ferric-blockd, as features.toml fs.luks or fs.lvm adds it; named here for the same reason as
# ext4d above. Built by name, it has both layers; CI passes FERRIC_BLOCKD_FEATURES from its
# ferric.toml, whose fs.unlock_at_boot adds ferric-unlock and its 05_ferric-unlock.service, so
# the test's /etc/ferric/crypttab is unlocked at boot.
ferric-blockd = "source"
# Reads and writes the NVMe disk through a registered-buffer grant (drivers.grant_dma,
# which CI turns on) and times it against ordinary reads.
ferric-blkgrant-test = "source"
# Opens a scheme from the thread that created it (a kernel livelock regression test).
ferric-scheme-self-test = "source"
# The Phase 2 disk benchmark: fio-style read jobs on the NVMe disk with each of nvmed's
# queue policies (ferric_iobench), and the same-boot A/B of per-CPU queues against one.
ferric-iobench = "source"
# Opens a queue socket on e1000d and exchanges ARP and ICMP with QEMU's gateway through its
# own rings, in copy mode (drivers.net_bypass and kernel.regbuf, which CI turns on).
ferric-netq-test = "source"
# fox replaces pkg, as features.toml packages.manager = "fox" does: the
# installer records the image's packages in fox's database, and the script
# below checks them against their signatures.
fox = "source"
pkgutils = "ignore"

[[files]]
path = "/usr/lib/init.d/30_console"
data = """
requires_weak 10_net.target
requires_weak 05_fox-adopt.service
ion /usr/lib/ferric-smoke.ion
"""

[[files]]
path = "/usr/lib/ferric-smoke.ion"
data = """
#!/usr/bin/env ion
echo FERRIC_SMOKE_BEGIN
uname -a
cat /scheme/sys/uname
cat /scheme/sys/cpu
ls /scheme
# Two HDA controllers (boot-smoke.sh adds them): the first driver that registers
# takes audiohw and the next must use audiohw.<pci-address> instead of failing.
# Wait for the second scheme so a slow probe does not race the check.
let audio_tries = 0
while test $audio_tries -lt 30
    if contains "$(ls /scheme)" "audiohw.pci-"
        break
    end
    sleep 1
    let audio_tries += 1
end
if contains "$(ls /scheme)" "audiohw.pci-"
    echo FERRIC_TEST_PASS audio-second-controller
else
    echo FERRIC_TEST_FAIL audio-second-controller: no second HDA scheme
end
# The crash dump (kernel.trace_crash): skips unless there is one, or, on the crash image's
# first boot, panics the kernel on purpose; the next boot checks the dump it left.
ferric-trace-test crash || echo FERRIC_TEST_FAIL trace-crash exited with an error
ferric-xstate-test || echo FERRIC_TEST_FAIL xstate exited with an error
ferric-aslr-test || echo FERRIC_TEST_FAIL aslr exited with an error
ferric-guard-test || echo FERRIC_TEST_FAIL guard exited with an error
ferric-tlb-test || echo FERRIC_TEST_FAIL tlb exited with an error
ferric-borrow-test || echo FERRIC_TEST_FAIL borrow exited with an error
ferric-regbuf-test || echo FERRIC_TEST_FAIL regbuf exited with an error
ferric-blkgrant-test || echo FERRIC_TEST_FAIL nvme-grant exited with an error
ferric-netq-test || echo FERRIC_TEST_FAIL netq exited with an error
ferric-iobench || echo FERRIC_TEST_FAIL iobench exited with an error
ferric-futex-test || echo FERRIC_TEST_FAIL futex exited with an error
ferric-exit-test || echo FERRIC_TEST_FAIL exit-busy-thread exited with an error
ferric-proc-test || echo FERRIC_TEST_FAIL proc exited with an error
ferric-scheme-self-test || echo FERRIC_TEST_FAIL scheme-self-open exited with an error
ferric-trace-test || echo FERRIC_TEST_FAIL trace exited with an error
# Saves a capture through the ring mappings and reads it back, on a kernel with kernel.trace. The /scheme listing says
# whether it has one, as in ferric-trace-test; the trace-overhead baseline image has none.
if contains "$(ls /scheme)" kernel.trace
    ferric-trace capture --via map /tmp/ferric-trace-capture && ferric-trace text /tmp/ferric-trace-capture > /dev/null && echo FERRIC_TEST_PASS trace-capture || echo FERRIC_TEST_FAIL trace-capture
else
    echo FERRIC_TEST_SKIP trace-capture: no kernel.trace scheme
end
ferric-trace-bench || echo FERRIC_TEST_FAIL trace-bench exited with an error
# A sampling profile of a short fuzz run and its flame graph, on a kernel with
# kernel.profiling (profile-image.yml); ctl-profiling can be read only there.
if cat /scheme/debug/ctl-profiling
    ferric-trace profile /tmp/ferric-profile -- ferric-syscall-fuzz --seed 2 --seconds 3 && ferric-trace flamegraph /tmp/ferric-profile --folded /tmp/ferric-profile.folded -o /tmp/ferric-profile.svg && test -s /tmp/ferric-profile.folded && echo FERRIC_TEST_PASS profile || echo FERRIC_TEST_FAIL profile
    cat /tmp/ferric-profile/images
    head -n 20 /tmp/ferric-profile.folded
else
    echo FERRIC_TEST_SKIP profile: no kernel.profiling
end
ferric-ring-test || echo FERRIC_TEST_FAIL ring exited with an error
ferric-pcache-test || echo FERRIC_TEST_FAIL pcache exited with an error
ferric-ext4-test || echo FERRIC_TEST_FAIL ext4 exited with an error
ferric-fat-test || echo FERRIC_TEST_FAIL fat exited with an error
ferric-blocklayer-test || echo FERRIC_TEST_FAIL blocklayer exited with an error
# A short, fixed-seed fuzz run; the nightly ferric-fuzz config runs a long one.
ferric-syscall-fuzz --seed 1 --seconds 15 || echo FERRIC_TEST_FAIL fuzz exited with an error
# Every package the installer put in the image, re-checked against its signed head.
fox list
fox verify --installed && echo FERRIC_TEST_PASS fox-verify || echo FERRIC_TEST_FAIL fox verify --installed failed
echo FERRIC_SMOKE_OK
shutdown
"""
