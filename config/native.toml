# Native development image: rebuild the fork's OS components with Cargo,
# and build application packages from their upstream sources.
include = ["minimal.toml"]

[general]
filesystem_size = 512

[packages]
kernel = "source"
bootloader = "source"
relibc = "source"
base = "source"
redoxfs = "source"

[[files]]
path = "/etc/hostname"
data = "ferric-oxide"
postinstall = true

[[files]]
path = "/usr/lib/os-release"
postinstall = true
data = """
PRETTY_NAME="Ferric Oxide"
NAME="Ferric Oxide"
ID="ferric-oxide"
HOME_URL="https://github.com/rexlunae/ferric-oxide"
"""
