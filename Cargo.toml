# Ferric Oxide host workspace: the build tools that run on the developer's
# machine. The OS itself (kernel, bootloader, relibc, user space) builds for
# other targets and lives in separate workspaces, built through the cookbook.
[workspace]
resolver = "3"
# Keep default builds on the build-system tools and shared host-testable crates.
default-members = ["crates/amdvi", "crates/cet", "crates/elfreloc", "crates/fox-core", "crates/fox-sbom", "crates/fox-store", "crates/iommu", "crates/nospec", "crates/regbuf", "crates/trace", "crates/vtd", "tools/cookbook", "tools/ferric-config", "tools/fox"]
members = [
    "crates/amdvi",
    "crates/cet",
    "crates/elfreloc",
    "crates/fox-core",
    "crates/fox-sbom",
    "crates/fox-store",
    "crates/hwrand",
    "crates/iommu",
    "crates/nospec",
    "crates/regbuf",
    "crates/trace",
    "crates/vtd",
    "tools/cookbook",
    "tools/ferric-config",
    "tools/fox",
    "tools/installer",
    "tools/redoxer",
]
# Recipe sources are checked out under recipes/ and build as their own
# packages; build output and the toolchain prefix are not crates either.
# The bootloader and user space build for other targets but have no
# [workspace] table upstream, so they are excluded here to build standalone.
exclude = [
    "crates/bootloader",
    "userspace",
    "tools/redoxer/example",
    "recipes",
    "build",
    "prefix",
]

# Versions shared by more than one host tool.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"
redox_installer = { path = "tools/installer", default-features = false }
redoxer = { path = "tools/redoxer", default-features = false }
# The fox crates: the pkgar archive format is reused from upstream Redox, from
# the crates.io releases (the installer uses the same ones).
blake3 = { version = "1.8", default-features = false }
pkgar = "0.2.4"
pkgar-core = "0.2.4"
pkgar-keys = "0.2.4"
thiserror = { version = "2", default-features = false }
toml = { version = "1", default-features = false }

[profile.release.package.ferric-config]
opt-level = 2
