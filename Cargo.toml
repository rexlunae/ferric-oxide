# Ferric Oxide host workspace: the build tools that run on the developer's
# machine. The OS itself (kernel, bootloader, relibc, user space) builds for
# other targets and lives in separate workspaces, built through the cookbook.
[workspace]
resolver = "3"
members = [
    "tools/cookbook",
    "tools/ferric-config",
]
# Recipe sources are checked out under recipes/ and build as their own
# packages; build output and the toolchain prefix are not crates either.
exclude = [
    "recipes",
    "build",
    "prefix",
]

[profile.release.package.ferric-config]
opt-level = 2
