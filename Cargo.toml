# Ferric Oxide host workspace: the build tools that run on the developer's
# machine. The OS itself (kernel, bootloader, relibc, user space) builds for
# other targets and lives in separate workspaces, built through the cookbook.
[workspace]
resolver = "3"
# Keep default builds on the build-system tools and shared host-testable crates.
default-members = ["crates/amdvi", "crates/blkgrant", "crates/blkqueue", "crates/boot-time", "crates/cet", "crates/codecache", "crates/devicetree", "crates/elfreloc", "crates/fox-build", "crates/fox-core", "crates/fox-git", "crates/fox-index", "crates/fox-sbom", "crates/fox-store", "crates/iobench", "crates/iommu", "crates/irq", "crates/luks", "crates/lvm", "crates/netq", "crates/nospec", "crates/pcache", "crates/procinfo", "crates/regbuf", "crates/ring", "crates/rtl8125", "crates/svm", "crates/trace", "crates/trace-map", "crates/vm", "crates/vmx", "crates/vtd", "crates/wasm-abi", "tools/cargo-fox", "tools/cookbook", "tools/ferric-build", "tools/ferric-config", "tools/ferric-trace", "tools/fox", "tools/fox-registry"]
members = [
    "crates/amdvi",
    "crates/blkgrant",
    "crates/blkqueue",
    "crates/boot-time",
    "crates/cet",
    "crates/codecache",
    "crates/devicetree",
    "crates/elfreloc",
    "crates/fox-build",
    "crates/fox-core",
    "crates/fox-git",
    "crates/fox-index",
    "crates/fox-sbom",
    "crates/fox-store",
    "crates/hwrand",
    "crates/iobench",
    "crates/iommu",
    "crates/irq",
    "crates/luks",
    "crates/lvm",
    "crates/netq",
    "crates/nospec",
    "crates/pcache",
    "crates/procinfo",
    "crates/regbuf",
    "crates/ring",
    "crates/rtl8125",
    "crates/svm",
    "crates/trace",
    "crates/trace-map",
    "crates/vm",
    "crates/vmx",
    "crates/vtd",
    "crates/wasm-abi",
    "tools/cargo-fox",
    "tools/cookbook",
    "tools/ferric-build",
    "tools/ferric-config",
    "tools/ferric-trace",
    "tools/fox",
    "tools/fox-registry",
    "tools/installer",
    "tools/redoxer",
]
# Recipe sources are checked out under recipes/ and build as their own
# packages; build output and the toolchain prefix are not crates either.
# The bootloader and user space build for other targets but have no
# [workspace] table upstream, so they are excluded here to build standalone.
exclude = [
    "crates/bootloader",
    "userspace",
    "tools/redoxer/example",
    "recipes",
    "build",
    "prefix",
]

# Versions shared by more than one host tool.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"
redox_installer = { path = "tools/installer", default-features = false }
redoxer = { path = "tools/redoxer", default-features = false }
# The fox crates: the pkgar archive format is reused from upstream Redox, from
# the crates.io releases (the installer uses the same ones).
blake3 = { version = "1.8", default-features = false }
pkgar = "0.2.4"
pkgar-core = "0.2.4"
pkgar-keys = "0.2.4"
thiserror = { version = "2", default-features = false }
# Git access for fox-git: revision parsing and object reading, without the
# default network, worktree and diff machinery.
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }
toml = { version = "1", default-features = false }
# Release-tag signatures for fox: OpenSSH Ed25519 keys and SSHSIG.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
semver = "1.0.27"
# RFC 3339 times in build records and registry metadata. The baseline is no_std
# for ferric-boot-time (which the kernel and bootloader also build); host crates
# that need the clock or formatting add the feature themselves.
time = { version = "0.3.44", default-features = false }

[profile.release.package.ferric-config]
opt-level = 2
