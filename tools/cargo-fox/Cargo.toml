[package]
name = "cargo-fox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "cargo fox: hermetic builds, packages and attestations for fox package authors"
publish = false

[dependencies]
blake3 = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive"] }
fox-build = { path = "../../crates/fox-build" }
fox-core = { path = "../../crates/fox-core", features = ["std"] }
fox-git = { path = "../../crates/fox-git" }
pkgar-keys = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
fox-core = { path = "../../crates/fox-core", features = ["test-fixtures"] }
tempfile.workspace = true
