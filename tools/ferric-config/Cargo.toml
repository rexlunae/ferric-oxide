[package]
name = "ferric-config"
version = "0.1.0"
edition = "2024"
description = "menuconfig-style feature configuration for the Ferric Oxide build"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
redox_installer.workspace = true
tempfile.workspace = true
