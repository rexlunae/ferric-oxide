[package]
name = "redox_cookbook"
version = "0.1.0"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
edition = "2024"
default-run = "repo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cookbook_redoxer"
path = "src/bin/cookbook_redoxer.rs"

[[bin]]
name = "repo"
path = "src/bin/repo/main.rs"

[[bin]]
name = "repo_builder"
path = "src/bin/repo_builder.rs"

[[bin]]
name = "repo_editor"
path = "src/bin/repo_editor/main.rs"

[lib]
name = "cookbook"
path = "src/lib.rs"
doctest = false

[features]
#TODO: Actually make without tui feature works
default = ["tui"]
tui = ["ratatui", "ansi-to-tui", "strip-ansi-escapes"]

[dependencies]
blake3 = "1"
# Ferric Oxide: signed package manifests (src/cook/fox_manifest.rs).
fox-core = { path = "../../crates/fox-core" }
globset = "0.4"
libc = "0.2"
ignore = "0.4"
object = { version = "0.38", features = ["build_core"] }
pkgar = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
pkgar-core = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
pkgar-keys = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
redox-pkg = { git = "https://gitlab.redox-os.org/redox-os/pkgutils.git", default-features = false }
redox_installer.workspace = true
redoxer = { workspace = true, default-features = false }
regex = "1.11"
serde.workspace = true
termion = "4"
toml = "0.8"
walkdir = "2.3.1"
ansi-to-tui = { version = "8", optional = true }
strip-ansi-escapes = { version = "0.2.1", optional = true }
serde_json.workspace = true

[dependencies.ratatui]
version = "0.30"
default-features = false
features = ["termion"]
optional = true

[dev-dependencies]
tempfile.workspace = true
