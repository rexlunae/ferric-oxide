[package]
name = "fox-registry"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maintainer and CI tool for fox package registries"
publish = false

[dependencies]
blake3 = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive"] }
fox-build = { path = "../../crates/fox-build" }
fox-core = { path = "../../crates/fox-core", features = ["std"] }
fox-git = { path = "../../crates/fox-git" }
fox-index = { path = "../../crates/fox-index" }
pkgar-keys.workspace = true
semver.workspace = true
serde.workspace = true
ssh-key.workspace = true
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "formatting", "parsing"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }

[dev-dependencies]
fox-git = { path = "../../crates/fox-git" }
tempfile.workspace = true
