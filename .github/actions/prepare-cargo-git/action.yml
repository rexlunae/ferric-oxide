name: Prepare Cargo Git dependencies
description: Fetch pinned upstream Git dependencies through the Redox GitHub mirrors.
runs:
  using: composite
  steps:
    - name: Configure Cargo Git fetches
      shell: bash
      run: |
        git config --global url.https://github.com/redox-os/.insteadOf https://gitlab.redox-os.org/redox-os/
        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
