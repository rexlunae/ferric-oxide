name: Prepare Cargo Git dependencies
description: Cache pinned Git dependencies.
runs:
  using: composite
  steps:
    - name: Configure Cargo Git fetches
      shell: bash
      run: |
        # Every Git dependency points at a Ferric mirror, so no URL rewriting is
        # needed (or wanted: nothing may be fetched from Redox's servers).
        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
        echo 'CARGO_NET_RETRY=10' >> "$GITHUB_ENV"
    # Share the cache key introduced by #98; keep the original immutable revisions.
    - name: Cache Cargo Git dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/registry/cache
        key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-git-
