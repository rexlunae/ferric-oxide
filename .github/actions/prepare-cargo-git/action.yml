name: Prepare Cargo Git dependencies
description: Cache pinned Git dependencies and use verified upstream mirrors.
runs:
  using: composite
  steps:
    - name: Configure Cargo Git fetches
      shell: bash
      run: |
        # These mirrors contain the locked revisions. Other upstream mirrors lag or
        # do not exist, so a namespace-wide rewrite would break otherwise valid builds.
        # Retire the broad rewrite if submodule preparation needed its fallback.
        git config --global --fixed-value --unset-all url.https://github.com/redox-os/.insteadOf https://gitlab.redox-os.org/redox-os/ || test "$?" -eq 5
        git config --global url.https://github.com/redox-os/pkgar.git.insteadOf https://gitlab.redox-os.org/redox-os/pkgar.git
        git config --global url.https://github.com/redox-os/pkgutils.git.insteadOf https://gitlab.redox-os.org/redox-os/pkgutils.git
        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
        echo 'CARGO_NET_RETRY=10' >> "$GITHUB_ENV"
    # Share the cache key introduced by #98; keep the original immutable revisions.
    - name: Cache Cargo Git dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/registry/cache
        key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-git-
