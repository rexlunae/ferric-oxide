name: ferric-config

on:
  push:
    branches: [main]
    paths:
      - "tools/ferric-config/**"
      - "features.toml"
      - "config/**"
      - ".github/workflows/ferric-config.yml"
  pull_request:
    paths:
      - "tools/ferric-config/**"
      - "features.toml"
      - "config/**"
      - ".github/workflows/ferric-config.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked --manifest-path tools/ferric-config/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path tools/ferric-config/Cargo.toml -- -D warnings
