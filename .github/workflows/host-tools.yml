name: host-tools

# Tests and lints the host workspace: tools/* and the shared crates in crates/.
# Also runs RedoxFS's own unit tests and driver-block's, which build on the host, ext4d's
# (fs.ext4), ferric-blockd's (fs.luks, fs.lvm) and fatd's (fs.fat).

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "mk/fstools.mk"
      - "mk/llvm.mk"
      - "scripts/native-toolchain.sh"
      - "scripts/native/**"
      - ".cargo/config.toml"
      - "tools/**"
      - "crates/**"
      - "scripts/ferric-ci/**"
      - "features.toml"
      - "config/**"
      - "userspace/redoxfs/**"
      - "userspace/ext4d/**"
      - "recipes/core/ext4d/**"
      - "recipes/tests/ferric-ext4-test/**"
      - "userspace/blockd/**"
      - "recipes/tests/ferric-blocklayer-test/**"
      - "userspace/fatd/**"
      - "recipes/core/fatd/**"
      - "recipes/tests/ferric-fat-test/**"
      - "userspace/base/drivers/storage/driver-block/**"
      - "userspace/base/drivers/executor/**"
      - "userspace/base/drivers/storage/nvmed/**"
      - "recipes/tests/ferric-iobench/**"
      - "recipes/tests/ferric-ring-test/**"
      - ".github/workflows/host-tools.yml"
      - ".github/actions/prepare-cargo-git/**"

concurrency:
  # A new push to a pull request supersedes its older run; runs on main and
  # ci/** branches are kept.
  group: host-tools-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-cargo-git
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-
      - name: Smoke runner regression tests
        run: bash scripts/ferric-ci/test-boot-smoke.sh
      - name: Loader diagnostic regression tests
        run: bash scripts/ferric-ci/test-ld-so-errors.sh
      - name: Failed-test log printer tests
        run: bash scripts/ferric-ci/test-print-test-fails.sh
      - name: Native toolchain regression tests
        run: bash scripts/ferric-ci/test-native-toolchain.sh
      - name: Perf A/B gate regression tests
        run: bash scripts/ferric-ci/test-perf-ab.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: |
          cargo test --locked --workspace
          cargo test --locked --manifest-path recipes/tests/ferric-ring-test/files/Cargo.toml
      - name: Device-tree memory safety
        run: |
          rustup component add miri
          cargo miri test --locked -p ferric-exec-core -p ferric-devicetree
      - name: Docs
        run: cargo doc --locked --no-deps -p ferric-build -p ferric-abi -p ferric-aligned-buffer -p ferric-boot-time -p ferric-exec-core -p ferric-devicetree -p ferric-amdvi -p ferric-cet -p ferric-codecache -p ferric-hwrand -p ferric-iommu -p ferric-irq -p ferric-netq -p ferric-nospec -p ferric-procinfo -p ferric-svm -p ferric-trace -p ferric-trace-cli -p ferric-trace-map -p ferric-vm -p ferric-vmx -p ferric-vtd -p fox-core -p fox-git -p fox-build -p fox-sbom -p fox-store -p fox-index -p fox -p cargo-fox -p fox-registry && cargo doc --locked --no-deps --all-features -p ferric-iommu -p ferric-trace && cargo doc --locked --no-deps --all-features -p fox-core
        env:
          RUSTDOCFLAGS: -D warnings
      # Imported host tools have existing upstream lint warnings, so
      # warnings are only denied for Ferric Oxide's own tools.
      # --no-deps keeps imported path dependencies (including the installer
      # used by ferric-config's integration tests) outside that strict scope.
      - name: Clippy
        run: cargo clippy --locked --no-deps --all-targets -p ferric-build -p ferric-config -p ferric-abi -p ferric-aligned-buffer -p ferric-boot-time -p ferric-exec-core -p ferric-devicetree -p ferric-amdvi -p ferric-cet -p ferric-codecache -p ferric-hwrand -p ferric-irq -p ferric-netq -p ferric-nospec -p ferric-procinfo -p ferric-svm -p ferric-trace -p ferric-trace-cli -p ferric-trace-map -p ferric-vm -p ferric-vmx -p ferric-vtd -p fox-core -p fox-git -p fox-build -p fox-sbom -p fox-store -p fox-index -p fox -p cargo-fox -p fox-registry -- -D warnings
      # fox-core's types and head verification are no_std; check them without
      # the std file-access layer the other fox crates turn on.
      - name: Clippy (fox-core without std)
        run: cargo clippy --locked -p fox-core -- -D warnings
      # ferric-iommu's alias rules sit behind its `alloc` feature (pcid turns it on; the
      # kernel and bootstrap do not).
      - name: Clippy (ferric-iommu)
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-iommu -- -D warnings
          cargo clippy --locked -p ferric-iommu -- -D warnings
      - name: Test (ferric-iommu with alloc)
        run: cargo test --locked -p ferric-iommu --all-features
      # ferric-regbuf's grant table and pin budget sit behind its `alloc` feature (the
      # kernel turns it on; bootstrap and clients do not).
      - name: ferric-regbuf
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-regbuf -- -D warnings
          cargo clippy --locked -p ferric-regbuf -- -D warnings
          cargo test --locked -p ferric-regbuf --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features -p ferric-regbuf
      # ferric-trace's `alloc` feature adds heap-backed rings (the kernel turns it on).
      - name: Test and Clippy (ferric-trace with alloc)
        run: |
          cargo test --locked -p ferric-trace --all-features
          cargo clippy --locked --all-targets --all-features -p ferric-trace -- -D warnings
      # ferric-blkgrant's slot table sits behind its `alloc` feature (driver-block turns it on;
      # clients do not).
      - name: ferric-blkgrant
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-blkgrant -- -D warnings
          cargo clippy --locked -p ferric-blkgrant -- -D warnings
          cargo test --locked -p ferric-blkgrant --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features -p ferric-blkgrant
      # ferric-blkqueue's close gate sits behind its `alloc` feature (driver-block turns it on).
      - name: ferric-blkqueue
        run: |
          cargo clippy --locked --all-targets -p ferric-blkqueue -- -D warnings
          cargo clippy --locked --all-targets -p ferric-blkqueue --all-features -- -D warnings
          cargo test --locked -p ferric-blkqueue --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-blkqueue --all-features
      # ferric-jbd2: JBD2 journal recovery planning, which ext4d's journal replay
      # (fs.ext4_journal_replay) uses; no_std, so also built for a bare-metal target.
      - name: ferric-jbd2
        run: |
          cargo clippy --locked --all-targets -p ferric-jbd2 -- -D warnings
          cargo test --locked -p ferric-jbd2
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-jbd2
          rustup target add x86_64-unknown-none
          cargo build --locked -p ferric-jbd2 --target x86_64-unknown-none
      # ferric-iobench: the disk benchmark's fio-style jobs, block order, latency histogram and
      # report (recipes/tests/ferric-iobench runs them on the target).
      - name: ferric-iobench
        run: |
          cargo clippy --locked --all-targets -p ferric-iobench -- -D warnings
          cargo test --locked -p ferric-iobench
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-iobench
          # The runner's own host tests (job parsing, round timing); it is its own workspace.
          cargo test --locked --manifest-path recipes/tests/ferric-iobench/files/Cargo.toml
      # ferric-pcache's reclaim lists and reverse map sit behind its `alloc` feature (the
      # kernel turns it on). Its `client` feature (RedoxFS's side) only builds on Redox, so
      # the image build checks it.
      - name: ferric-pcache
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-pcache -- -D warnings
          cargo clippy --locked -p ferric-pcache -- -D warnings
          cargo test --locked -p ferric-pcache --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features -p ferric-pcache
      # ferric-wasm-abi's handle table sits behind its `alloc` feature (the wasm runtime
      # turns it on; guest bindings do not).
      - name: ferric-wasm-abi
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-wasm-abi -- -D warnings
          cargo clippy --locked -p ferric-wasm-abi -- -D warnings
          cargo test --locked -p ferric-wasm-abi --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features -p ferric-wasm-abi
      # ferric-ring: the shared ring format, its queues and chain rules, and the
      # kernel.ring scheme's calls (kernel, bootstrap and ferric-ring-test use it).
      - name: ferric-ring
        run: |
          cargo clippy --locked --all-targets --all-features -p ferric-ring -- -D warnings
          cargo clippy --locked -p ferric-ring -- -D warnings  # without the alloc file table
          cargo test --locked -p ferric-ring --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features -p ferric-ring
      # ferric-vtd's allocators sit behind its default `alloc` feature; check the
      # crate builds without them too.
      - name: Clippy (ferric-vtd without alloc)
        run: cargo clippy --locked -p ferric-vtd --no-default-features -- -D warnings
      # ferric-fspath: the path helpers the file system daemons share; no_std.
      - name: ferric-fspath
        run: |
          cargo clippy --locked --no-deps --all-targets -p ferric-fspath -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-fspath
          rustup target add x86_64-unknown-none
          cargo build --locked -p ferric-fspath --target x86_64-unknown-none
      # ferric-lvm: read-only LVM2 labels, metadata and LV mapping; no_std, so check it
      # builds for a bare-metal target as the kernel and the bootloader would use it.
      - name: ferric-lvm
        run: |
          cargo clippy --locked --all-targets -p ferric-lvm -- -D warnings
          cargo test --locked -p ferric-lvm
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-lvm
          rustup target add x86_64-unknown-none
          cargo build --locked -p ferric-lvm --target x86_64-unknown-none
      # ferric-luks runs in the bootloader (soft-float UEFI, with `force-soft`) as well as
      # in user space; check both builds, and its docs and lints.
      - name: ferric-luks
        run: |
          cargo clippy --locked --no-deps --all-targets -p ferric-luks -- -D warnings
          cargo clippy --locked --no-deps --all-targets --all-features -p ferric-luks -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-luks
          RUSTFLAGS="--cfg aes_force_soft" cargo build --locked -p ferric-luks --features force-soft -Zbuild-std=core,alloc --target x86_64-unknown-uefi
      # ferric-blocklayer: the stackable slice, LUKS and LVM layers; no_std, each layer behind
      # its feature (fs.luks, fs.lvm), so check every combination and a bare-metal build. The
      # `std` feature adds the file device the daemons share; test it too.
      - name: ferric-blocklayer
        run: |
          cargo clippy --locked --no-deps --all-targets -p ferric-blocklayer -- -D warnings
          cargo clippy --locked --no-deps --all-targets -p ferric-blocklayer --all-features -- -D warnings
          for features in "" alloc std luks lvm; do
            cargo clippy --locked --no-deps -p ferric-blocklayer --no-default-features --features "$features" -- -D warnings
          done
          cargo test --locked -p ferric-blocklayer --features std --lib
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p ferric-blocklayer --all-features
          rustup target add x86_64-unknown-none
          RUSTFLAGS="--cfg aes_force_soft" cargo build --locked -p ferric-blocklayer --no-default-features --features luks,lvm,ferric-luks/force-soft --target x86_64-unknown-none

  redoxfs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: userspace/redoxfs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-cargo-git
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/redoxfs/target
          key: redoxfs-${{ hashFiles('userspace/redoxfs/Cargo.lock') }}
          restore-keys: redoxfs-
      - name: Test
        run: cargo test --locked --lib

  # ext4d (fs.ext4): its tests on the committed ext4 images and on ones e2fsprogs makes now
  # (the journal replay, fs.ext4_journal_replay, against e2fsck's, and the journaled writer,
  # fs.ext4_write, checked by e2fsck), its lints and docs for the host and for Redox with
  # each feature set, and the on-target test's lints.
  ext4d:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: userspace/ext4d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            userspace/ext4d/target
          key: ext4d-${{ hashFiles('userspace/ext4d/Cargo.lock', 'recipes/tests/ferric-ext4-test/files/Cargo.lock') }}
          restore-keys: ext4d-
      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path ../../recipes/tests/ferric-ext4-test/files/Cargo.toml
      - name: Test (committed images)
        run: |
          cargo test --locked
          cargo test --locked --features journal-replay
          # The journaled writer (fs.ext4_write), with e2fsck replaying and checking every
          # volume it leaves.
          EXT4D_E2FSCK="$(command -v e2fsck || echo /usr/sbin/e2fsck)" cargo test --locked --features write
      - name: Test (fresh images from e2fsprogs)
        run: |
          mke2fs -V
          mkdir -p "$RUNNER_TEMP/ext4"
          tests/fixtures/make-fixtures.sh "$RUNNER_TEMP/ext4"
          EXT4D_FIXTURES="$RUNNER_TEMP/ext4" cargo test --locked --test basic --test unreplayed
          EXT4D_FIXTURES="$RUNNER_TEMP/ext4" cargo test --locked --features journal-replay --test journal
          EXT4D_FIXTURES="$RUNNER_TEMP/ext4" EXT4D_E2FSCK="$(command -v e2fsck || echo /usr/sbin/e2fsck)" \
            cargo test --locked --features write --test write --test futimens --test chmod_chown --test write_data --test alloc
      - name: Clippy and docs
        run: |
          rustup target add x86_64-unknown-redox
          for features in "" "--features journal-replay" "--features write"; do
            cargo clippy --locked --all-targets $features -- -D warnings
            cargo clippy --locked --all-targets --target x86_64-unknown-redox $features -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps $features
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --target x86_64-unknown-redox $features
          done
          CARGO_TARGET_DIR=target cargo clippy --locked --all-targets --target x86_64-unknown-redox \
            --manifest-path ../../recipes/tests/ferric-ext4-test/files/Cargo.toml -- -D warnings

  # ferric-blockd (fs.luks, fs.lvm, fs.unlock_at_boot): its tests, lints and docs for the host and for Redox, the
  # on-target test's lints, and the block-layer tests on images cryptsetup and lvm2 make now.
  blockd:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: userspace/blockd
    steps:
      - uses: actions/checkout@v4
      # The fresh-image test builds ferric-blocklayer in the host workspace, whose lockfile
      # names the cookbook's git dependencies.
      - uses: ./.github/actions/prepare-cargo-git
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            userspace/blockd/target
          key: blockd-${{ hashFiles('userspace/blockd/Cargo.lock', 'recipes/tests/ferric-blocklayer-test/files/Cargo.lock') }}
          restore-keys: blockd-
      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path ../../recipes/tests/ferric-blocklayer-test/files/Cargo.toml
      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --no-default-features --features luks
          cargo test --locked --no-default-features --features lvm
          # ferric-unlock and its crypttab (fs.unlock_at_boot), with both layers and with one.
          cargo test --locked --features unlock
          cargo test --locked --no-default-features --features luks,unlock
      - name: Test the layers on fresh images
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptsetup-bin lvm2 python3-cryptography
          cryptsetup --version
          lvm version | head -1
          mkdir -p "$RUNNER_TEMP/blocklayer"
          sudo ../../crates/blocklayer/tests/fixtures/make-fixtures.sh "$RUNNER_TEMP/blocklayer"
          BLOCKLAYER_FIXTURES="$RUNNER_TEMP/blocklayer" CARGO_TARGET_DIR=target \
            cargo test --locked --manifest-path ../../crates/blocklayer/Cargo.toml --test fixtures
      - name: Clippy and docs
        run: |
          rustup target add x86_64-unknown-redox
          # The unlock feature only adds code, so building with it lints and documents all of it.
          cargo clippy --locked --all-targets --features unlock -- -D warnings
          cargo clippy --locked --all-targets --features unlock --target x86_64-unknown-redox -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --features unlock
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --features unlock --target x86_64-unknown-redox
          CARGO_TARGET_DIR=target cargo clippy --locked --all-targets --target x86_64-unknown-redox \
            --manifest-path ../../recipes/tests/ferric-blocklayer-test/files/Cargo.toml -- -D warnings

  # fatd (fs.fat): its tests on the committed FAT images and on ones dosfstools and mtools make
  # now, its lints and docs for the host and for Redox, and the on-target test's lints.
  fatd:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: userspace/fatd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            userspace/fatd/target
          key: fatd-${{ hashFiles('userspace/fatd/Cargo.lock', 'recipes/tests/ferric-fat-test/files/Cargo.lock') }}
          restore-keys: fatd-
      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path ../../recipes/tests/ferric-fat-test/files/Cargo.toml
      - name: Test (committed images)
        run: cargo test --locked
      - name: Test (fresh images from dosfstools and mtools)
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools
          dpkg-query -W dosfstools mtools
          mkdir -p "$RUNNER_TEMP/fat"
          tests/fixtures/make-fixtures.sh "$RUNNER_TEMP/fat"
          FATD_FIXTURES="$RUNNER_TEMP/fat" cargo test --locked --test basic
      - name: Clippy and docs
        run: |
          rustup target add x86_64-unknown-redox
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --target x86_64-unknown-redox -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --target x86_64-unknown-redox
          CARGO_TARGET_DIR=target cargo clippy --locked --all-targets --target x86_64-unknown-redox \
            --manifest-path ../../recipes/tests/ferric-fat-test/files/Cargo.toml -- -D warnings

  # driver-block's concurrent-request and close-ordering tests run on the host.
  driver-block:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: userspace/base
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-cargo-git
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/base/target
          key: userspace-base-${{ hashFiles('userspace/base/Cargo.lock') }}
          restore-keys: userspace-base-
      - name: Test
        run: cargo test --locked -p executor -p driver-block -p netstack -p rtl8125d
      - name: Compile NVMe timing with buffered and DMA paths
        run: |
          rustup target add x86_64-unknown-redox
          cargo check --locked -p nvmed --target x86_64-unknown-redox
          cargo check --locked -p nvmed --target x86_64-unknown-redox --features perf
          cargo check --locked -p nvmed --target x86_64-unknown-redox --features perf,percore,grant-dma
