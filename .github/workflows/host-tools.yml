name: host-tools

# Tests and lints the host workspace (tools/*): the cookbook and ferric-config.

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - "features.toml"
      - "config/**"
      - ".github/workflows/host-tools.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --locked --workspace
      # The cookbook is upstream code with many existing lint warnings, so
      # warnings are only denied for Ferric Oxide's own tools.
      - name: Clippy
        run: cargo clippy --locked --all-targets -p ferric-config -- -D warnings
