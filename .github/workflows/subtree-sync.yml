name: subtree-sync

# Pull upstream Redox changes into the subtrees in this repository and open a
# pull request for each one that changed. Each subtree keeps its upstream
# history, so `git subtree pull` merges like an ordinary branch merge and the
# image workflow proves the result before it lands.
#
# Pull requests opened with GITHUB_TOKEN do not start other workflows, so this
# job dispatches the image workflow on the sync branch itself; its checks show
# up on the pull request because they run on the same commit.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: crates/kernel
            url: https://gitlab.redox-os.org/redox-os/kernel.git
            ref: master
          - prefix: crates/relibc
            url: https://gitlab.redox-os.org/redox-os/relibc.git
            ref: master
          - prefix: crates/bootloader
            url: https://gitlab.redox-os.org/redox-os/bootloader.git
            ref: master
          - prefix: userspace/redoxfs
            url: https://gitlab.redox-os.org/redox-os/redoxfs.git
            ref: master
          - prefix: userspace/base
            url: https://gitlab.redox-os.org/redox-os/base.git
            ref: main
          - prefix: docs
            url: https://gitlab.redox-os.org/redox-os/book.git
            ref: master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull upstream
        id: pull
        env:
          PREFIX: ${{ matrix.prefix }}
          URL: ${{ matrix.url }}
          REF: ${{ matrix.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="subtree-sync/${PREFIX//\//-}"
          before="$(git rev-parse HEAD)"
          git fetch --quiet "$URL" "$REF"
          upstream="$(git rev-parse --short FETCH_HEAD)"
          git subtree pull --prefix="$PREFIX" "$URL" "$REF" \
            -m "Pull upstream ${PREFIX} ${upstream} into ${PREFIX}/"
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "Already up to date with upstream ${upstream}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREFIX" = crates/kernel ]; then
            # Upstream code may change the kernel warning counts. Move the
            # lint ratchet baseline with it so the next fork PR is measured
            # against upstream's new state, not blamed for it.
            toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' crates/kernel/rust-toolchain.toml)"
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nasm
            rustup toolchain install "$toolchain" --profile minimal --component rust-src,clippy
            scripts/ferric-ci/kernel-lint-ratchet.sh --update
            if ! git diff --quiet -- ci/kernel-lints.json; then
              git commit -m "Update kernel lint baseline for upstream ${upstream}" -- ci/kernel-lints.json
            fi
          fi
          git push --force origin "HEAD:refs/heads/${branch}"
          {
            echo "changed=true"
            echo "branch=${branch}"
            echo "upstream=${upstream}"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request and start image CI
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ matrix.prefix }}
          URL: ${{ matrix.url }}
          BRANCH: ${{ steps.pull.outputs.branch }}
          UPSTREAM: ${{ steps.pull.outputs.upstream }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Pull upstream ${PREFIX}" \
              --body "Merges upstream \`${URL}\` (${UPSTREAM}) into \`${PREFIX}/\` with \`git subtree pull\`. Opened by the subtree-sync workflow."
          fi
          gh workflow run image.yml --ref "$BRANCH"
