name: image

# Phase 0: build a bootable image and boot it in QEMU/KVM.
#
# The build runs in Redox's own CI container with prebuilt packages
# (REPO_BINARY=1); only the packages marked "source" in
# config/ferric-smoke.toml are compiled, from the trees in this repository
# (crates/kernel/) or from their recipes' sources.

on:
  push:
    # ci/** branches are for trying CI changes without opening a PR.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: Image config to build and boot
        type: choice
        options: [ferric-smoke, ferric-fuzz]
        default: ferric-smoke
  # Nightly: a long system call fuzzing run (config/ferric-fuzz.toml).
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # Kept apart by event, so the nightly run never cancels a push run on main.
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CONFIG_NAME: ${{ github.event_name == 'schedule' && 'ferric-fuzz' || inputs.config || 'ferric-smoke' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: docker.io/redoxos/redox-base-x86_64:latest
    env:
      PODMAN_BUILD: "0"
      SKIP_CHECK_TOOLS: "1"
      REPO_BINARY: "1"
      FSTOOLS_NO_MOUNT: "1"
      COOKBOOK_VERBOSE: "false"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Building relibc from source regenerates its C headers with cbindgen,
      # which the container does not ship.
      - name: Install cbindgen
        run: command -v cbindgen || "$HOME/.cargo/bin/cargo" install --locked cbindgen

      - uses: actions/cache@v4
        with:
          path: |
            prefix
            build/fstools
            target
          key: redox-host-${{ hashFiles('Cargo.lock', 'tools/installer/**', 'mk/prefix.mk', 'mk/fstools.mk', 'rust-toolchain.toml') }}
          restore-keys: redox-host-

      # Build the kernel and relibc with the feature catalog's defaults
      # (features.toml), so CI boots what a Ferric Oxide build ships rather
      # than upstream's set.
      - name: Features from the catalog defaults
        run: |
          out="$RUNNER_TEMP/ferric-defaults"
          mkdir -p "$out"
          # KPTI only switches on by itself on Meltdown-affected Intel CPUs, which
          # the runners are not, so force it on to test the entry code on every run.
          # The IOMMU is off by default; "auto" enables VT-d on the boot that has one
          # and logs that there is no DMAR table on the other.
          # Shadow stacks are off by default; "auto" logs what the CPU reports and, on CET
          # hardware, allocates them without turning CET on.
          # Registered buffers and kernel tracing are off by default; turn them on so
          # ferric-regbuf-test and ferric-trace-test run, with sched.switch on from boot.
          printf '[kernel.cpu]\nkpti = "always"\nshstk = "auto"\n[kernel]\niommu = "auto"\nregbuf = true\ntrace = true\ntrace_boot = "sched"\n' > "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate
          # Pass the recipe-facing settings (kernel and relibc features,
          # kernel link arguments, bootloader features) on to the build.
          for var in FERRIC_KERNEL_FEATURES FERRIC_RELIBC_FEATURES FERRIC_KERNEL_LINK_ARGS FERRIC_BOOTLOADER_FEATURES; do
            value="$(sed -n "s/^export $var:=//p" "$out/config.mk")"
            echo "$var=$value" | tee -a "$GITHUB_ENV"
          done
          # CPU feature policy for the kernel's config.toml (recipes/core/kernel).
          if [ -f "$out/kernel-config.toml" ]; then
            cat "$out/kernel-config.toml"
            echo "FERRIC_KERNEL_CONFIG=$out/kernel-config.toml" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: |
          # Log downloads are not always available to reviewers, so a failed build also
          # reports the end of its log as one annotation.
          set -o pipefail
          if ! make all CONFIG_NAME="$CONFIG_NAME" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 80 "$RUNNER_TEMP/build.log" \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk 'BEGIN { printf "::error title=Build image failed::" } { printf "%s%%0A", $0 } END { print "" }'
            exit 1
          fi

      - name: Compress image
        run: zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o harddrive.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ferric-smoke-image
          path: harddrive.img.zst
          retention-days: 7

      # The same image with a kernel built with kernel.iommu = "enforce": only the kernel is
      # rebuilt, then the image is made again from the packages already built.
      - name: Build the enforce image
        run: |
          out="$RUNNER_TEMP/ferric-enforce"
          mkdir -p "$out"
          # The catalog-defaults config above, with the IOMMU switched to "enforce".
          sed 's/^iommu = "auto"$/iommu = "enforce"/' "$RUNNER_TEMP/ferric-defaults/ferric.toml" > "$out/ferric.toml"
          cat "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate
          cat "$out/kernel-config.toml"
          grep -q '^iommu = "enforce"' "$out/kernel-config.toml"
          export FERRIC_KERNEL_CONFIG="$out/kernel-config.toml"
          make cr.kernel CONFIG_NAME="$CONFIG_NAME"
          rm -f "build/x86_64/$CONFIG_NAME/harddrive.img"
          make all CONFIG_NAME="$CONFIG_NAME"
          mkdir -p enforce
          zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o enforce/harddrive.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ferric-smoke-image-enforce
          path: enforce/harddrive.img.zst
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            recipes/**/target/*/build/*.log
            recipes/**/target/*/*.log
          if-no-files-found: ignore
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cpu: [host]
        # "vtd" boots the same image with an emulated Intel IOMMU: every PCI driver
        # (nvmed, e1000d, ahcid) binds a DMA domain of its own when it connects to
        # pcid, the kernel's DMA-domain self-test runs, and ferric-iommu-test drives
        # QEMU's edu device through its domain. "enforce" boots the image whose kernel
        # has kernel.iommu = "enforce" on the same machine: drivers without a bound
        # domain get no DMA addresses and unattached devices are blocked, so reaching
        # the smoke-test marker from disk shows the real drivers DMA through their
        # domains. "amdvi" and "amdvi-enforce" do the same with an emulated AMD IOMMU
        # (DMA remapping only), under QEMU 10 in a container (see the boot step).
        iommu: [none, vtd, enforce, amdvi, amdvi-enforce]
    env:
      LOG: serial-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}.log
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@v4
        with:
          name: ${{ (matrix.iommu == 'enforce' || matrix.iommu == 'amdvi-enforce') && 'ferric-smoke-image-enforce' || 'ferric-smoke-image' }}

      - name: Boot smoke test
        env:
          # The fuzzing image runs for 20 minutes before it shuts down.
          BOOT_TIMEOUT: ${{ env.CONFIG_NAME == 'ferric-fuzz' && '1800' || '300' }}
          BOOT_IOMMU: ${{ matrix.iommu == 'enforce' && 'vtd' || startsWith(matrix.iommu, 'amdvi') && 'amdvi' || matrix.iommu }}
        run: |
          zstd -d harddrive.img.zst -o harddrive.img
          if [ "$BOOT_IOMMU" = amdvi ]; then
            # Ubuntu 24.04's QEMU 8.2 does not translate DMA through amd-iommu (dma-remap
            # came in QEMU 10), so the AMD-Vi boots run Ubuntu 26.04's QEMU in a container,
            # with the runner's KVM and OVMF.
            docker run --rm --device /dev/kvm -e BOOT_IOMMU -e BOOT_TIMEOUT \
              -v "$PWD:/work" -w /work -v /usr/share/ovmf:/usr/share/ovmf:ro ubuntu:26.04 \
              bash -c 'set -e
                apt-get update -q
                DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
                  qemu-system-x86 ipxe-qemu > /dev/null
                qemu-system-x86_64 --version
                scripts/ferric-ci/boot-smoke.sh harddrive.img "$0" "$1"' "$LOG" ${{ matrix.cpu }}
          else
            scripts/ferric-ci/boot-smoke.sh harddrive.img "$LOG" ${{ matrix.cpu }}
          fi

      - name: Check KASLR, KPTI and PCID ran
        run: |
          grep -aF "KASLR: physical memory map randomized" "$LOG"
          grep -aF "KASLR: kernel image randomized" "$LOG"
          grep -aF "KPTI: user page tables isolated from the kernel" "$LOG"
          # kernel.cpu.pcid defaults to "auto": with -cpu host the guest gets PCID and INVPCID
          # whenever the runner has them, and then KPTI must use them.
          if grep -qw pcid /proc/cpuinfo && grep -qw invpcid /proc/cpuinfo; then
            grep -aF "KPTI: PCID enabled, no-flush CR3 switches" "$LOG"
          else
            echo "::warning::runner CPU lacks PCID or INVPCID; KPTI ran without PCID"
            if grep -aF "KPTI: PCID enabled" "$LOG"; then exit 1; fi
          fi

      # kernel.cpu.shstk = "auto" does not enable shadow stacks yet. Whether KVM passes CET_SS
      # through depends on the runner, so accept either answer but require the line.
      - name: Check shadow-stack detection
        run: |
          grep -aE "CET: shadow stacks supported=(true|false) policy=auto decision=(on|off) \(not yet enabled\)" "$LOG"

      - name: Check futex wakeups
        run: grep -aF "FERRIC_TEST_PASS futex-wake-race" "$LOG"

      # The image has kernel.regbuf on, so ferric-regbuf-test must run every step, not skip.
      - name: Check registered buffers
        run: |
          steps="register file-backed grant-rw grant-ro pinned reshare-mmap reshare-register reshare-borrow
            forward-borrow revoke unmap close shared bytes bounce-newer"
          for step in $steps; do
            grep -aF "FERRIC_TEST_PASS regbuf-$step" "$LOG"
          done
          echo "::notice::ferric-regbuf-test passed all $(wc -w <<< "$steps") steps"

      # The image has kernel.trace on, so ferric-trace-test must run every step, not skip.
      - name: Check kernel tracing
        run: |
          grep -aF "trace: sched.switch on from boot (trace.boot)" "$LOG"
          for step in boot enable decode order write read yield sched scheme disable; do
            grep -aF "FERRIC_TEST_PASS trace-$step" "$LOG"
          done
          echo "::notice::ferric-trace-test passed all 10 steps"

      - name: Check the IOMMU
        # The kernel's attach, bind, fault and release lines, the test driver's results, and
        # that the disk, network and AHCI drivers each DMA through a domain they bound.
        run: scripts/ferric-ci/check-iommu-log.sh ${{ matrix.iommu == 'vtd' && 'auto' || matrix.iommu }} "$LOG"

      # The tail of the serial log as annotations, readable through the check-run API when
      # the log artifact cannot be fetched.
      - name: Annotate the serial log on failure
        if: failure()
        run: |
          # Test results and IOMMU, pcid and interrupt lines first, then the tail.
          tr -d '\r' < "$LOG" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > "$RUNNER_TEMP/clean.log" || true
          { grep -aE 'FERRIC_TEST_(FAIL|SKIP)|FERRIC_IOMMU|IOMMU|pcid|iommu|interrupt|panic|PANIC|EXCEPTION' "$RUNNER_TEMP/clean.log" \
              | grep -av 'funmap passed' | tail -n 120
            grep -av 'funmap passed' "$RUNNER_TEMP/clean.log" | tail -n 40; } > "$RUNNER_TEMP/tail.log" || true
          split -l 40 "$RUNNER_TEMP/tail.log" "$RUNNER_TEMP/tail."
          for part in "$RUNNER_TEMP"/tail.a?; do
            body="$(sed 's/%/%25/g' "$part" | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::notice title=serial log ($(basename "$part"))::$body"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}
          path: ${{ env.LOG }}
          retention-days: 14
