name: image

# Phase 0: build a bootable image and boot it in QEMU/KVM.
#
# The build runs in Redox's own CI container with prebuilt packages
# (REPO_BINARY=1); only the packages marked "source" in
# config/ferric-smoke.toml are compiled, from the trees in this repository
# (kernel/) or from their recipes' sources.

on:
  push:
    # ci/** branches are for trying CI changes without opening a PR.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: Image config to build and boot
        type: choice
        options: [ferric-smoke, ferric-fuzz]
        default: ferric-smoke
  # Nightly: a long system call fuzzing run (config/ferric-fuzz.toml).
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # Kept apart by event, so the nightly run never cancels a push run on main.
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CONFIG_NAME: ${{ github.event_name == 'schedule' && 'ferric-fuzz' || inputs.config || 'ferric-smoke' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: docker.io/redoxos/redox-base-x86_64:latest
    env:
      PODMAN_BUILD: "0"
      SKIP_CHECK_TOOLS: "1"
      REPO_BINARY: "1"
      FSTOOLS_NO_MOUNT: "1"
      COOKBOOK_VERBOSE: "false"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Building relibc from source regenerates its C headers with cbindgen,
      # which the container does not ship.
      - name: Install cbindgen
        run: command -v cbindgen || "$HOME/.cargo/bin/cargo" install --locked cbindgen

      - uses: actions/cache@v4
        with:
          path: |
            prefix
            build/fstools
            target
          key: redox-host-${{ hashFiles('Cargo.lock', 'tools/installer/**', 'mk/prefix.mk', 'mk/fstools.mk', 'rust-toolchain.toml') }}
          restore-keys: redox-host-

      # Build the kernel and relibc with the feature catalog's defaults
      # (features.toml), so CI boots what a Ferric Oxide build ships rather
      # than upstream's set.
      - name: Features from the catalog defaults
        run: |
          out="$RUNNER_TEMP/ferric-defaults"
          mkdir -p "$out"
          # KPTI only switches on by itself on Meltdown-affected Intel CPUs, which
          # the runners are not, so force it on to test the entry code on every run.
          # The IOMMU is off by default; "auto" enables VT-d on the boot that has one
          # and logs that there is no DMAR table on the other.
          printf '[kernel.cpu]\nkpti = "always"\n[kernel]\niommu = "auto"\n' > "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate
          features="$(sed -n 's/^export FERRIC_KERNEL_FEATURES:=//p' "$out/config.mk")"
          echo "Kernel features: $features"
          echo "FERRIC_KERNEL_FEATURES=$features" >> "$GITHUB_ENV"
          relibc="$(sed -n 's/^export FERRIC_RELIBC_FEATURES:=//p' "$out/config.mk")"
          echo "relibc features: $relibc"
          echo "FERRIC_RELIBC_FEATURES=$relibc" >> "$GITHUB_ENV"
          # CPU feature policy for the kernel's config.toml (recipes/core/kernel).
          if [ -f "$out/kernel-config.toml" ]; then
            cat "$out/kernel-config.toml"
            echo "FERRIC_KERNEL_CONFIG=$out/kernel-config.toml" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: make all CONFIG_NAME="$CONFIG_NAME"

      - name: Compress image
        run: zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o harddrive.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ferric-smoke-image
          path: harddrive.img.zst
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            recipes/**/target/*/build/*.log
            recipes/**/target/*/*.log
          if-no-files-found: ignore
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cpu: [host]
        # "vtd" boots the same image with an emulated Intel IOMMU, so the NVMe and
        # e1000 DMA run through the kernel's identity-domain page tables.
        iommu: [none, vtd]
    env:
      LOG: serial-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}.log
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@v4
        with:
          name: ferric-smoke-image

      - name: Boot smoke test
        env:
          # The fuzzing image runs for 20 minutes before it shuts down.
          BOOT_TIMEOUT: ${{ env.CONFIG_NAME == 'ferric-fuzz' && '1800' || '300' }}
          BOOT_IOMMU: ${{ matrix.iommu }}
        run: |
          zstd -d harddrive.img.zst -o harddrive.img
          scripts/ferric-ci/boot-smoke.sh harddrive.img "$LOG" ${{ matrix.cpu }}

      - name: Check KASLR, KPTI and PCID ran
        run: |
          grep -F "KASLR: physical memory map randomized" "$LOG"
          grep -aF "KPTI: user page tables isolated from the kernel" "$LOG"
          # kernel.cpu.pcid defaults to "auto": with -cpu host the guest gets PCID and INVPCID
          # whenever the runner has them, and then KPTI must use them.
          if grep -qw pcid /proc/cpuinfo && grep -qw invpcid /proc/cpuinfo; then
            grep -aF "KPTI: PCID enabled, no-flush CR3 switches" "$LOG"
          else
            echo "::warning::runner CPU lacks PCID or INVPCID; KPTI ran without PCID"
            if grep -aF "KPTI: PCID enabled" "$LOG"; then exit 1; fi
          fi

      - name: Check the IOMMU
        run: |
          if [ "${{ matrix.iommu }}" = vtd ]; then
            grep -aF "IOMMU: VT-d unit at 0xfed90000 enabled (identity domain)" "$LOG"
          else
            grep -aF "IOMMU: no DMAR table, VT-d not enabled" "$LOG"
          fi
          if grep -aE "IOMMU: (DMA fault|VT-d unit .* skipped|.*lost faults)" "$LOG"; then
            echo "::error::the IOMMU reported a fault or skipped a unit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}
          path: ${{ env.LOG }}
          retention-days: 14
