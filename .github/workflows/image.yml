name: image

# Phase 0: build a bootable image and boot it in QEMU/KVM.
#
# The build runs in Redox's own CI container with prebuilt packages
# (REPO_BINARY=1); only the packages marked "source" in
# config/ferric-smoke.toml are compiled, from the trees in this repository
# (crates/kernel/) or from their recipes' sources.

on:
  push:
    # ci/** branches are for trying CI changes without opening a PR.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: Image config to build and boot
        type: choice
        options: [ferric-smoke, ferric-fuzz]
        default: ferric-smoke
  # Nightly: a long system call fuzzing run (config/ferric-fuzz.toml).
  schedule:
    - cron: "17 3 * * *"

concurrency:
  # Kept apart by event, so the nightly run never cancels a push run on main.
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CONFIG_NAME: ${{ github.event_name == 'schedule' && 'ferric-fuzz' || inputs.config || 'ferric-smoke' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: docker.io/redoxos/redox-base-x86_64:latest
    env:
      PODMAN_BUILD: "0"
      SKIP_CHECK_TOOLS: "1"
      REPO_BINARY: "1"
      FSTOOLS_NO_MOUNT: "1"
      COOKBOOK_VERBOSE: "false"
      # GitLab outages show up as HTTP 500s; Cargo retries 3 times by default.
      CARGO_NET_RETRY: "10"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-submodules

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Building relibc from source regenerates its C headers with cbindgen,
      # which the container does not ship.
      - name: Install cbindgen
        run: command -v cbindgen || "$HOME/.cargo/bin/cargo" install --locked cbindgen

      # Several crates (relibc's, redoxfs's) have git dependencies on gitlab.redox-os.org.
      # Cargo only fetches a git dependency when its locked commit is missing from
      # ~/.cargo/git/db, so caching that directory keeps a GitLab outage from failing
      # builds whose lockfiles have not moved. The key covers this repository's
      # lockfiles; a dependency the cookbook fetches mid-build has its own lockfile,
      # so a changed key still falls back to an older cache (restore-keys) and Cargo
      # retries the fetch.
      - name: Cache Cargo git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
          key: cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-git-

      - uses: actions/cache@v4
        with:
          path: |
            prefix
            build/fstools
            target
          key: redox-host-${{ hashFiles('Cargo.lock', 'tools/installer/**', 'mk/prefix.mk', 'mk/fstools.mk', 'rust-toolchain.toml') }}
          restore-keys: redox-host-

      # Build the kernel and relibc with the feature catalog's defaults
      # (features.toml), so CI boots what a Ferric Oxide build ships rather
      # than upstream's set.
      - name: Features from the catalog defaults
        run: |
          out="$RUNNER_TEMP/ferric-defaults"
          mkdir -p "$out"
          # KPTI only switches on by itself on Meltdown-affected Intel CPUs, which
          # the runners are not, so force it on to test the entry code on every run.
          # The IOMMU is off by default; "auto" enables VT-d on the boot that has one
          # and logs that there is no DMAR table on the other.
          # Shadow stacks are off by default; "auto" logs what the CPU reports and, on CET
          # hardware, allocates them without turning CET on.
          # Registered buffers, kernel tracing and rings are off by default; turn them on so
          # ferric-regbuf-test, ferric-trace-test (with sched.switch on from boot, and
          # scheme.cancel on from the initfs trace.toml bootstrap applies) and
          # ferric-ring-test run, the page cache (off by default) so ferric-pcache-test
          # does, and nvmed's grant DMA (also off by default) so
          # ferric-blkgrant-test does. Per-CPU interrupt delivery (off by default) is on so
          # ferric-iommu-test's iommu-msi-percpu runs, and nvmed's per-CPU queue pairs
          # (also off by default) are on so the boot disk runs through them. The crash dump
          # region (off by default) and the persistent kernel log (also off by default) are on,
          # so every boot reserves and arms them; the crash image below also tests a dump and the
          # log the panicking boot left. /scheme/sys/proc (off by default) is on so
          # ferric-proc-test runs, and kernel-bypass network queues (off by default) are built
          # into e1000d, so the boot's network checks run with copy mode compiled in. The
          # experimental RTL8125B driver (drivers.rtl8125, off by default) is in, so the
          # image compiles it and installs its PCI match, and ext4d (fs.ext4, off by
          # default) is in, so ferric-ext4-test mounts its ext4 image, with the journal replay
          # (fs.ext4_journal_replay, also off by default), so it also mounts one that needs
          # recovery, and so is ferric-blockd with both its layers (fs.luks and fs.lvm, off by
          # default), so ferric-blocklayer-test serves its LUKS and LVM images.
          printf '[kernel.cpu]\nkpti = "always"\nshstk = "auto"\n[kernel]\niommu = "auto"\nregbuf = true\nrings = true\npage_cache = true\ntrace = true\ntrace_boot = "sched"\ntrace_initfs_enable = ["scheme.cancel"]\ntrace_crash = true\nlog_persist = true\nirq_percpu = true\nsys_proc = true\n[drivers]\ngrant_dma = true\nnvme_percore = true\nnvme_overlap = true\nnet_bypass = true\nrtl8125 = true\n[fs]\next4 = true\next4_journal_replay = true\nluks = true\nlvm = true\n' > "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate
          # Pass the recipe-facing settings (kernel, relibc, initfs and ext4d features,
          # kernel link arguments, bootloader features, signed fox manifests)
          # on to the build.
          for var in FERRIC_KERNEL_FEATURES FERRIC_RELIBC_FEATURES FERRIC_KERNEL_LINK_ARGS FERRIC_BOOTLOADER_FEATURES FERRIC_INITFS_FEATURES FERRIC_BASE_FEATURES FERRIC_BASE_DRIVERS FERRIC_BLOCKD_FEATURES FERRIC_EXT4D_FEATURES FERRIC_FOX_MANIFEST; do
            value="$(sed -n "s/^export $var:=//p" "$out/config.mk")"
            echo "$var=$value" | tee -a "$GITHUB_ENV"
          done
          # CPU feature policy for the kernel's config.toml (recipes/core/kernel).
          if [ -f "$out/kernel-config.toml" ]; then
            cat "$out/kernel-config.toml"
            echo "FERRIC_KERNEL_CONFIG=$out/kernel-config.toml" >> "$GITHUB_ENV"
          fi
          # The initfs trace.toml bootstrap applies (userspace/base/Makefile).
          if [ -f "$out/trace.toml" ]; then
            cat "$out/trace.toml"
            echo "FERRIC_INITFS_TRACE=$out/trace.toml" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: |
          # Log downloads are not always available to reviewers, so a failed build also
          # reports the end of its log as one annotation.
          set -o pipefail
          # The image above enables [drivers] rtl8125, which ferric-config reports as
          # FERRIC_BASE_DRIVERS. base builds the daemon and installs its PCI match only
          # when that list reaches it, and an empty list still produces a bootable
          # image, so check the selection arrived instead of leaving it to a silent
          # omission.
          case " ${FERRIC_BASE_DRIVERS:-} " in
            *" rtl8125d "*) ;;
            *)
              echo "::error title=rtl8125d not selected::[drivers] rtl8125 = true did not reach the build (FERRIC_BASE_DRIVERS='${FERRIC_BASE_DRIVERS:-}')"
              exit 1
              ;;
          esac
          if ! make all CONFIG_NAME="$CONFIG_NAME" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            tail -n 80 "$RUNNER_TEMP/build.log" \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk 'BEGIN { printf "::error title=Build image failed::" } { printf "%s%%0A", $0 } END { print "" }'
            exit 1
          fi

      - name: Compress image
        run: |
          zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o harddrive.img.zst
          # The image's kernel with its symbol table, so a boot that times out can name the
          # functions its CPUs are stuck in (boot-smoke.sh, KERNEL_ELF).
          kernel="$(ls recipes/core/kernel/target/*/stage/usr/lib/boot/kernel 2>/dev/null | head -n 1)"
          if [ -n "$kernel" ]; then zstd -q -T0 "$kernel" -o kernel.elf.zst; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ferric-smoke-image
          path: |
            harddrive.img.zst
            kernel.elf.zst
          if-no-files-found: warn
          retention-days: 7

      # The same image with a kernel built with kernel.iommu = "enforce": only the kernel is
      # rebuilt, then the image is made again from the packages already built.
      - name: Build the enforce image
        run: |
          out="$RUNNER_TEMP/ferric-enforce"
          mkdir -p "$out"
          # The catalog-defaults config above, with the IOMMU switched to "enforce".
          sed 's/^iommu = "auto"$/iommu = "enforce"/' "$RUNNER_TEMP/ferric-defaults/ferric.toml" > "$out/ferric.toml"
          cat "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate
          cat "$out/kernel-config.toml"
          grep -q '^iommu = "enforce"' "$out/kernel-config.toml"
          export FERRIC_KERNEL_CONFIG="$out/kernel-config.toml"
          make cr.kernel CONFIG_NAME="$CONFIG_NAME"
          rm -f "build/x86_64/$CONFIG_NAME/harddrive.img"
          make all CONFIG_NAME="$CONFIG_NAME"
          mkdir -p enforce
          zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o enforce/harddrive.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ferric-smoke-image-enforce
          path: enforce/harddrive.img.zst
          retention-days: 7

      # The same image with a kernel built without kernel.trace, the baseline the
      # trace-overhead job compares the traced kernel against. Only the kernel differs.
      - name: Build the notrace image
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: |
          out="$RUNNER_TEMP/ferric-notrace"
          mkdir -p "$out"
          # The catalog-defaults config above, without the tracing lines. Only the kernel
          # changes, and make cr.kernel rebuilds it, so no other recipe is marked stale.
          # The initfs keeps its trace.toml; bootstrap logs that there is no kernel.trace.
          grep -v -e '^trace = ' -e '^trace_boot = ' -e '^trace_initfs_' -e '^trace_crash' "$RUNNER_TEMP/ferric-defaults/ferric.toml" > "$out/ferric.toml"
          cat "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate --no-touch
          FERRIC_KERNEL_FEATURES="$(sed -n 's/^export FERRIC_KERNEL_FEATURES:=//p' "$out/config.mk")"
          echo "FERRIC_KERNEL_FEATURES=$FERRIC_KERNEL_FEATURES"
          # The container runs steps with sh, so no bash here-strings.
          case "$FERRIC_KERNEL_FEATURES" in
            *trace*) echo "::error::the notrace kernel still has a trace feature"; exit 1 ;;
          esac
          export FERRIC_KERNEL_FEATURES FERRIC_KERNEL_CONFIG="$out/kernel-config.toml"
          make cr.kernel CONFIG_NAME="$CONFIG_NAME"
          rm -f "build/x86_64/$CONFIG_NAME/harddrive.img"
          make all CONFIG_NAME="$CONFIG_NAME"
          mkdir -p notrace
          zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o notrace/harddrive.img.zst

      - uses: actions/upload-artifact@v4
        if: env.CONFIG_NAME == 'ferric-smoke'
        with:
          name: ferric-smoke-image-notrace
          path: notrace/harddrive.img.zst
          retention-days: 7

      # The same image with a crash-test kernel (kernel.trace_crash_test): writing `panic` to
      # /scheme/kernel.trace/crash panics it and resets the machine after the dump, which the
      # crash job reads back on the next boot. Only the kernel differs.
      - name: Build the crash image
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: |
          out="$RUNNER_TEMP/ferric-crash"
          mkdir -p "$out"
          sed 's/^trace_crash = true$/trace_crash = true\ntrace_crash_test = true/' "$RUNNER_TEMP/ferric-defaults/ferric.toml" > "$out/ferric.toml"
          cat "$out/ferric.toml"
          "$HOME/.cargo/bin/cargo" run --quiet --release --manifest-path tools/ferric-config/Cargo.toml -- \
            --config "$out/ferric.toml" --out "$out" generate --no-touch
          FERRIC_KERNEL_FEATURES="$(sed -n 's/^export FERRIC_KERNEL_FEATURES:=//p' "$out/config.mk")"
          echo "FERRIC_KERNEL_FEATURES=$FERRIC_KERNEL_FEATURES"
          case "$FERRIC_KERNEL_FEATURES" in
            *trace_crash_test*) ;;
            *) echo "::error::the crash kernel has no trace_crash_test feature"; exit 1 ;;
          esac
          export FERRIC_KERNEL_FEATURES FERRIC_KERNEL_CONFIG="$out/kernel-config.toml"
          make cr.kernel CONFIG_NAME="$CONFIG_NAME"
          rm -f "build/x86_64/$CONFIG_NAME/harddrive.img"
          make all CONFIG_NAME="$CONFIG_NAME"
          mkdir -p crash
          zstd -T0 -10 "build/x86_64/$CONFIG_NAME/harddrive.img" -o crash/harddrive.img.zst

      - uses: actions/upload-artifact@v4
        if: env.CONFIG_NAME == 'ferric-smoke'
        with:
          name: ferric-smoke-image-crash
          path: crash/harddrive.img.zst
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            recipes/**/target/*/build/*.log
            recipes/**/target/*/*.log
          if-no-files-found: ignore
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cpu: [host]
        # "vtd" boots the same image with an emulated Intel IOMMU: every PCI driver
        # (nvmed, e1000d, ahcid) binds a DMA domain of its own when it connects to
        # pcid, the kernel's DMA-domain self-test runs, and ferric-iommu-test drives
        # QEMU's edu device through its domain. "enforce" boots the image whose kernel
        # has kernel.iommu = "enforce" on the same machine: drivers without a bound
        # domain get no DMA addresses and unattached devices are blocked, so reaching
        # the smoke-test marker from disk shows the real drivers DMA through their
        # domains. "amdvi" and "amdvi-enforce" do the same with an emulated AMD IOMMU
        # (DMA remapping only), under QEMU 10 in a container (see the boot step).
        iommu: [none, vtd, enforce, amdvi, amdvi-enforce]
        nic: [e1000]
        # The same image with a virtio-net card: ferric-netq-test runs on virtio-netd, and its
        # benchmarks give virtio-net numbers next to e1000's.
        include:
          - cpu: host
            iommu: none
            nic: virtio
    env:
      LOG: serial-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}${{ matrix.nic != 'e1000' && format('-{0}', matrix.nic) || '' }}.log
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@v4
        with:
          name: ${{ (matrix.iommu == 'enforce' || matrix.iommu == 'amdvi-enforce') && 'ferric-smoke-image-enforce' || 'ferric-smoke-image' }}

      - name: Boot smoke test
        env:
          # The fuzzing image runs for 20 minutes before it shuts down.
          BOOT_TIMEOUT: ${{ env.CONFIG_NAME == 'ferric-fuzz' && '1800' || '300' }}
          BOOT_IOMMU: ${{ matrix.iommu == 'enforce' && 'vtd' || startsWith(matrix.iommu, 'amdvi') && 'amdvi' || matrix.iommu }}
          BOOT_NIC: ${{ matrix.nic }}
        run: |
          zstd -d harddrive.img.zst -o harddrive.img
          if [ -f kernel.elf.zst ]; then
            zstd -q -d kernel.elf.zst -o kernel.elf
            export KERNEL_ELF="$PWD/kernel.elf"
          fi
          if [ "$BOOT_IOMMU" = amdvi ]; then
            # Ubuntu 24.04's QEMU 8.2 does not translate DMA through amd-iommu (dma-remap
            # came in QEMU 10), so the AMD-Vi boots run Ubuntu 26.04's QEMU in a container,
            # with the runner's KVM and OVMF.
            docker run --rm --device /dev/kvm -e BOOT_IOMMU -e BOOT_NIC -e BOOT_TIMEOUT \
              -v "$PWD:/work" -w /work -v /usr/share/ovmf:/usr/share/ovmf:ro ubuntu:26.04 \
              bash -c 'set -e
                apt-get update -q
                DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
                  qemu-system-x86 ipxe-qemu > /dev/null
                qemu-system-x86_64 --version
                scripts/ferric-ci/boot-smoke.sh harddrive.img "$0" "$1"' "$LOG" ${{ matrix.cpu }}
          else
            scripts/ferric-ci/boot-smoke.sh harddrive.img "$LOG" ${{ matrix.cpu }}
          fi

      - name: Check KASLR, KPTI and PCID ran
        run: |
          grep -aF "KASLR: physical memory map randomized" "$LOG"
          grep -aF "KASLR: kernel image randomized" "$LOG"
          grep -aF "KPTI: user page tables isolated from the kernel" "$LOG"
          # kernel.cpu.pcid defaults to "auto": with -cpu host the guest gets PCID and INVPCID
          # whenever the runner has them, and then KPTI must use them.
          if grep -qw pcid /proc/cpuinfo && grep -qw invpcid /proc/cpuinfo; then
            grep -aF "KPTI: PCID enabled, no-flush CR3 switches" "$LOG"
          else
            echo "::warning::runner CPU lacks PCID or INVPCID; KPTI ran without PCID"
            if grep -aF "KPTI: PCID enabled" "$LOG"; then exit 1; fi
          fi

      # This image forces kpti = "always", and shadow stacks are left off whenever KPTI is on, so
      # CET is never enabled on this boot regardless of what the runner's CPU reports. Whether KVM
      # passes CET_SS through depends on the runner, so accept either decision but require the
      # detection line and the matching "left off"/"not enabled" line (never the "enabling CET" one).
      - name: Check shadow-stack detection
        run: |
          grep -aF "CET: shadow-stack pool isolation self-test passed" "$LOG"
          grep -aE "CET: shadow stacks supported=(true|false) policy=auto decision=(on|off)" "$LOG"
          grep -aE "CET: (shadow stacks not enabled on this boot|supervisor shadow stacks allocated but left off \(KPTI is on)" "$LOG"
          if grep -aF "CET: supervisor shadow stacks allocated for every kernel stack; enabling CET" "$LOG"; then
            echo "::error::shadow stacks were enabled despite KPTI being forced on"
            exit 1
          fi

      # fox replaced pkg (config/ferric-smoke.toml): on first boot it adopted every
      # package the installer put in the image, each with a signed manifest the
      # cookbook packed into it (FERRIC_FOX_MANIFEST), and re-checked them all.
      - name: Check fox package management
        run: |
          grep -aE "adopted ([0-9]+) of \1 packages" "$LOG"
          grep -aE "fox 0\.1\.0 \([0-9]+ files, signed by cookbook\)" "$LOG"
          if grep -aF "unsigned name" "$LOG"; then
            echo "::error::packages were adopted without a signed manifest"
            exit 1
          fi
          grep -aF "FERRIC_TEST_PASS fox-verify" "$LOG"

      - name: Check futex wakeups
        run: grep -aF "FERRIC_TEST_PASS futex-wake-race" "$LOG"

      # A process exits while a second thread is still busy (#200): ferric-exit-test must run.
      - name: Check process exit with a busy thread
        run: grep -aF "FERRIC_TEST_PASS exit-busy-thread" "$LOG"

      # The image has kernel.sys_proc on, so ferric-proc-test must run every step, not skip.
      - name: Check per-process introspection
        run: |
          for step in parse self images slice guard cap root-only; do
            grep -aF "FERRIC_TEST_PASS proc-$step" "$LOG"
          done
          grep -aE "FERRIC_TEST_PASS proc-(self|images)" "$LOG" | tr -d '\r' | sed 's/^.*FERRIC_TEST_PASS //' | while read -r line; do
            echo "::notice::$line"
          done
      # A process opens a scheme it created on the same thread and serves from another: the
      # kernel must block the caller rather than direct-switch it to itself.
      - name: Check a scheme opened by its creating thread
        run: grep -aF "FERRIC_TEST_PASS scheme-self-open" "$LOG"

      # The image has kernel.regbuf on, so ferric-regbuf-test must run every step, not skip.
      - name: Check registered buffers
        run: |
          steps="register file-backed grant-rw grant-ro pinned reshare-mmap reshare-register reshare-borrow
            forward-borrow revoke unmap close shared bytes bounce-newer revoke-prot"
          for step in $steps; do
            grep -aF "FERRIC_TEST_PASS regbuf-$step" "$LOG"
          done
          echo "::notice::ferric-regbuf-test passed all $(wc -w <<< "$steps") steps"

      # nvmed DMAs into ferric-blkgrant-test's registered buffer through a grant mapped in
      # its domain (drivers.grant_dma); without an IOMMU the grant steps skip. Both print the
      # read benchmark, which the step repeats as a notice.
      - name: Check storage DMA into registered buffers
        run: scripts/ferric-ci/check-blkgrant-log.sh ${{ matrix.iommu == 'vtd' && 'auto' || matrix.iommu }} "$LOG"
      # The Phase 2 disk benchmark (ferric-iobench): IOPS, bandwidth and latency percentiles of
      # fio-style jobs with each of nvmed's queue policies, one queue against per-CPU queues
      # in the same boot. The figures go to a notice and the job summary; the per-CPU default
      # must reach the single queue within the A/B gate's noise (ferric_blkqueue::ab).
      - name: Check the disk benchmark
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: scripts/ferric-ci/check-iobench-log.sh ${{ matrix.iommu }} "$LOG"
      - name: Check Adaptive requests actually overlap in dispatch
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: grep -aF "nvmed: Adaptive overlap dispatched" "$LOG"
      # The image has kernel.trace on, so ferric-trace-test must run every step, not skip.
      - name: Check kernel tracing
        run: |
          grep -aF "trace: sched.switch on from boot (trace.boot)" "$LOG"
          # Bootstrap applied the initfs trace.toml; the kernel logs the command.
          grep -aF "trace: enable scheme.cancel (1 event(s) changed)" "$LOG"
          for step in initfs boot enable decode order write read yield sched scheme disable mmap fault mapping journal futex lifecycle proc irq filter clock cap; do
            grep -aF "FERRIC_TEST_PASS trace-$step" "$LOG"
          done
          # The page fault and interrupt steps' details: record counts, and the interrupt
          # seen delivered and acknowledged.
          grep -aE "FERRIC_TEST_PASS trace-(fault|irq)[: ]" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          # trace-irq comes from ferric-iommu-test, which acknowledges an interrupt itself.
          echo "::notice::ferric-trace-test passed all 21 steps, ferric-iommu-test trace-irq"
          # The kernel logged the argument filter trace-filter set (T3c).
          grep -aF "trace: filter syscall.enter nr == " "$LOG"
          # The kernel logged the timestamp clock it picked (T3d); trace-clock checked its
          # rate against the wall clock. Both go up as notices.
          grep -qaE "trace: clock (tsc|kvmclock|hpet) \(" "$LOG"
          grep -aE "trace: clock (tsc|kvmclock|hpet) \(" "$LOG" | tr -d '\r' | sed 's/^.*trace: clock/trace: clock/' | while read -r line; do
            echo "::notice::$line"
          done
          grep -aF "FERRIC_TEST_PASS trace-clock" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          # The ferric-trace tool saved a capture of every CPU and decoded it.
          grep -aF "FERRIC_TEST_PASS trace-capture" "$LOG"
          if [ "$CONFIG_NAME" = ferric-smoke ]; then
            grep -aF "FERRIC_TEST_PASS trace-bench" "$LOG"
            # kernel.trace_crash reserved and armed its region; a clean boot has no dump.
            grep -aF "FERRIC_TEST_SKIP trace-crash" "$LOG"
          fi
          grep -aF "trace: crash region at 0x4000000 (64 KiB)" "$LOG"
          # kernel.log_persist reserved and armed its region right after it; a cold boot is
          # boot 0 and has no previous log.
          grep -aF "log: persistent log at 0x4010000 (64 KiB), boot 0" "$LOG"
          if grep -aF "log: the previous boot's log (" "$LOG"; then
            echo "::error::a cold boot found a previous boot's log"
            exit 1
          fi

      # The image has kernel.rings on, so ferric-ring-test must run every step, not skip.
      - name: Check rings
        run: |
          for step in setup refuse-setup nop file chain cancel refuse-sqe incomplete backpressure corrupt event fixed fstat hold release async async-close wait-sync bench; do
            grep -aF "FERRIC_TEST_PASS ring-$step" "$LOG"
          done
          grep -aF "FERRIC_BENCH ring" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          echo "::notice::ferric-ring-test passed all 19 steps"

      # The image has kernel.page_cache on, so ferric-pcache-test must run every step, not
      # skip, including the ones on RedoxFS, which then serves read-only files from the cache.
      - name: Check the page cache
        run: |
          for step in miss hit readahead eio bad-answer restore owner exec invalidate generation close redoxfs redoxfs-mmap redoxfs-bench; do
            grep -aF "FERRIC_TEST_PASS pcache-$step" "$LOG"
          done
          grep -aF "FERRIC_BENCH pcache" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          echo "::notice::ferric-pcache-test passed all 14 steps"
      # The image has drivers.net_bypass and kernel.regbuf on, so ferric-netq-test must run
      # every step, not skip: a queue socket on e1000d (or virtio-netd) in copy mode, beside
      # netstack.
      - name: Check kernel-bypass queue sockets
        run: |
          steps="netstack attach checks arp steer ping stats own udp spoof tx-bounds bench latency close"
          for step in $steps; do
            grep -aF "FERRIC_TEST_PASS netq-$step" "$LOG"
          done
          # The test ran on the NIC this boot has (virtio-netd names its scheme *_virtio_net).
          if [ "${{ matrix.nic }}" = virtio ]; then
            grep -aE "netq: network\.[^,]+_virtio_net, " "$LOG"
          else
            grep -aE "netq: network\.[^,]+, " "$LOG"
            if grep -aE "netq: network\.[^,]+_virtio_net, " "$LOG"; then exit 1; fi
          fi
          # The counters, and the benchmarks against netstack (QEMU numbers, for trend only).
          tx='FERRIC_BENCH netq-tx-udp60 .*bypass_fps=[0-9]+ netstack_fps=[0-9]+'
          rtt='FERRIC_BENCH netq-echo-rtt .*bypass_p50_us=[0-9]+ bypass_p99_us=[0-9]+ .*netstack_p50_us=[0-9]+ netstack_p99_us=[0-9]+'
          grep -aE "netq: network\.|netq: rx_packets=[0-9]+ tx_packets=[0-9]+|$tx|$rtt" "$LOG" \
            | tr -d '\r' | while read -r line; do
            echo "::notice title=netq (${{ matrix.nic }})::$line"
          done
          grep -aE "$tx" "$LOG"
          grep -aE "$rtt" "$LOG"
          echo "::notice::ferric-netq-test passed all $(wc -w <<< "$steps") steps on ${{ matrix.nic }}"
      # ferric-borrow-test times page writes to an unmapped file and to one with live shared
      # mappings, which RedoxFS writes through to (QEMU numbers, for trend only). Only the
      # smoke image runs it; the fuzz image's console script runs the fuzzer alone.
      - name: Show the mapped-write benchmark
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: |
          grep -aE "FERRIC_BENCH borrow-pwrite .*unmapped_ns=[0-9]+ mapped_ns=[0-9]+" "$LOG" \
            | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
      # fs.ext4 is on, so ferric-ext4-test mounts its image with ext4d and runs every step;
      # fs.ext4_journal_replay is on too, so ext4-journal replays a journal and must pass.
      - name: Check ext4
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: |
          for step in image mount list read stat erofs journal; do
            grep -aF "FERRIC_TEST_PASS ext4-$step" "$LOG"
          done
          echo "::notice::ferric-ext4-test passed all 7 steps"

      # fs.luks and fs.lvm are on, so ferric-blocklayer-test serves LVM on LUKS (4 KiB
      # sectors), LUKS on LVM and LUKS1 with ferric-blockd and runs every step.
      - name: Check the block layer
        if: env.CONFIG_NAME == 'ferric-smoke'
        run: |
          for step in image lvm-on-luks luks-on-lvm luks1 erofs access refuse; do
            grep -aF "FERRIC_TEST_PASS blocklayer-$step" "$LOG"
          done
          echo "::notice::ferric-blocklayer-test passed all 7 steps"

      - name: Check the IOMMU
        # The kernel's attach, bind, fault and release lines, the test driver's results, and
        # that the disk, network and AHCI drivers each DMA through a domain they bound.
        run: scripts/ferric-ci/check-iommu-log.sh ${{ matrix.iommu == 'vtd' && 'auto' || matrix.iommu }} "$LOG"

      # The tail of the serial log as annotations, readable through the check-run API when
      # the log artifact cannot be fetched.
      - name: Annotate the serial log on failure
        if: failure()
        run: |
          # Test results and IOMMU, pcid and interrupt lines first, then the tail.
          tr -d '\r' < "$LOG" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > "$RUNNER_TEMP/clean.log" || true
          { grep -aE 'FERRIC_TEST_(FAIL|SKIP)|FERRIC_IOMMU|IOMMU|pcid|iommu|interrupt|panic|PANIC|EXCEPTION|pcache|Page fault' "$RUNNER_TEMP/clean.log" \
              | grep -av 'funmap passed' | tail -n 120
            grep -av 'funmap passed' "$RUNNER_TEMP/clean.log" | tail -n 40; } > "$RUNNER_TEMP/tail.log" || true
          split -l 40 "$RUNNER_TEMP/tail.log" "$RUNNER_TEMP/tail."
          for part in "$RUNNER_TEMP"/tail.a?; do
            body="$(sed 's/%/%25/g' "$part" | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::notice title=serial log ($(basename "$part"))::$body"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-${{ matrix.cpu }}${{ matrix.iommu != 'none' && format('-{0}', matrix.iommu) || '' }}${{ matrix.nic != 'e1000' && format('-{0}', matrix.nic) || '' }}
          path: ${{ env.LOG }}
          retention-days: 14

  # Tracing overhead budget (roadmap Phase T). ferric-trace-bench times null system
  # calls and RedoxFS requests on the image without kernel.trace and, with all events
  # off and then alternating off and on, on the image with it. Ten boots of each, interleaved, and
  # the median of each boot's fastest round of each kind keep boot-to-boot noise out
  # of the comparison. scripts/ferric-ci/check-trace-overhead.sh holds the budgets.
  # The crash dump across a warm reboot (kernel.trace_crash). The crash image's kernel has the
  # test hook: on the first boot ferric-trace-test panics it, the panic handler writes the dump
  # and resets the machine, and QEMU (without -no-reboot) boots again with RAM as it was. The
  # second boot finds the dump, and ferric-trace-test checks its message and records.
  crash:
    needs: build
    if: github.event_name != 'schedule' && (inputs.config || 'ferric-smoke') == 'ferric-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOG: serial-crash.log
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@v4
        with:
          name: ferric-smoke-image-crash

      - name: Boot, panic, reboot and read the dump
        env:
          BOOT_REBOOT: "1"
          BOOT_TIMEOUT: "600"
        run: |
          set -o pipefail
          zstd -d harddrive.img.zst -o harddrive.img
          # boot-smoke.sh's verdict goes to the failure annotations too.
          scripts/ferric-ci/boot-smoke.sh harddrive.img "$LOG" host 2>&1 | tee boot-smoke.out

      - name: Check the crash dump
        run: |
          # First boot: the test panicked the kernel, which wrote the dump and reset.
          grep -aF "FERRIC_TEST_PASS trace-crash-armed" "$LOG"
          grep -aF "ferric-trace crash test (kernel.trace_crash_test)" "$LOG"
          grep -aF "trace: crash dump written" "$LOG"
          grep -aF "RESET" "$LOG"
          # Second boot: the kernel found the dump, and the test read it back.
          grep -aF "trace: the previous boot panicked on CPU" "$LOG"
          grep -aF "trace: its crash dump (" "$LOG"
          grep -aF "FERRIC_TEST_PASS trace-crash-read" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          grep -aF "FERRIC_TEST_PASS trace-crash-read" "$LOG"
          # The persistent log: the second boot is boot 1 and found the first boot's log,
          # whose panic the test read back from /scheme/sys/log_previous.
          grep -aF "log: persistent log at 0x4010000 (64 KiB), boot 1" "$LOG"
          grep -aF "log: the previous boot's log (" "$LOG"
          grep -aF "FERRIC_TEST_PASS log-previous" "$LOG" | tr -d '\r' | while read -r line; do
            echo "::notice::$line"
          done
          grep -aF "FERRIC_TEST_PASS log-previous" "$LOG"
          # Exactly two boots.
          test "$(grep -acF "FERRIC_SMOKE_BEGIN" "$LOG")" = 2

      - name: Annotate the serial log on failure
        if: failure()
        run: |
          [ -f "$LOG" ] || exit 0
          # An annotation keeps only its first few KiB, so each one is short: the test results,
          # the kernel's crash-dump and reset lines, then the end of the log.
          annotate() {
            tr -d '\r' | tail -c 3500 | sed -e 's/%/%25/g' \
              | awk -v title="$1" 'BEGIN { printf "::error title=%s::", title } { printf "%s%%0A", $0 } END { print "" }'
          }
          # boot-smoke.sh prints the markers from the log with the console's CRs removed.
          [ -f boot-smoke.out ] && grep -a '^FERRIC_\(TEST_FAIL\|TEST_PASS trace-crash\|SMOKE_\)' boot-smoke.out \
            | annotate "crash boot results" || true
          tr -d '\r' < "$LOG" | grep -aE 'trace: |KERNEL PANIC|panicked at|RESET|HALT|kreset|Reset with|UNHANDLED' \
            | grep -avE 'trace: (enable|disable) ' | annotate "crash boot kernel lines" || true
          tail -n 30 "$LOG" | annotate "crash boot serial log (tail)"
          [ -f boot-smoke.out ] && grep -a '^boot-smoke:' boot-smoke.out | annotate "boot-smoke verdict" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-crash
          path: ${{ env.LOG }}
          retention-days: 7

  trace-overhead:
    needs: build
    if: github.event_name != 'schedule' && (inputs.config || 'ferric-smoke') == 'ferric-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf zstd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/download-artifact@v4
        with:
          name: ferric-smoke-image
          path: trace

      - uses: actions/download-artifact@v4
        with:
          name: ferric-smoke-image-notrace
          path: notrace

      # Log downloads are not always readable, so every result and failure is an annotation.
      - name: Boot both images ten times
        env:
          # A boot takes about 20 seconds. The check takes the median over boots, and the
          # spread between boots (about 3% here) is larger than the 1% budget.
          BENCH_BOOTS: "10"
        run: |
          for image in notrace trace; do
            zstd -q -d "$image/harddrive.img.zst" -o "$image/harddrive.img"
          done
          failed=0
          for run in $(seq 1 "$BENCH_BOOTS"); do
            for image in notrace trace; do
              log="bench-$image-$run.log"
              status=0
              scripts/ferric-ci/boot-smoke.sh "$image/harddrive.img" "$log" host > /dev/null || status=$?
              tr -d '\r' < "$log" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > "$log.clean" || true
              results="$(grep -aoE 'FERRIC_BENCH (io|syscall|lost) .*|FERRIC_TEST_[A-Z]+ trace(-bench|-capture|:).*' "$log.clean" || true)"
              # GitHub keeps ten notices per step and 4 KiB of each, so the boots' results
              # are collected and printed in parts, below.
              printf 'boot %s exit %s\n%s\n' "$run" "$status" "$results" >> "results-$image.txt"
              # Test results and crash lines first: an unhandled exception's process name
              # is printed above its register dump, out of reach of a short tail.
              tail="$({ grep -aE 'FERRIC_TEST_|EXCEPTION|panic|PANIC' "$log.clean" | grep -av 'funmap passed' | tail -n 40
                grep -av 'funmap passed' "$log.clean" | tail -n 30; } | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
              if [ "$status" -ne 0 ] || ! grep -qaF "FERRIC_TEST_PASS trace-bench" "$log.clean"; then
                failed=1
                echo "::error title=$image boot $run::boot exit $status, or no FERRIC_TEST_PASS trace-bench. Results and crash lines, then the serial tail:%0A$tail"
              fi
              # The kernel without kernel.trace must make ferric-trace-test skip, not fail.
              if [ "$image" = notrace ] && ! grep -qaF "FERRIC_TEST_SKIP trace: no" "$log.clean"; then
                failed=1
                echo "::error title=$image boot $run::ferric-trace-test did not skip on the kernel without kernel.trace"
              fi
              if [ "$image" = notrace ] && ! grep -qaF "FERRIC_TEST_SKIP trace-capture: no" "$log.clean"; then
                failed=1
                echo "::error title=$image boot $run::the trace capture check did not skip on the kernel without kernel.trace"
              fi
            done
          done
          for image in notrace trace; do
            split -C 3500 "results-$image.txt" "results-$image.part."
            for part in results-"$image".part.*; do
              body="$(sed 's/%/%25/g' "$part" | sed ':a;N;$!ba;s/\n/%0A/g')"
              echo "::notice title=$image boots ($part)::$body"
            done
          done
          exit "$failed"

      - name: Check the overhead budget
        run: |
          scripts/ferric-ci/check-trace-overhead.sh --out bench-notrace-*.log --in bench-trace-*.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-overhead-logs
          path: bench-*.log
          retention-days: 14
